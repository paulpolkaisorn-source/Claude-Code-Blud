<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Render harness</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <style>
    html,body{margin:0;height:100%;background:#123;overflow:hidden}
    canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { test, assert, run } from './harness.js';
    import { bus, EV, isMobile } from '../../src/contracts.js';
    import { createRenderer } from '../../src/render/renderer.js';
    import { createAutoQuality, pixelRatioFor, QUALITY_PRESETS } from '../../src/render/quality.js';
    import { toonMat, addOutline } from '../../src/render/toon.js';

    // Software GL notes: every frame is flushed with finish() and the suite never yields. Under SwiftShader, a
    // canvas that has already been drawn to stalls when it is created or resized, so every canvas size change in
    // this file happens before that canvas is drawn. The resize and dispose checks run first, on fresh canvases.
    const mobile = isMobile();
    const canvas = document.getElementById('c');
    let clockMs = 0;                                   // fake clock for the FPS watchdog
    const clock = () => clockMs;
    const T = { x: 9.0, z: 14.0 };                     // look-at target used by most checks

    function freshCanvas(w, h) {
      const c = document.createElement('canvas');
      c.style.cssText = `position:fixed;left:0;top:0;width:${w}px;height:${h}px;display:block`;
      document.body.appendChild(c);
      return c;
    }

    // A renderer plus a stub arena: a floor, five cubes and one glowing crystal.
    function buildStage(cv) {
      const r = createRenderer(cv, { mobile, clock });
      r.setArenaBounds(21, 33);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(21, 33), toonMat(0x7cc46a));
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(10.5, 0, 16.5);
      floor.receiveShadow = true;
      r.scene.add(floor);
      const cubeGeo = new THREE.BoxGeometry(1, 1.2, 1);
      const cubeSpots = [[6.5, 10.5, 0xff9f2e], [12.5, 12.5, 0x38e8ff], [9.5, 19.5, 0xb6ff3b],
        [14.5, 22.5, 0xffe14d], [4.5, 24.5, 0x3d9bff]];
      for (const [x, z, color] of cubeSpots) {
        const m = new THREE.Mesh(cubeGeo, toonMat(color));
        m.position.set(x, 0.6, z);
        m.castShadow = true;
        m.receiveShadow = true;
        addOutline(m);
        r.scene.add(m);
      }
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.4),
        toonMat(0xc46bff, { emissive: 0xc46bff, emissiveIntensity: 2.5 }));
      crystal.position.set(7.5, 0.9, 15.5);
      crystal.castShadow = true;
      r.scene.add(crystal);
      return r;
    }

    const R = buildStage(canvas);
    const W = () => canvas.clientWidth;
    const H = () => canvas.clientHeight;

    // Advances the fake clock and renders n frames on renderer r, flushing each frame with finish().
    function frame(r, n = 1, dt = 1 / 60) {
      const gl = r.renderer.getContext();
      for (let i = 0; i < n; i++) {
        clockMs += dt * 1000;
        r.render(dt);
        gl.finish();
      }
    }

    test('resize updates aspect and fits ~15.5 tiles landscape, ~12 portrait', () => {
      const c2 = freshCanvas(400, 800);
      const R2 = buildStage(c2);
      R2.snap(T.x, T.z);
      const e = { x: 0, y: 0, visible: false };
      assert(Math.abs(R2.camera.aspect - 0.5) < 1e-6, `portrait aspect ${R2.camera.aspect}`);
      const dPortrait = R2.camera.position.distanceTo(new THREE.Vector3(T.x, 0, T.z));
      R2.worldToScreen(T.x + 6, 0, T.z, e);
      assert(Math.abs(e.x - 400) < 1.5, `portrait: 12 tiles should span the width, edge at x=${e.x}`);

      c2.style.width = '800px';
      c2.style.height = '400px';
      R2.resize();
      assert(Math.abs(R2.camera.aspect - 2) < 1e-6, `landscape aspect ${R2.camera.aspect}`);
      const dLandscape = R2.camera.position.distanceTo(new THREE.Vector3(T.x, 0, T.z));
      R2.worldToScreen(T.x + 7.75, 0, T.z, e);
      assert(Math.abs(e.x - 800) < 1.5, `landscape: 15.5 tiles should span the width, edge at x=${e.x}`);
      assert(dPortrait > dLandscape * 2, `portrait should zoom out (${dPortrait} vs ${dLandscape})`);
      R2.dispose();
      c2.remove();
    });

    test('a second renderer draws and disposes cleanly, and the main one keeps working', () => {
      const c4 = freshCanvas(64, 64);
      const R4 = buildStage(c4);
      frame(R4, 2);
      assert(R4.stats().drawCalls > 0, 'second renderer drew nothing');
      R4.dispose();
      c4.remove();
    });

    test('autoQuality drops to low once after 3 s under 45 fps', () => {
      // The main canvas is still undrawn here, so shrinking it is safe. It stays small for the rest of the file.
      canvas.style.width = '160px';
      canvas.style.height = '90px';
      R.resize();
      R.snap(T.x, T.z);
      R.setQuality('high');
      const drops = [];
      const off = bus.on(EV.QUALITY_CHANGE, (p) => drops.push(p.level));
      R.autoQuality(true);
      try {
        frame(R, 200, 1 / 60);
        assert(drops.length === 0 && R.stats().quality === 'high', 'dropped while running at 60 fps');
        // Feed 30 fps frames until the watchdog drops quality. Rendering stops at the drop, so this never draws in
        // low quality (see the note in the setQuality test).
        const gl = R.renderer.getContext();
        let k = 0;
        while (R.stats().quality === 'high' && k < 300) {
          clockMs += 1000 / 30;
          R.render(1 / 30);
          gl.finish();
          k++;
        }
        assert(drops.length === 1 && drops[0] === 'low', `expected one low drop, got ${drops}`);
        assert(R.stats().quality === 'low' && !R.renderer.shadowMap.enabled, 'not low after the drop');
        assert(k >= 85 && k <= 105, `drop after ${k} frames at 30 fps, expected about 90 (3 s)`);
      } finally {
        off();
        R.autoQuality(false);
        R.setQuality('high');
      }
    });

    test('boots with shadows, bloom and a stable per-frame draw count', () => {
      R.snap(T.x, T.z);
      frame(R, 30);
      const s = R.stats();
      assert(s.drawCalls > 0, `drawCalls ${s.drawCalls}`);
      assert(s.drawCalls < 150, `drawCalls ${s.drawCalls} over budget`);
      assert(s.triangles > 0, 'no triangles');
      assert(s.quality === 'high' && s.bloom && s.shadows, `stats ${JSON.stringify(s)}`);
      assert(R.renderer.getPixelRatio() <= (mobile ? 1.5 : 2) + 1e-9, 'pixel ratio over cap');
      const first = s.drawCalls;
      frame(R, 10);
      assert(R.stats().drawCalls === first, `draw count drifted ${first} -> ${R.stats().drawCalls}`);
    });

    test('sun shadow frustum is 2048 and covers the arena', () => {
      const c = R.sun.shadow.camera;
      assert(R.sun.shadow.mapSize.x === 2048 && R.sun.shadow.mapSize.y === 2048, 'shadow map size');
      assert(c.right >= 18 && c.top >= 18, `frustum half-size ${c.right}`);
    });

    test('worldToScreen puts the look-at target at the viewport centre', () => {
      R.snap(T.x, T.z);
      const o = { x: 0, y: 0, visible: false };
      R.worldToScreen(T.x, 0, T.z, o);
      assert(Math.abs(o.x - W() / 2) < 1.5 && Math.abs(o.y - H() / 2) < 1.5,
        `target at (${o.x}, ${o.y}), centre (${W() / 2}, ${H() / 2})`);
      assert(o.visible, 'target not visible');
    });

    test('screenToGround inverts the centre ray back onto the target', () => {
      R.snap(T.x, T.z);
      const g = { x: 0, z: 0, hit: false };
      R.screenToGround(W() / 2, H() / 2, g);
      assert(g.hit, 'centre ray misses the ground');
      assert(Math.abs(g.x - T.x) <= 0.5 && Math.abs(g.z - T.z) <= 0.5, `centre hits (${g.x}, ${g.z})`);
      const s = { x: 0, y: 0, visible: false };
      for (const [fx, fy] of [[0.1, 0.2], [0.9, 0.85], [0.5, 0.95]]) {
        R.screenToGround(fx * W(), fy * H(), g);
        R.worldToScreen(g.x, 0, g.z, s);
        assert(Math.abs(s.x - fx * W()) < 1 && Math.abs(s.y - fy * H()) < 1, `round trip off at ${fx},${fy}`);
      }
    });

    test('follow damps toward its target and clamps to the arena', () => {
      R.snap(T.x, T.z);
      for (let i = 0; i < 240; i++) R.follow(12, 20, 1 / 60);
      const g = {};
      R.screenToGround(W() / 2, H() / 2, g);
      assert(Math.abs(g.x - 12) < 0.05 && Math.abs(g.z - 20) < 0.05, `converged to (${g.x}, ${g.z})`);
      R.snap(-40, 99);
      R.screenToGround(W() / 2, H() / 2, g);
      // Clamp keeps the view on the arena: x within [halfWidth-1, cols-halfWidth+1], z within [6, rows-4].
      assert(g.x > 4 && g.x < 8 && Math.abs(g.z - 29) < 0.01, `clamped to (${g.x}, ${g.z})`);
      R.snap(T.x, T.z);
    });

    test('setQuality low disables shadows and bloom; high restores them', () => {
      R.setQuality('low');
      let s = R.stats();
      assert(!R.renderer.shadowMap.enabled && !R.sun.castShadow, 'shadows still on in low');
      assert(!s.bloom && !s.shadows && s.quality === 'low', `low stats ${JSON.stringify(s)}`);
      assert(R.renderer.getPixelRatio() === 1, `low pixel ratio ${R.renderer.getPixelRatio()}`);
      // The first low-quality draw costs about 20 s of software-GL work on desktop, so it is only drawn under
      // mobile emulation, where it is cheap.
      if (mobile) {
        frame(R, 3);
        assert(R.stats().drawCalls > 0, 'low path draws nothing');
      }
      R.setQuality('high');
      s = R.stats();
      assert(R.renderer.shadowMap.enabled && R.sun.castShadow && s.bloom && s.quality === 'high',
        `high not restored ${JSON.stringify(s)}`);
      assert(R.renderer.getPixelRatio() <= (mobile ? 1.5 : 2) + 1e-9, 'pixel ratio over cap');
      frame(R, 3);
    });

    test('screen shake offsets the view and decays back to rest', () => {
      R.snap(T.x, T.z);
      frame(R, 2);
      const rest = R.camera.position.clone();
      R.shake(1, 0.4);
      let peak = 0;
      for (let i = 0; i < 4; i++) {
        frame(R, 1);
        peak = Math.max(peak, R.camera.position.distanceTo(rest));
      }
      assert(peak > 0.01, `shake moved the camera only ${peak}`);
      frame(R, 30);
      const drift = R.camera.position.distanceTo(rest);
      assert(drift < 1e-4, `view did not return to rest (${drift})`);
      const o = { x: 0, y: 0, visible: false };
      R.worldToScreen(T.x, 0, T.z, o);
      assert(Math.abs(o.x - W() / 2) < 1.5 && Math.abs(o.y - H() / 2) < 1.5, 'view not centred after shake');
    });

    test('EV.SCREEN_SHAKE on the bus shakes the view', () => {
      R.snap(T.x, T.z);
      frame(R, 2);
      const rest = R.camera.position.clone();
      bus.emit(EV.SCREEN_SHAKE, { intensity: 0.6, duration: 0.2 });
      let peak = 0;
      for (let i = 0; i < 4; i++) {
        frame(R, 1);
        peak = Math.max(peak, R.camera.position.distanceTo(rest));
      }
      assert(peak > 0.01, `bus shake moved the camera only ${peak}`);
      frame(R, 20);
      assert(R.camera.position.distanceTo(rest) < 1e-4, 'bus shake did not settle');
    });

    test('watchdog trips once after 3 s of sub-45 fps and ignores a short dip', () => {
      const aq = createAutoQuality({ threshold: 45, sustain: 3 });
      aq.set(true);
      let trips = 0;
      const feed = (n, sec) => { for (let i = 0; i < n; i++) if (aq.frame(sec)) trips++; };
      feed(192, 1 / 60);
      assert(trips === 0, 'tripped at 60 fps');
      feed(60, 1 / 30);
      assert(trips === 0, 'tripped on a 2 s dip');
      feed(60, 1 / 60);
      assert(trips === 0, 'tripped after recovery');
      feed(120, 1 / 30);
      assert(trips === 1, `expected one trip, got ${trips}`);
      feed(120, 1 / 30);
      assert(trips === 1, 'watchdog fired again after disarming');
      assert(Math.abs(aq.fps - 30) < 1, `fps ${aq.fps}`);
    });

    test('pixel ratio caps by preset and device class', () => {
      assert(pixelRatioFor('high', 3, false) === 2, 'desktop cap');
      assert(pixelRatioFor('high', 3, true) === 1.5, 'mobile cap');
      assert(pixelRatioFor('high', 1, false) === 1, 'dpr 1');
      assert(pixelRatioFor('low', 3, false) === 1, 'low ignores dpr');
      assert(!QUALITY_PRESETS.low.shadows && !QUALITY_PRESETS.low.bloom, 'low preset');
    });

    await run();
  </script>
</body>
</html>

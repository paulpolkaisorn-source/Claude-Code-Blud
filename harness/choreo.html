<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>choreo harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f1ece0;
      }
      /* Layering as index.html (architecture section 7): the canvas behind main, the footer positioned. */
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
        pointer-events: none;
      }
      main {
        position: relative;
        z-index: 1;
      }
      footer {
        position: relative;
      }
      /* Heights from architecture section 4, in viewport heights. The preloader is in the flow with no height. */
      #preloader {
        height: 0;
      }
      #hero {
        height: 200vh;
      }
      #speed {
        height: 300vh;
      }
      #capabilities {
        height: 300vh;
      }
      #code {
        height: 200vh;
      }
      #family {
        height: 200vh;
      }
      #pricing {
        height: 150vh;
      }
      #closing {
        height: 250vh;
      }
      #footer {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>
    <section id="preloader" data-theme="paper" data-act="1" aria-hidden="true"></section>
    <main id="main" tabindex="-1">
      <section id="hero" data-theme="paper" data-act="1"></section>
      <section id="speed" data-theme="paper" data-act="1"></section>
      <section id="capabilities" data-theme="ink" data-act="2"></section>
      <section id="code" data-theme="ink" data-act="2"></section>
      <section id="family" data-theme="ink" data-act="2"></section>
      <section id="pricing" data-theme="ink" data-act="3"></section>
      <section id="closing" data-theme="paper" data-act="3"></section>
    </main>
    <section id="footer" data-theme="paper" data-act="3"></section>
    <script type="module" src="/harness/choreo.ts"></script>
  </body>
</html>

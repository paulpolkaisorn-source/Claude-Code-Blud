<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>family gl harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #151512;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Stand-in for the family 2D stage (D20.1, D22.12). The harness moves its top with the progress: top = (1 - 2 s) H. */
      #anchor {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="anchor" data-anchor="family-stations" aria-hidden="true"></div>
    <script type="module" src="/harness/gl-family.ts"></script>
  </body>
</html>

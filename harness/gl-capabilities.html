<!doctype html>

  <head>

      html,
      body {
        margin: 0;

      }
      section {
        display: block;

    <canvas id="gl" aria-hidden="true"></canvas>
    <main>
      <section id="speed"></section>
      <section id="capabilities"></section>
      <section id="pricing"></section>
    </main>
    <script type="module" src="/harness/gl-capabilities.ts"></script>

<script>
'use strict';
// Clawd: Bug Bash. An original lane-defense game. Everything is drawn in code, no external assets.
const P2=CanvasRenderingContext2D.prototype;
if(!P2.roundRect)P2.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=600,COLS=9,ROWS=5,GX=150,GY=104,CW=86,CH=96,OR='#D97757',TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cellX=c=>GX+c*CW+CW/2,laneY=r=>GY+r*CH+CH-16;
let SC=1,screen='menu',S=null,TIME=0,UI=[],pend=0,loadSel=[];
const mouse={x:-99,y:-99};
const inR=(x,y,w,h)=>mouse.x>=x&&mouse.x<x+w&&mouse.y>=y&&mouse.y<y+h;
function fit(){const dpr=Math.min(window.devicePixelRatio||1,2),k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px';cv.width=Math.max(1,Math.round(W*k*dpr));cv.height=Math.max(1,Math.round(H*k*dpr));SC=cv.width/W;}

 pipe:{name:'Pipe Clawd',cost:250,hp:300,cd:9,col:'#D97757',desc:'Beam pierces the lane, even phased bugs.',ut:'Mega beam wrecks the whole lane.'},
 thread:{name:'Thread Clawd',cost:300,hp:300,cd:9,col:'#B678D6',desc:'Fires down three lanes at once.',ut:'Prompt storm in three lanes.'}};

 typo:{name:'Typo',hp:200,spd:17,cost:1,w:22,sc:1,col:'#6CBF4B',desc:'Tiny, slow, everywhere.'},
 nullptr:{name:'Null Pointer',hp:560,spd:17,cost:2,w:22,sc:1.05,col:'#5B7FA8',desc:'Hard hat. Takes nearly 3x the hits.'},
 race:{name:'Race Condition',hp:260,spd:38,cost:2,w:22,sc:.95,col:'#F0B429',desc:'Fast. Arrives before you are ready.'},
 heisen:{name:'Heisenbug',hp:320,spd:21,cost:3,w:22,sc:1,col:'#B48EF0',desc:'Flickers. Shots miss while it is phased.'},
 regress:{name:'Regression',hp:420,spd:17,cost:4,w:24,sc:1.1,col:'#3FB6A8',desc:'Fix it and two Typos pop out.'},
 leak:{name:'Memory Leak',hp:1400,spd:12,cost:6,w:30,sc:1.3,col:'#4C8DF0',desc:'Slow blob with a huge health pool.'},

const BORDER=Object.keys(BUG);
const ZONES=[
 {name:'localhost',a:'#1F3B35',b:'#24443C',bg:'#0F1F1C',acc:'#6EE7B7',twist:'Home turf. Free tokens drift in often.'},
 {name:'staging',a:'#2A2850',b:'#32305E',bg:'#131228',acc:'#A5B4FC',twist:'Fewer free tokens. LEGACY tiles block building.'},
 {name:'production',a:'#40242A',b:'#4B2B31',bg:'#1B0E11',acc:'#FCA5A5',twist:'Outages knock a random Clawd offline (503).'}];
const LEVELS=[
 {z:0,waves:6,grow:0.4,big:[5],types:['typo'],first:24,tip:'Place Token Clawds on the left, then Prompt Clawds. Hover coins to grab them.'},
 {z:0,waves:8,grow:0.45,big:[7],types:['typo','nullptr'],tip:'Firewall Clawd buys time. Put it in front of your shooters.'},
 {z:0,waves:9,grow:0.5,big:[4,8],types:['typo','nullptr','race'],tip:'Glowing bugs drop ULTRATHINK. Click the star, then a Clawd.'},
 {z:0,waves:10,grow:0.55,big:[4,9],types:['typo','nullptr','race','heisen'],tip:'Heisenbugs flicker. Shots miss while they are phased.'},
 {z:1,waves:10,grow:0.65,big:[4,9],types:['typo','nullptr','race','regress'],blocked:[[0,5],[2,3],[4,5]],tip:'Staging: fewer free tokens, and LEGACY tiles cannot be built on.'},
 {z:1,waves:11,grow:0.7,big:[5,10],types:['typo','nullptr','heisen','regress','leak'],blocked:[[1,2],[1,6],[3,2],[3,6]],tip:'Memory Leaks soak up damage. Stack firepower or delete them.'},
 {z:1,waves:12,grow:0.75,big:[5,11],types:['typo','nullptr','race','regress','leak'],blocked:[[0,4],[2,4],[4,4],[2,7]],tip:'Pipe Clawd hits every bug in its lane at once.'},
 {z:1,waves:12,grow:0.85,big:[4,8,11],types:['typo','nullptr','race','heisen','regress','leak'],blocked:[[0,3],[1,5],[3,5],[4,3],[2,1]],tip:'Three swarms in this one. Keep an rm -rf ready.'},
 {z:2,waves:12,grow:0.9,big:[5,11],types:['typo','nullptr','race','leak','merge'],tip:'Production: outages stun a Clawd (503). Merge Conflicts smash walls.'},
 {z:2,waves:13,grow:0.9,big:[4,8,12],types:['typo','nullptr','race','heisen','regress','leak','merge'],tip:'Ultrathink a Cache Clawd to freeze the whole field.'},
 {z:2,waves:14,grow:1,big:[4,9,13],types:['typo','nullptr','race','heisen','regress','leak','merge'],tip:'Everything at once. Economy first, then firepower.'},
 {z:2,waves:15,grow:1.05,big:[4,9,14],types:['typo','nullptr','race','heisen','regress','leak','merge'],tip:'Final deploy. Hold main and ship it.'}];
const UNL=['firewall','breakpoint','cache','linter','fork','rmrf','pipe','thread','7th card slot','+1 starting Ultrathink','+50 starting tokens','ON-CALL endless mode'];
let save={done:0,best:0,mute:false};
try{Object.assign(save,JSON.parse(localStorage.getItem('clawdBugBash1')||'{}'));}catch(e){}
const persist=()=>{try{localStorage.setItem('clawdBugBash1',JSON.stringify(save));}catch(e){}};
const unlocked=()=>ORDER.slice(0,2+Math.min(save.done,8)),slots=()=>save.done>=9?7:6;

// ---------- audio
let AC=null,NB=null;const lastS={};
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}else if(AC.state=='suspended')AC.resume();}
function tone(f,d,ty,v,sl){if(!AC||save.mute)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v){if(!AC||save.mute)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}const s=AC.createBufferSource(),g=AC.createGain(),t=AC.currentTime;s.buffer=NB;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d);}
function snd(n){const now=performance.now();if(lastS[n]&&now-lastS[n]<70)return;lastS[n]=now;
 switch(n){
 case'shoot':tone(620,.07,'square',.022,.6);break;
 case'hit':tone(180,.05,'triangle',.04,.7);break;
 case'coin':tone(880,.09,'square',.04,1.5);break;
 case'place':tone(160,.12,'triangle',.08,.5);break;
 case'boom':noise(.5,.25);tone(90,.4,'sawtooth',.1,.3);break;
 case'no':tone(120,.12,'sawtooth',.04);break;
 case'click':tone(500,.04,'square',.03);break;
 case'alarm':tone(440,.25,'sawtooth',.06,1.5);setTimeout(()=>tone(440,.25,'sawtooth',.06,1.5),300);break;
 case'win':[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.05),i*130));break;
 case'lose':[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.05),i*200));break;
 case'boost':tone(300,.5,'sawtooth',.06,4);break;
 case'beam':tone(1200,.2,'sawtooth',.04,.3);break;
 case'snip':tone(900,.04,'square',.03,.5);break;
 case'chomp':tone(110,.06,'square',.03);break;
 case'zap':noise(.2,.15);tone(1500,.2,'square',.04,.2);break;
 case'guard':tone(200,.6,'sawtooth',.07,3);break;
 case'smash':noise(.25,.2);tone(70,.3,'square',.1,.5);break;
 case'rm':tone(300,.1,'triangle',.05,.5);break;}}
const SEQ=[0,3,7,12,7,3,7,12,-4,0,3,8,3,0,3,8,-9,-5,-2,3,-2,-5,-2,3,-7,-4,0,5,0,-4,0,5];let mT=0,mI=0;
function music(dt){if(!AC||save.mute||screen!='play'||!S||S.paused||S.over)return;mT-=dt;if(mT>0)return;mT=.19;const n=SEQ[mI%SEQ.length];tone(220*Math.pow(2,n/12),.17,'triangle',.02);if(mI%8==0)tone(55*Math.pow(2,n/12),.5,'sine',.06);mI++;}

// ---------- draw helpers
function rr(x,y,w,h,r,fill,stroke,lw){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}}
const FONT='px ui-monospace,Menlo,Consolas,"Courier New",monospace';
function txt(s,x,y,sz,col,al,wt){ctx.font=(wt==null?'bold ':wt)+sz+FONT;ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function txtO(s,x,y,sz,col,al){ctx.font='bold '+sz+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(4,sz*.14);ctx.strokeStyle='#120E18';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,TAU);ctx.fill();}
function shade(h,a){const n=parseInt(h.slice(1),16),f=a<0?0:255,p=Math.abs(a);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r+(f-r)*p);g=Math.round(g+(f-g)*p);b=Math.round(b+(f-b)*p);return'rgb('+r+','+g+','+b+')';}
function hash(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x);}
function coin(x,y,r){ctx.fillStyle='#E8A920';ell(x,y,r,r);ctx.fillStyle='#FFD24A';ell(x,y,r*.78,r*.78);ctx.fillStyle='#B97A08';ctx.fillRect(x-r*.42,y-r*.45,r*.84,r*.24);ctx.fillRect(x-r*.13,y-r*.45,r*.26,r*.9);}
function spark(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,q=i%2?r*.38:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();ctx.fill();}
function btn(x,y,w,h,label,fn,o){o=o||{};const hov=!o.dis&&inR(x,y,w,h);rr(x,y,w,h,o.r||8,o.dis?'#2A2733':hov?(o.hc||'#F39A7A'):(o.c||OR),o.dis?'#3A3745':'#120E18',2);txt(label,x+w/2,y+h/2+1,o.sz||16,o.dis?'#6B6680':(o.tc||'#120E18'),'center');if(!o.dis)UI.push({x,y,w,h,fn});}
const GREY={c:'#3A3548',hc:'#4A4560',tc:'#FFF3EA'};

// ---------- Clawd
function clawd(x,y,s,col,o,acc){o=o||{};const u=4*s,t=o.t||0,bob=o.still?0:Math.sin(t*3)*u*.22,sq=o.sq||0,c=o.flash?'#FFF3EA':col;
 ctx.save();ctx.translate(x,y);
 if(!o.noSh){ctx.fillStyle='rgba(0,0,0,.25)';ell(0,1.6*u,7.2*u,1.5*u);}
 ctx.fillStyle=o.flash?c:shade(col,-.28);
 for(const lx of[-5.2,-2.5,1.1,3.8])ctx.fillRect(lx*u,-.4*u,1.4*u,2.4*u);
 ctx.translate(0,-bob);ctx.scale(1+sq*.07,1-sq*.07);
 ctx.fillStyle=c;ctx.fillRect(-8*u,-5.4*u,2.2*u,2*u);ctx.fillRect(5.8*u,-5.4*u,2.2*u,2*u);ctx.fillRect(-6*u,-8*u,12*u,8*u);
 ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(-6*u,-1.1*u,12*u,1.1*u);
 ctx.fillStyle='#1B1410';const bl=o.blink||(t%4.2)>4.05,eh=bl?.5*u:2*u,ey=bl?-4.9*u:-6*u;ctx.fillRect(-3.3*u,ey,1.1*u,eh);ctx.fillRect(2.2*u,ey,1.1*u,eh);
 if(acc)acc(u);ctx.restore();}
function cannon(u,cy,gl,gc,hot,h){h=h||2;ctx.fillStyle='#22202B';ctx.fillRect(4.5*u,cy-h*u,4.6*u,2*h*u);ctx.fillStyle=hot?'#fff':'#4A4658';ctx.fillRect(9.1*u,cy-(h+.3)*u,u,2*(h+.3)*u);txt(gl,6.9*u,cy+.15*u,Math.min(3.3,h*1.8)*u,gc,'center');}
function drawDef(type,x,y,s,d){const D=DEF[type],t=d?d.age:TIME,fl=!!(d&&d.hit>0),hot=!!(d&&d.anim>0),o={t,flash:fl,sq:hot?Math.min(1,d.anim*5):0};
 let col=D.col;if(d&&d.stun>0){col='#8D8894';o.blink=true;o.still=true;}
 switch(type){
 case'prompt':clawd(x,y,s,col,o,u=>cannon(u,-4.4*u,'>','#6EE787',hot));break;
 case'cache':clawd(x,y,s,col,o,u=>{cannon(u,-4.4*u,'*','#9BE7FF',hot);ctx.fillStyle='#DDF6FF';ctx.fillRect(-2*u,-9.6*u,4*u,1.6*u);});break;
 case'fork':clawd(x,y,s,col,o,u=>{cannon(u,-6.3*u,'>','#6EE787',hot,1.3);cannon(u,-2.3*u,'>','#6EE787',hot,1.3);});break;
 case'token':clawd(x,y,s,col,o,u=>{const cy=-11.4*u+Math.sin(t*4)*u*.4,g=d?clamp(1-d.tm/2.5,0,1):0;if(g>0){ctx.fillStyle='rgba(255,220,90,'+(g*.4)+')';ell(0,cy,4.6*u,4.6*u);}coin(0,cy,2.7*u);});break;
 case'firewall':o.still=true;clawd(x-6*s,y,s*1.05,col,o,u=>{const hpR=d?d.hp/d.max:1,steel=!!(d&&d.steel&&d.hp>d.max),bx=1.5*u,by=-11*u,bw=8*u,bh=12.6*u;
   ctx.fillStyle=steel?'#9AA7B8':'#B5523B';ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle=steel?'#6C7887':'#7D3524';ctx.lineWidth=Math.max(1,u*.35);
   for(let i=0;i<5;i++){const yy=by+i*bh/5;ctx.beginPath();ctx.moveTo(bx,yy);ctx.lineTo(bx+bw,yy);for(let j=0;j<2;j++){const xx=bx+(j+.5+(i%2?.25:-.25))*bw/2;ctx.moveTo(xx,yy);ctx.lineTo(xx,yy+bh/5);}ctx.stroke();}
   ctx.strokeRect(bx,by,bw,bh);ctx.strokeStyle='#2A1410';ctx.lineWidth=Math.max(1.2,u*.45);
   if(hpR<.66){ctx.beginPath();ctx.moveTo(bx+bw*.3,by);ctx.lineTo(bx+bw*.5,by+bh*.3);ctx.lineTo(bx+bw*.35,by+bh*.55);ctx.stroke();}
   if(hpR<.33){ctx.beginPath();ctx.moveTo(bx+bw,by+bh*.4);ctx.lineTo(bx+bw*.6,by+bh*.6);ctx.lineTo(bx+bw*.75,by+bh);ctx.stroke();}});break;
 case'breakpoint':{const armed=!d||d.armed;ctx.save();ctx.beginPath();ctx.rect(x-44*s,y-70*s,88*s,70*s);ctx.clip();clawd(x,y+(armed?13:23)*s,s*.9,col,{t,still:true,flash:fl,noSh:true});ctx.restore();
   ctx.fillStyle='#3A2E2A';ell(x,y+s,30*s,6*s);const dy=y-(armed?30:16)*s;ctx.strokeStyle='#2A2422';ctx.lineWidth=2.5*s;ctx.beginPath();ctx.moveTo(x,y-(armed?15:5)*s);ctx.lineTo(x,dy);ctx.stroke();
   if(armed){ctx.fillStyle='rgba(255,59,48,'+(.25+.2*Math.sin(t*8))+')';ell(x,dy-5*s,11*s,11*s);}ctx.fillStyle=armed?'#FF3B30':'#6B4B48';ell(x,dy-5*s,6*s,6*s);}break;
 case'linter':clawd(x,y,s,col,o,u=>{const a=hot?.06:.5+Math.sin(t*3)*.08;for(const g of[-1,1]){ctx.save();ctx.translate(6.5*u,-4.2*u);ctx.rotate(g*a);ctx.fillStyle=shade(col,-.18);ctx.fillRect(0,-1.1*u,6.2*u,2.2*u);ctx.fillStyle='#FFF3EA';ctx.fillRect(4.6*u,g>0?-1.1*u:.3*u,1.6*u,.8*u);ctx.restore();}
   ctx.fillStyle='#1B1410';ctx.fillRect(-3.9*u,-7.2*u,2.4*u,.7*u);ctx.fillRect(1.5*u,-7.2*u,2.4*u,.7*u);});break;
 case'rmrf':{const p=d?1+.07*Math.sin(t*22):1;clawd(x,y,s*p,(d&&(t*12|0)%2)?'#FF7A6E':col,o,u=>{ctx.strokeStyle='#3A2A20';ctx.lineWidth=u*.6;ctx.beginPath();ctx.moveTo(0,-8*u);ctx.quadraticCurveTo(2*u,-11*u,3.6*u,-10.4*u);ctx.stroke();ctx.fillStyle=(t*10|0)%2?'#FFD24A':'#FF7B2E';ell(3.6*u,-10.4*u,u*1.2,u*1.2);txt('rm -rf',0,-2*u,2.1*u,'#fff','center');});}break;
 case'pipe':clawd(x,y,s,col,o,u=>{ctx.fillStyle='#22202B';ctx.fillRect(4.5*u,-5.6*u,7.2*u,2.4*u);ctx.fillStyle='#4A4658';ctx.fillRect(6.5*u,-6*u,u,3.2*u);ctx.fillRect(9*u,-6*u,u,3.2*u);ctx.fillStyle=hot?'#fff':'#59E3F7';const q=(hot?1.8:1.2)*u;ell(12*u,-4.4*u,q,q);});break;
 case'thread':clawd(x,y,s,col,o,u=>{for(const a of[-.55,0,.55]){ctx.save();ctx.translate(5*u,-4.4*u);ctx.rotate(a);ctx.fillStyle='#22202B';ctx.fillRect(0,-u,4.8*u,2*u);ctx.fillStyle=hot?'#fff':'#6EE787';ctx.fillRect(4.8*u,-u,.8*u,2*u);ctx.restore();}});break;}
 if(d){if(d.stun>0)txt('503',x,y-54*s,13,'#FF6B6B','center');
  if(d.boost>0){ctx.strokeStyle='hsl('+((t*300)%360)+',95%,65%)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y-18,42,36,0,0,TAU);ctx.stroke();}}}

// ---------- bugs
function drawBug(type,x,y,sc,b){const B=BUG[type],t=b?b.age:TIME+x*.01,k=B.sc*sc,froz=!!(b&&b.frozen>0),eat=!!(b&&b.eating),hit=!!(b&&b.hit>0),wk=froz?0:1;
 const col=hit?'#ffffff':froz?'#BFEAFF':B.col,dk=hit?'#ffffff':shade(B.col,-.35);
 ctx.save();ctx.translate(x,y);ctx.scale(k,k);if(b&&b.phased)ctx.globalAlpha=.28;
 ctx.fillStyle='rgba(0,0,0,.28)';ell(0,2,24,5);
 if(b&&b.carry){ctx.strokeStyle='hsl('+((t*240)%360)+',95%,65%)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,-16,32,24,0,0,TAU);ctx.stroke();spark(0,-46,6,'#FFE066');}

 case'rmrf':d.big=true;break;

function nextWave(){const s=S,cfg=s.cfg,i=++s.wave,big=cfg.endless?i%5==4:cfg.big.includes(i),fin=!cfg.endless&&i==cfg.waves-1,iv=cfg.intro||1.5;

 const av=cfg.types.filter((t,k)=>i>=Math.round(k*iv)&&(t!='merge'||i>=(cfg.endless?12:cfg.waves*.5))),mcap=1+(big?1:0)+(cfg.endless?i/15|0:0);
 for(let n=0;n<300&&bud>0;n++){const op=av.filter(t=>BUG[t].cost<=bud&&(t!='merge'||mer<mcap));if(!op.length)break;const t=pick(op);if(t=='merge')mer++;list.push(t);bud-=BUG[t].cost;}
 list.forEach((t,k)=>s.queue.push({t:k*(big?.5:.9)+rnd(0,1.5),type:t,r:Math.random()*ROWS|0,carry:k==0&&i%3==2,done:false}));

// ---------- update
function update(dt){const s=S;if(!s||s.paused||s.over)return;const cfg=s.cfg;s.t+=dt;
 if(s.shake>0)s.shake-=dt;if(s.banner&&(s.banner.life-=dt)<=0)s.banner=null;
 if((s.skyT-=dt)<=0){s.skyT=(s.z==1?13:8)+rnd(0,3);spawnTok(rnd(GX+40,GX+COLS*CW-40),-20,rnd(GY+50,GY+ROWS*CH-40),25);}
 for(const c of s.cards)if(c.cd>0)c.cd-=dt;
 if(s.wave<cfg.waves-1){s.waveT-=dt;if(s.wave>=0&&!s.bugs.length&&!s.queue.length&&s.waveT>7)s.waveT=7;if(s.waveT<=0)nextWave();}
 else if(!s.bugs.length&&!s.queue.length&&!s.born.length){if((s.winT+=dt)>1.3){win();return;}}
 for(const q of s.queue)if((q.t-=dt)<=0){s.bugs.push(mkBug(q.type,q.r,W+34,q.carry));q.done=true;}
 if(s.queue.length)s.queue=s.queue.filter(q=>!q.done);
 if(s.z==2&&(s.stormT-=dt)<=0){s.stormT=rnd(16,26);const live=s.defs.filter(d=>!d.dead&&d.type!='rmrf');if(live.length){const d=pick(live),x=cellX(d.c),y=laneY(d.r);d.stun=5;s.beams.push({bolt:true,x,y:y-40,life:.35,max:.35});ftext(x,y-70,'OUTAGE!','#FF6B6B');snd('zap');}}
 // defenders
 for(const d of s.defs){if(d.dead)continue;d.age+=dt;if(d.hit>0)d.hit-=dt;if(d.anim>0)d.anim-=dt;if(d.stun>0){d.stun-=dt;continue;}
  const cx=cellX(d.c),cy=laneY(d.r),r=d.r;d.tm-=dt;
  switch(d.type){
  case'token':if(d.tm<=0){d.tm=20;d.anim=.2;spawnTok(cx+rnd(-12,12),cy-44,cy-rnd(4,16),25,true);}break;
  case'prompt':case'cache':case'fork':case'thread':{const rows=d.type=='thread'?[r-1,r,r+1].filter(q=>q>=0&&q<ROWS):[r];
    if(d.boost>0){d.boost-=dt;d.bt-=dt;while(d.bt<=0){d.bt+=.08;fire(d,rows);}}
    else if(d.tm<=0&&s.bugs.some(b=>!b.dead&&rows.includes(b.r)&&b.x>cx-10&&b.x<W+20)){d.tm=d.type=='cache'?1.5:1.4;fire(d,rows);}}break;
  case'linter':if(d.tm<=0){const hit=s.bugs.filter(b=>b.r==r&&!b.phased&&!b.dead&&b.x>cx-24&&b.x-BUG[b.type].w<cx+CW*1.3);if(hit.length){d.tm=.5;d.anim=.2;for(const b of hit)hurt(b,45);snd('snip');}}break;
  case'pipe':if(d.tm<=0){const hit=s.bugs.filter(b=>b.r==r&&!b.dead&&b.x>cx-10&&b.x<W+20);if(hit.length){d.tm=2.4;d.anim=.25;s.beams.push({r,x:cx+46,life:.22,max:.22});for(const b of hit)hurt(b,45);snd('beam');}}break;
  case'breakpoint':if(!d.armed){if(d.tm<=0){d.armed=true;ftext(cx,cy-50,'armed','#FF8A80');}}
    else if(s.bugs.some(b=>b.r==r&&!b.dead&&b.x-BUG[b.type].w<cx+30&&b.x>cx-44)){explode(cx,cy,r,0,50,1800);d.dead=true;}break;
  case'rmrf':if(d.tm<=0){explode(cx,cy,r,d.big?2:1,CW*(d.big?2.5:1.5),1800);d.dead=true;}break;}}
 // bugs
 for(const b of s.bugs){if(b.dead)continue;b.age+=dt;if(b.hit>0)b.hit-=dt;
  if(b.type=='heisen'&&(b.pt-=dt)<=0){b.phased=!b.phased;b.pt=b.phased?1.2:2.2;}
  if(b.frozen>0){b.frozen-=dt;continue;}
  let k=1;if(b.slow>0){b.slow-=dt;k=.5;}
  const front=b.x-BUG[b.type].w,c=Math.floor((front-GX)/CW),d=c>=0&&c<COLS?s.grid[b.r][c]:null;
  if(d&&!d.dead&&front<=cellX(c)+28){b.eating=true;
   if(b.type=='merge'){if((b.sm-=dt*k)<=0){b.sm=1.5;dmgDef(d,2000);s.shake=.25;snd('smash');puff(cellX(c),laneY(b.r)-20,'#fff',8,150);}}
   else{dmgDef(d,100*k*dt);if(Math.random()<dt*3)snd('chomp');}}
  else{b.eating=false;b.sm=1.1;b.x-=b.spd*k*dt;}
  if(b.x<GX-4){const g=s.guards[b.r];if(g.st==0){g.st=1;snd('guard');}else if(g.st==2&&b.x<GX-78){lose();return;}}}
 s.guards.forEach((g,r)=>{if(g.st!=1)return;g.x+=620*dt;for(const b of s.bugs)if(b.r==r&&!b.dead&&b.x<g.x+30)hurt(b,1e6);if(g.x>W+90)g.st=2;});

  for(const b of s.bugs){if(b.dead||b.r!=p.r||b.phased)continue;if(Math.abs(b.x-p.x)<BUG[b.type].w){hurt(b,p.dmg);if(p.ice)b.slow=4;p.dead=true;puff(p.x,p.y,p.ice?'#9BE7FF':'#6EE787',3,80);snd('hit');break;}}}
 for(const t of s.toks){if(t.pop){t.vy+=420*dt;t.y+=t.vy*dt;if(t.vy>0&&t.y>=t.ty){t.y=t.ty;t.pop=false;}}else if(t.y<t.ty)t.y=Math.min(t.ty,t.y+62*dt);else t.life-=dt;
  if(!t.got&&Math.hypot(t.x-mouse.x,t.y-mouse.y)<30)collect(t);}

 for(const f of s.texts){f.life-=dt;f.y-=28*dt;}
 for(const b of s.beams)b.life-=dt;
 // cleanup
 for(const d of s.defs)if(d.dead&&s.grid[d.r][d.c]===d)s.grid[d.r][d.c]=null;
 s.defs=s.defs.filter(d=>!d.dead);s.bugs=s.bugs.filter(b=>!b.dead);if(s.born.length){s.bugs.push(...s.born);s.born=[];}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tank Blitz</title>
<style>
  :root { --bg:#10131c; --panel:#1b2030; --accent:#ffb02e; --text:#e8ecf5; --muted:#8b93a8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,Segoe UI,Roboto,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:8px 8px 16px; }
  #wrap { position:relative; width:100%; max-width:1000px; aspect-ratio:1000/560; border-radius:10px; overflow:hidden; box-shadow:0 8px 40px #000a; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(8,10,18,.78); text-align:center; padding:16px; }
  .overlay.hidden { display:none; }
  h1 { margin:0; font-size:clamp(32px,7vw,64px); letter-spacing:2px; color:var(--accent); text-shadow:0 3px 0 #7a4a00, 0 0 24px #ffb02e66; }
  h2 { margin:0; font-size:clamp(26px,5vw,44px); }
  .sub { color:var(--muted); font-size:clamp(12px,2vw,15px); max-width:560px; line-height:1.5; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:10px 18px; background:var(--panel); color:var(--text); border:1px solid #2d3550; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#1b1200; font-weight:700; border-color:var(--accent); }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
  select { font:inherit; padding:8px 10px; border-radius:8px; background:var(--panel); color:var(--text); border:1px solid #2d3550; }
  #bar { width:100%; max-width:1000px; margin-top:8px; display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; }
  #weapons { display:flex; gap:6px; flex-wrap:wrap; }
  #weapons button { padding:6px 10px; font-size:14px; }
  #weapons button.sel { background:var(--accent); color:#1b1200; border-color:var(--accent); font-weight:700; }
  #weapons button:disabled { opacity:.35; cursor:not-allowed; }
  #pad { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  #pad button { padding:10px 14px; font-size:16px; min-width:46px; user-select:none; touch-action:none; }
  #pad .fire { background:#e5483d; border-color:#e5483d; font-weight:700; }
  .help { color:var(--muted); font-size:12px; margin-top:8px; text-align:center; max-width:1000px; line-height:1.6; }
  kbd { background:#222a40; border:1px solid #333d5c; border-radius:4px; padding:1px 5px; font-size:11px; color:var(--text); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1000" height="560"></canvas>

  <div id="menu" class="overlay">
    <h1>TANK BLITZ</h1>
    <div class="sub">Turn-based artillery. Dial in your angle and power, account for the wind, and blow up the other tank. Terrain is fully destructible.</div>
    <div class="row">
      <label class="sub">CPU level&nbsp;
        <select id="diff">
          <option value="0">Easy</option>
          <option value="1" selected>Normal</option>
          <option value="2">Hard</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button class="primary" data-mode="0">1 Player vs CPU</button>
      <button data-mode="1">2 Players (same screen)</button>
      <button data-mode="2">Watch CPU vs CPU</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <h2 id="overTitle">Player 1 wins!</h2>
    <div class="sub" id="overScore"></div>
    <div class="row">
      <button class="primary" id="again">Next round</button>
      <button id="toMenu">Menu</button>
    </div>
  </div>
</div>

<div id="bar">
  <div id="weapons"></div>
  <div id="pad">
    <button data-key="KeyA">◀</button>
    <button data-key="KeyD">▶</button>
    <button data-key="ArrowLeft">⟲ Aim</button>
    <button data-key="ArrowRight">Aim ⟳</button>
    <button data-key="ArrowDown">− Pwr</button>
    <button data-key="ArrowUp">+ Pwr</button>
    <button data-key="Space" class="fire">FIRE</button>
  </div>
</div>
<div class="help">
  <kbd>A</kbd>/<kbd>D</kbd> drive &nbsp; <kbd>←</kbd>/<kbd>→</kbd> aim barrel &nbsp; <kbd>↑</kbd>/<kbd>↓</kbd> power &nbsp;
  <kbd>Shift</kbd> fine-tune &nbsp; <kbd>1</kbd>–<kbd>4</kbd> weapon &nbsp; <kbd>Space</kbd> fire &nbsp; <kbd>M</kbd> mute
</div>

<script>
(() => {
'use strict';

// ---------- setup ----------
const W = 1000, H = 560;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const terr = document.createElement('canvas'); terr.width = W; terr.height = H;
const tctx = terr.getContext('2d', { willReadFrequently: true });
const bgc = document.createElement('canvas'); bgc.width = W; bgc.height = H;
const G = 0.16;               // gravity (px / frame^2)
const WIND_K = 0.0022;        // wind acceleration per wind unit
const POWER_K = 0.145;        // launch speed per power unit

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 0.75;
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

const WEAPONS = [
  { name: 'Shell',  r: 34, dmg: 28, vm: 1.0,  wm: 1.0, count: 1, ammo: Infinity, color: '#ffd54a', size: 3 },
  { name: 'Heavy',  r: 62, dmg: 50, vm: 0.9,  wm: 1.0, count: 1, ammo: 3,        color: '#ff7043', size: 5 },
  { name: 'Triple', r: 30, dmg: 22, vm: 1.0,  wm: 1.0, count: 3, ammo: 3,        color: '#81d4fa', size: 3 },
  { name: 'Sniper', r: 20, dmg: 42, vm: 1.3,  wm: 0.3, count: 1, ammo: 2,        color: '#e1bee7', size: 2.5 },
];
const DIFF = [ { a: 7, p: 0.10 }, { a: 2.5, p: 0.04 }, { a: 0.6, p: 0.012 } ];

// ---------- audio ----------
let ac = null, muted = false, noiseBuf = null;
function initAudio() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function sfx(kind, size = 1) {
  if (!ac || muted) return;
  const t = ac.currentTime;
  const g = ac.createGain();
  g.connect(ac.destination);
  if (kind === 'fire') {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.25);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g); o.start(t); o.stop(t + 0.3);
  } else {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(900 + size * 300, t);
    f.frequency.exponentialRampToValueAtTime(80, t + 0.5);
    const dur = 0.35 + size * 0.25;
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); s.start(t); s.stop(t + dur);
  }
}

// ---------- state ----------
let mode = 0;             // 0: you vs CPU, 1: two humans, 2: CPU vs CPU
let difficulty = 1;
let state = 'menu';       // menu | aim | fly | settle | over
let tanks = [], cur = 0, wind = 0;
let projectiles = [], particles = [], flashes = [], texts = [];
let shake = 0, settleTimer = 0, overTimer = 0, banner = { txt: '', t: 0 };
let scores = [0, 0];
let tdata = null, clouds = [];
const keys = {};

// ---------- terrain ----------
function refreshTerrain() { tdata = tctx.getImageData(0, 0, W, H).data; }
function solid(x, y) {
  x |= 0; y |= 0;
  if (x < 0 || x >= W || y < 0 || y >= H) return false;
  return tdata[(y * W + x) * 4 + 3] > 100;
}

function genTerrain() {
  tctx.clearRect(0, 0, W, H);
  const ph = [rand(0, 6.28), rand(0, 6.28), rand(0, 6.28)];
  const am = [rand(45, 70), rand(18, 34), rand(6, 14)];
  const fr = [rand(0.003, 0.005), rand(0.009, 0.014), rand(0.025, 0.035)];
  const base = rand(360, 400);
  const hs = new Array(W);
  for (let x = 0; x < W; x++) {
    let h = base;
    for (let i = 0; i < 3; i++) h += am[i] * Math.sin(x * fr[i] + ph[i]);
    hs[x] = h;
  }
  const grad = tctx.createLinearGradient(0, 280, 0, H);
  grad.addColorStop(0, '#7a5232'); grad.addColorStop(1, '#2e1d10');
  tctx.fillStyle = grad;
  tctx.beginPath(); tctx.moveTo(0, H);
  for (let x = 0; x < W; x++) tctx.lineTo(x, hs[x]);
  tctx.lineTo(W - 1, H); tctx.closePath(); tctx.fill();
  // dirt speckles
  tctx.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 1400; i++) {
    tctx.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,.14)' : 'rgba(255,220,170,.07)';
    const s = rand(1, 4);
    tctx.fillRect(rand(0, W), rand(250, H), s * 2, s);
  }
  tctx.globalCompositeOperation = 'source-over';
  // grass edge
  tctx.lineJoin = 'round';
  for (const [c, w, o] of [['#2f7d32', 7, 3], ['#4caf50', 4, 1]]) {
    tctx.strokeStyle = c; tctx.lineWidth = w;
    tctx.beginPath();
    for (let x = 0; x < W; x++) { if (x) tctx.lineTo(x, hs[x] + o); else tctx.moveTo(x, hs[x] + o); }
    tctx.stroke();
  }
  refreshTerrain();
}

function genBackground() {
  const b = bgc.getContext('2d');
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1d2b64'); sky.addColorStop(0.55, '#b4506f'); sky.addColorStop(1, '#f6a65a');
  b.fillStyle = sky; b.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    b.fillStyle = `rgba(255,255,255,${rand(0.2, 0.8)})`;
    b.fillRect(rand(0, W), rand(0, 220), 1.5, 1.5);
  }
  b.fillStyle = '#ffe9a8'; b.beginPath(); b.arc(rand(300, 700), rand(330, 380), 46, 0, 7); b.fill();
  b.fillStyle = 'rgba(255,233,168,.18)'; b.beginPath(); b.arc(500, 360, 90, 0, 7); b.fill();
  for (const [col, y0, a, f] of [['#5d3a5e', 380, 70, 0.004], ['#3c2748', 420, 55, 0.007]]) {
    const p1 = rand(0, 6), p2 = rand(0, 6);
    b.fillStyle = col; b.beginPath(); b.moveTo(0, H);
    for (let x = 0; x <= W; x += 4) b.lineTo(x, y0 - a * (0.6 + 0.4 * Math.sin(x * f + p1)) * Math.abs(Math.sin(x * f * 2.3 + p2)) - 20);
    b.lineTo(W, H); b.closePath(); b.fill();
  }
  clouds = Array.from({ length: 6 }, () => ({ x: rand(0, W), y: rand(30, 200), s: rand(0.6, 1.4), v: rand(0.05, 0.18) }));
}

// ---------- tanks ----------
function makeTank(x, color, name, ai, faceRight) {
  const t = {
    x, y: 0, vy: 0, hp: 100, angle: faceRight ? 55 : 125, power: 55, fuel: 100, color, name, ai,
    ammo: WEAPONS.map(w => w.ammo), weapon: 0, tilt: 0, grounded: false, dead: false, plan: null, planWait: 0,
  };
  let y = 0; while (y < H && !solid(x, y)) y++;
  t.y = y - 1;
  return t;
}
const other = t => tanks[0] === t ? tanks[1] : tanks[0];
const pivotOf = t => ({ x: t.x + 16 * Math.sin(t.tilt), y: t.y - 16 * Math.cos(t.tilt) });

function groundAt(x, y) {
  for (let yy = y - 16; yy <= y + 16; yy++) if (solid(x, yy)) return yy;
  return y;
}

function updateTank(t) {
  if (t.dead) { t.grounded = true; return; }
  const under = solid(t.x, t.y + 1) || solid(t.x - 7, t.y + 1) || solid(t.x + 7, t.y + 1);
  if (!under) {
    t.grounded = false;
    t.vy = Math.min(t.vy + 0.25, 12);
    const steps = Math.ceil(t.vy);
    for (let i = 0; i < steps; i++) {
      if (solid(t.x, t.y + 1) || solid(t.x - 7, t.y + 1) || solid(t.x + 7, t.y + 1)) break;
      t.y += t.vy / steps;
    }
    if (t.y > H + 30) { t.hp = 0; t.grounded = true; }
  } else {
    if (t.vy > 7) {
      const dmg = Math.round((t.vy - 7) * 4);
      t.hp -= dmg;
      addText(t.x, t.y - 40, '-' + dmg, '#ffb74d');
      for (let i = 0; i < 8; i++) particles.push({ x: t.x + rand(-10, 10), y: t.y, vx: rand(-1.5, 1.5), vy: rand(-2, -0.5), life: 30, max: 30, c: '#8d6e4a', s: rand(2, 4), g: 0.1, type: 'debris' });
    }
    t.vy = 0; t.grounded = true;
  }
  const yl = groundAt(t.x - 10, t.y), yr = groundAt(t.x + 10, t.y);
  const target = clamp(Math.atan2(yr - yl, 20), -0.8, 0.8);
  t.tilt += (target - t.tilt) * 0.2;
}

function tryMove(t, dir) {
  if (t.fuel <= 0) return;
  const nx = t.x + dir * 1.1;
  if (nx < 14 || nx > W - 14) return;
  if (Math.abs(nx - other(t).x) < 30 && Math.abs(t.y - other(t).y) < 30) return;
  let gy = null;
  for (let y = t.y - 6; y <= t.y + 10; y++) if (solid(nx, y)) { gy = y; break; }
  if (gy === null) t.x = nx;                    // walks off an edge and falls
  else if (gy < t.y - 5) return;                // too steep
  else { t.x = nx; t.y = gy - 1; }
  t.fuel = Math.max(0, t.fuel - 0.25);
}

// ---------- projectiles / explosions ----------
function stepProj(p, tks) {
  p.vx += wind * WIND_K * p.w.wm;
  p.vy += G;
  const n = Math.ceil(Math.hypot(p.vx, p.vy) / 2);
  for (let i = 0; i < n; i++) {
    p.x += p.vx / n; p.y += p.vy / n;
    if (p.x < -80 || p.x > W + 80 || p.y > H + 80) return 'out';
    if (solid(p.x, p.y)) return 'ground';
    for (const t of tks) {
      if (t.dead || (t === p.owner && p.age < 15)) continue;
      if (dist(p.x, p.y, t.x, t.y - 9) < 15) return 'tank';
    }
  }
  p.age++;
  return null;
}

function muzzleOf(t) {
  const pv = pivotOf(t), a = t.angle * Math.PI / 180;
  return { x: pv.x + Math.cos(a) * 26, y: pv.y - Math.sin(a) * 26, a };
}

function fire(t) {
  const w = WEAPONS[t.weapon], m = muzzleOf(t);
  const v = t.power * POWER_K * w.vm;
  const offs = w.count === 3 ? [-5, 0, 5] : [0];
  for (const d of offs) {
    const a = m.a + d * Math.PI / 180;
    projectiles.push({ x: m.x, y: m.y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, w, owner: t, age: 0, trail: [] });
  }
  t.ammo[t.weapon]--;
  if (t.ammo[t.weapon] <= 0) t.weapon = 0;
  for (let i = 0; i < 8; i++) particles.push({ x: m.x, y: m.y, vx: Math.cos(m.a) * rand(1, 3) + rand(-.5, .5), vy: -Math.sin(m.a) * rand(1, 3) + rand(-.5, .5), life: 18, max: 18, c: '#ffd54a', s: rand(2, 4), g: 0, type: 'fire' });
  shake = Math.max(shake, 2);
  sfx('fire');
  state = 'fly';
}

function addText(x, y, txt, c) { texts.push({ x, y, txt, c, life: 70 }); }

function explode(x, y, w, owner) {
  // scorch ring then carve
  tctx.globalCompositeOperation = 'source-atop';
  tctx.fillStyle = 'rgba(20,10,5,.55)';
  tctx.beginPath(); tctx.arc(x, y, w.r + 5, 0, 7); tctx.fill();
  tctx.globalCompositeOperation = 'destination-out';
  tctx.beginPath(); tctx.arc(x, y, w.r, 0, 7); tctx.fill();
  tctx.globalCompositeOperation = 'source-over';
  refreshTerrain();

  flashes.push({ x, y, r: w.r, t: 0 });
  const n = Math.round(w.r * 0.9);
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(0.5, w.r * 0.11);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: rand(20, 40), max: 40, c: Math.random() < 0.5 ? '#ff9800' : '#ffeb3b', s: rand(3, 7), g: 0, type: 'fire' });
  }
  for (let i = 0; i < n * 0.5; i++) {
    const a = rand(0, 6.28), s = rand(0.2, 2);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.8, life: rand(40, 80), max: 80, c: '#555', s: rand(4, 9), g: -0.01, type: 'smoke' });
  }
  for (let i = 0; i < n * 0.6; i++) {
    const a = rand(-3.14, 0), s = rand(1, w.r * 0.14);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(30, 60), max: 60, c: Math.random() < 0.5 ? '#6b4a2b' : '#4a331d', s: rand(2, 4), g: 0.15, type: 'debris' });
  }
  shake = Math.max(shake, w.r * 0.22);
  sfx('boom', w.r / 40);

  if (w.dmg > 0) {
    for (const t of tanks) {
      if (t.dead) continue;
      const d = dist(x, y, t.x, t.y - 9);
      if (d < w.r + 14) {
        const dmg = Math.max(1, Math.round(w.dmg * (1 - d / (w.r + 14))));
        t.hp -= dmg;
        addText(t.x, t.y - 44, '-' + dmg, '#ff5252');
      }
    }
  }
}

// ---------- AI ----------
function simulate(t, angle, power, w) {
  const old = t.angle; t.angle = angle;
  const m = muzzleOf(t); t.angle = old;
  const v = power * POWER_K * w.vm;
  const p = { x: m.x, y: m.y, vx: Math.cos(m.a) * v, vy: -Math.sin(m.a) * v, w, owner: t, age: 0 };
  for (let i = 0; i < 900; i++) {
    const r = stepProj(p, tanks);
    if (r) return { x: p.x, y: p.y, r };
  }
  return { x: p.x, y: p.y, r: 'timeout' };
}

function pickWeapon(t) {
  const opts = [];
  const add = (i, wt) => { if (t.ammo[i] > 0) opts.push([i, wt]); };
  add(0, 3); add(1, 2); add(2, 2); add(3, 1.5);
  let tot = opts.reduce((a, o) => a + o[1], 0), r = Math.random() * tot;
  for (const [i, wt] of opts) { if ((r -= wt) <= 0) return i; }
  return 0;
}

function makePlan(t) {
  const e = other(t), widx = pickWeapon(t), w = WEAPONS[widx];
  const tx = e.x, ty = e.y - 9;
  let best = null;
  for (let a = 8; a <= 172; a += 1.5) {
    for (let pw = 15; pw <= 100; pw += 2.5) {
      const h = simulate(t, a, pw, w);
      let d = dist(h.x, h.y, tx, ty);
      if (dist(h.x, h.y, t.x, t.y - 9) < w.r + 25) d += 200;
      if (!best || d < best.d) best = { a, pw, d };
    }
  }
  const err = DIFF[difficulty];
  return {
    weapon: widx,
    angle: clamp(best.a + gauss() * err.a, 5, 175),
    power: clamp(best.pw * (1 + gauss() * err.p), 10, 100),
    hold: 20,
  };
}

function aiTurn(t) {
  if (!t.plan) { t.plan = makePlan(t); t.planWait = 45; }
  const p = t.plan;
  if (t.planWait > 0) { t.planWait--; return; }
  t.weapon = p.weapon;
  const da = p.angle - t.angle, dp = p.power - t.power;
  t.angle += clamp(da, -1.2, 1.2);
  t.power += clamp(dp, -0.8, 0.8);
  if (Math.abs(p.angle - t.angle) < 0.01 && Math.abs(p.power - t.power) < 0.01) {
    if (--p.hold <= 0) { t.plan = null; fire(t); }
  }
}

// ---------- turn flow ----------
function newRound() {
  genTerrain(); genBackground();
  tanks = [
    makeTank(130, '#4fc3f7', mode === 2 ? 'CPU A' : 'Player 1', mode === 2, true),
    makeTank(W - 130, '#ef5350', mode === 0 || mode === 2 ? 'CPU' : 'Player 2', mode !== 1, false),
  ];
  projectiles = []; particles = []; flashes = []; texts = [];
  cur = randInt(0, 1);
  beginTurn(false);
}

function beginTurn(swap = true) {
  if (swap) cur ^= 1;
  wind = randInt(-9, 9);
  const t = tanks[cur];
  t.fuel = 100; t.plan = null;
  banner = { txt: t.name + "'s turn", t: 90 };
  state = 'aim';
  syncWeapons(true);
}

function endRound(dead) {
  for (const t of dead) {
    t.dead = true; t.hp = 0;
    if (t.y < H) explode(t.x, t.y - 8, { r: 70, dmg: 0 }, null);
  }
  const alive = tanks.filter(t => !t.dead);
  let title;
  if (alive.length === 1) {
    const i = tanks.indexOf(alive[0]); scores[i]++;
    title = alive[0].name + ' wins!';
  } else title = 'Draw!';
  document.getElementById('overTitle').textContent = title;
  document.getElementById('overScore').textContent = `${tanks[0].name} ${scores[0]} — ${scores[1]} ${tanks[1].name}`;
  state = 'over'; overTimer = 100;
}

// ---------- input ----------
function humanTurn() { return state === 'aim' && !tanks[cur].ai; }

function handleInput() {
  const t = tanks[cur];
  const fine = keys['ShiftLeft'] || keys['ShiftRight'] ? 0.25 : 1;
  if (keys['ArrowLeft']) t.angle = clamp(t.angle + 0.6 * fine, 5, 175);
  if (keys['ArrowRight']) t.angle = clamp(t.angle - 0.6 * fine, 5, 175);
  if (keys['ArrowUp']) t.power = clamp(t.power + 0.35 * fine, 5, 100);
  if (keys['ArrowDown']) t.power = clamp(t.power - 0.35 * fine, 5, 100);
  if (keys['KeyA']) tryMove(t, -1);
  if (keys['KeyD']) tryMove(t, 1);
}

function selectWeapon(i) {
  const t = tanks[cur];
  if (humanTurn() && t.ammo[i] > 0) { t.weapon = i; syncWeapons(true); }
}

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) {
    if (e.code === 'Space' || e.code === 'Enter') { if (humanTurn()) fire(tanks[cur]); }
    else if (e.code.startsWith('Digit')) selectWeapon(+e.code.slice(5) - 1);
    else if (e.code === 'KeyM') muted = !muted;
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.key;
  const down = e => { e.preventDefault(); initAudio(); if (k === 'Space') { if (humanTurn()) fire(tanks[cur]); } else keys[k] = true; };
  const up = () => { if (k !== 'Space') keys[k] = false; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

// weapon buttons (HTML)
const wbox = document.getElementById('weapons');
let wsig = '';
function syncWeapons(force) {
  const t = tanks[cur];
  const human = t && state === 'aim' && !t.ai;
  const sig = t ? [cur, t.weapon, human, ...t.ammo].join('|') : '';
  if (!force && sig === wsig) return;
  wsig = sig;
  wbox.innerHTML = '';
  if (!t) return;
  WEAPONS.forEach((w, i) => {
    const b = document.createElement('button');
    b.textContent = `${i + 1} ${w.name}${w.ammo === Infinity ? '' : ' ×' + t.ammo[i]}`;
    b.disabled = !human || t.ammo[i] <= 0;
    if (t.weapon === i) b.classList.add('sel');
    b.onclick = () => selectWeapon(i);
    wbox.appendChild(b);
  });
}

// menu buttons
document.querySelectorAll('#menu [data-mode]').forEach(b => b.onclick = () => {
  initAudio();
  mode = +b.dataset.mode;
  difficulty = +document.getElementById('diff').value;
  scores = [0, 0];
  document.getElementById('menu').classList.add('hidden');
  newRound();
});
document.getElementById('again').onclick = () => {
  document.getElementById('over').classList.add('hidden');
  newRound();
};
document.getElementById('toMenu').onclick = () => {
  document.getElementById('over').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  state = 'menu'; tanks = []; syncWeapons(true);
};

// ---------- update ----------
function update() {
  for (const c of clouds) { c.x += c.v; if (c.x > W + 80) c.x = -80; }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; if (p.type === 'smoke') p.s += 0.12; }
  particles = particles.filter(p => p.life > 0);
  for (const f of flashes) f.t++;
  flashes = flashes.filter(f => f.t < 20);
  for (const t of texts) { t.y -= 0.5; t.life--; }
  texts = texts.filter(t => t.life > 0);
  shake *= 0.9; if (shake < 0.1) shake = 0;
  if (banner.t > 0) banner.t--;

  if (state === 'menu') return;
  tanks.forEach(updateTank);

  if (state === 'aim') {
    const t = tanks[cur];
    if (t.ai) aiTurn(t); else handleInput();
  } else if (state === 'fly') {
    for (const p of projectiles) {
      p.trail.push({ x: p.x, y: p.y }); if (p.trail.length > 18) p.trail.shift();
      p.res = stepProj(p, tanks);
    }
    for (const p of projectiles) if (p.res) explode(p.x, p.y, p.w, p.owner);
    projectiles = projectiles.filter(p => !p.res);
    if (!projectiles.length) { state = 'settle'; settleTimer = 50; }
  } else if (state === 'settle') {
    if (tanks.every(t => t.dead || t.grounded)) settleTimer--; else settleTimer = Math.max(settleTimer, 20);
    if (settleTimer <= 0) {
      const dead = tanks.filter(t => t.hp <= 0);
      if (dead.length) endRound(dead); else beginTurn(true);
    }
  } else if (state === 'over') {
    if (--overTimer === 0) document.getElementById('over').classList.remove('hidden');
  }
  syncWeapons(false);
}

// ---------- render ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawTank(t, active) {
  if (t.dead || t.y > H + 10) return;
  ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.tilt);
  ctx.fillStyle = '#1c1c1c'; rr(-18, -8, 36, 9, 4); ctx.fill();
  ctx.fillStyle = '#4a4a4a';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-12 + i * 6, -4, 3, 0, 7); ctx.fill(); }
  ctx.fillStyle = t.color; rr(-14, -16, 28, 10, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(-12, -15, 24, 2);
  ctx.beginPath(); ctx.arc(0, -16, 7, Math.PI, 0); ctx.fill();
  ctx.restore();
  const pv = pivotOf(t), m = muzzleOf(t);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(pv.x, pv.y); ctx.lineTo(m.x, m.y); ctx.stroke();
  ctx.strokeStyle = t.color; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(pv.x, pv.y); ctx.lineTo(m.x, m.y); ctx.stroke();
  ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(pv.x, pv.y, 4, 0, 7); ctx.fill();
  // health bar
  const bw = 44, bx = t.x - bw / 2, by = t.y - 42, hp = Math.max(0, t.hp) / 100;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
  ctx.fillStyle = hp > 0.5 ? '#66bb6a' : hp > 0.25 ? '#ffca28' : '#ef5350';
  ctx.fillRect(bx, by, bw * hp, 5);
  if (active && state === 'aim') {
    const bob = Math.sin(performance.now() / 180) * 3;
    ctx.fillStyle = '#ffb02e';
    ctx.beginPath(); ctx.moveTo(t.x, t.y - 52 + bob); ctx.lineTo(t.x - 6, t.y - 62 + bob); ctx.lineTo(t.x + 6, t.y - 62 + bob); ctx.closePath(); ctx.fill();
  }
}

function drawHUD() {
  ctx.font = 'bold 14px system-ui,sans-serif'; ctx.textBaseline = 'middle';
  tanks.forEach((t, i) => {
    const x = i === 0 ? 14 : W - 214, y = 12;
    ctx.fillStyle = 'rgba(10,12,22,.7)'; rr(x, y, 200, 44, 8); ctx.fill();
    if (cur === i && (state === 'aim' || state === 'fly')) { ctx.strokeStyle = '#ffb02e'; ctx.lineWidth = 2; rr(x, y, 200, 44, 8); ctx.stroke(); }
    ctx.fillStyle = t.color; ctx.textAlign = 'left'; ctx.fillText(t.name, x + 10, y + 14);
    ctx.fillStyle = '#ccd'; ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`Wins ${scores[i]}`, x + 190, y + 14);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x + 10, y + 27, 180, 9);
    const hp = Math.max(0, t.hp) / 100;
    ctx.fillStyle = hp > 0.5 ? '#66bb6a' : hp > 0.25 ? '#ffca28' : '#ef5350';
    ctx.fillRect(x + 10, y + 27, 180 * hp, 9);
    ctx.font = 'bold 14px system-ui,sans-serif';
  });
  // wind
  ctx.fillStyle = 'rgba(10,12,22,.7)'; rr(W / 2 - 70, 12, 140, 44, 8); ctx.fill();
  ctx.fillStyle = '#ccd'; ctx.font = '11px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('WIND', W / 2, 24);
  const len = wind * 5;
  ctx.strokeStyle = '#4dd0e1'; ctx.fillStyle = '#4dd0e1'; ctx.lineWidth = 3;
  if (wind !== 0) {
    ctx.beginPath(); ctx.moveTo(W / 2 - len / 2, 42); ctx.lineTo(W / 2 + len / 2, 42); ctx.stroke();
    const dir = Math.sign(wind), ex = W / 2 + len / 2;
    ctx.beginPath(); ctx.moveTo(ex + dir * 6, 42); ctx.lineTo(ex - dir * 3, 36); ctx.lineTo(ex - dir * 3, 48); ctx.closePath(); ctx.fill();
  } else { ctx.fillText('calm', W / 2, 42); }
  // bottom readout
  const t = tanks[cur];
  if (t && (state === 'aim' || state === 'fly')) {
    const w = WEAPONS[t.weapon];
    ctx.fillStyle = 'rgba(10,12,22,.7)'; rr(W / 2 - 230, H - 44, 460, 32, 8); ctx.fill();
    ctx.textAlign = 'left'; ctx.font = 'bold 13px system-ui,sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(`ANGLE ${Math.round(t.angle)}°`, W / 2 - 218, H - 28);
    ctx.fillText('POWER', W / 2 - 120, H - 28);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(W / 2 - 62, H - 33, 80, 10);
    ctx.fillStyle = `hsl(${120 - t.power * 1.2},80%,55%)`; ctx.fillRect(W / 2 - 62, H - 33, 80 * t.power / 100, 10);
    ctx.fillStyle = '#fff'; ctx.fillText(Math.round(t.power), W / 2 + 22, H - 28);
    ctx.fillText('FUEL', W / 2 + 56, H - 28);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(W / 2 + 102, H - 33, 44, 10);
    ctx.fillStyle = '#ffb02e'; ctx.fillRect(W / 2 + 102, H - 33, 44 * t.fuel / 100, 10);
    ctx.fillStyle = w.color; ctx.fillText(w.name, W / 2 + 162, H - 28);
  }
  if (banner.t > 0) {
    ctx.globalAlpha = Math.min(1, banner.t / 30);
    ctx.font = 'bold 34px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000a'; ctx.strokeText(banner.txt, W / 2, 110);
    ctx.fillStyle = '#fff'; ctx.fillText(banner.txt, W / 2, 110);
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.save();
  if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.drawImage(bgc, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 50 * c.s, 14 * c.s, 0, 0, 7);
    ctx.ellipse(c.x + 28 * c.s, c.y - 8 * c.s, 34 * c.s, 12 * c.s, 0, 0, 7);
    ctx.fill();
  }
  ctx.drawImage(terr, 0, 0);
  tanks.forEach((t, i) => drawTank(t, i === cur));

  for (const p of projectiles) {
    ctx.strokeStyle = p.w.color; ctx.lineWidth = p.w.size * 0.8; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.5; ctx.beginPath();
    p.trail.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
    ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.w.size, 0, 7); ctx.fill();
    ctx.fillStyle = p.w.color; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.w.size * 2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  for (const f of flashes) {
    const k = f.t / 20;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.4 + k * 0.8), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const p of particles) {
    const k = p.life / p.max;
    ctx.globalAlpha = p.type === 'smoke' ? k * 0.5 : Math.min(1, k * 1.5);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (p.type === 'fire' ? k : 1), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 18px system-ui,sans-serif'; ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / 25);
    ctx.lineWidth = 4; ctx.strokeStyle = '#000a'; ctx.strokeText(t.txt, t.x, t.y);
    ctx.fillStyle = t.c; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (tanks.length) drawHUD();
}

// ---------- main loop ----------
genTerrain(); genBackground();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook
window.__tankblitz = { get state() { return state; }, get tanks() { return tanks; }, get scores() { return scores; } };
})();
</script>
</body>
</html>

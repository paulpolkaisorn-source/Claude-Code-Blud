<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clawd Physics Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-screen 3D canvas, HUD pinned to the corners, touch controls along the bottom. */
  :root {
    --sky: #8fd3ff;
    --ink: #2a1a14;
    --paper: #fff7ef;
    --clawd: #d97757;
    --clawd-deep: #b9573a;
    --gold: #ffc93c;
    --panel: rgba(42, 26, 20, 0.62);
    --font: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--sky); color: var(--paper); font-family: var(--font); font-size: 14px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .hud { position: absolute; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #hud-left { top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
  #hud-right { top: calc(10px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; justify-content: flex-end; max-width: 62%; }
  .chip {
    background: var(--panel); color: var(--paper); border-radius: 12px; padding: 8px 12px;
    font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; backdrop-filter: blur(4px);
  }
  .chip .star { color: var(--gold); }
  button.btn {
    font: inherit; font-weight: 700; color: var(--paper); background: var(--panel);
    border: 2px solid rgba(255, 247, 239, 0.35); border-radius: 12px; padding: 8px 12px; min-height: 40px;
    cursor: pointer; backdrop-filter: blur(4px); touch-action: manipulation;
  }
  button.btn:hover { background: var(--clawd-deep); }
  button.btn:active { transform: translateY(1px); background: var(--clawd); }
  button.btn:focus-visible, #jump:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.btn kbd { opacity: 0.7; font: inherit; font-size: 11px; margin-left: 4px; }

  #help {
    position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--panel); border-radius: 12px; padding: 10px 14px; text-align: center; line-height: 1.6;
    max-width: min(92%, 640px); z-index: 4; backdrop-filter: blur(4px); pointer-events: none;
    transition: opacity 0.6s;
  }
  #help.faded { opacity: 0; }
  #help b { color: var(--gold); }
  #help .touch-only { display: none; }
  body.touch #help .touch-only { display: inline; }
  body.touch #help .key-only { display: none; }
  body.touch #help { bottom: auto; top: calc(118px + env(safe-area-inset-top, 0px)); font-size: 12px; padding: 7px 10px; line-height: 1.45; max-width: 78%; }
  @media (orientation: landscape) { body.touch #help { top: calc(60px + env(safe-area-inset-top, 0px)); max-width: 46%; } }
  body.touch button.btn kbd { display: none; }

  #toast {
    position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(0.8);
    background: var(--clawd); color: var(--paper); font-size: 22px; font-weight: 800; text-align: center;
    padding: 12px 20px; border-radius: 16px; border: 3px solid var(--paper); opacity: 0;
    transition: opacity 0.25s, transform 0.25s; z-index: 6; pointer-events: none; max-width: 86%;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--ink); z-index: 4; pointer-events: none; box-sizing: border-box;
  }

  /* Touch controls */
  #stick-base, #stick-knob { position: absolute; border-radius: 50%; pointer-events: none; z-index: 4; }
  #stick-base { width: 120px; height: 120px; margin: -60px 0 0 -60px; background: rgba(255, 247, 239, 0.18); border: 3px solid rgba(255, 247, 239, 0.55); box-sizing: border-box; }
  #stick-knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; background: rgba(255, 247, 239, 0.75); }
  #stick-base.resting { opacity: 0.45; }
  #jump {
    position: absolute; right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px));
    width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(255, 247, 239, 0.7);
    background: rgba(217, 119, 87, 0.7); color: var(--paper); font: inherit; font-weight: 800; font-size: 16px;
    z-index: 5; touch-action: none; display: none;
  }
  #jump.down { background: var(--clawd-deep); transform: scale(0.94); }
  body.touch #jump { display: block; }

  #error {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: var(--ink); color: var(--paper); font-size: 16px; z-index: 20;
  }
  @media (max-width: 520px) {
    .chip { font-size: 14px; padding: 7px 10px; }
    button.btn { padding: 6px 9px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" tabindex="0" aria-label="Clawd Physics Playground game view"></canvas>

  <div class="hud" id="hud-left">
    <div class="chip" aria-live="polite"><span class="star">★</span> <span id="stars">0 / 8</span></div>
  </div>
  <div class="hud" id="hud-right">
    <button class="btn" id="btn-crate" type="button">Crate<kbd>F</kbd></button>
    <button class="btn" id="btn-ball" type="button">Ball<kbd>G</kbd></button>
    <button class="btn" id="btn-reset" type="button">Reset<kbd>R</kbd></button>
    <button class="btn" id="btn-sound" type="button" aria-pressed="true">Sound on</button>
  </div>

  <div id="help">
    <span class="key-only"><b>WASD</b> move · <b>Space</b> jump · <b>drag mouse</b> or <b>←/→</b> turn camera · <b>wheel</b> zoom · <b>Shift</b> mouse lock</span>
    <span class="touch-only"><b>Left thumb</b> move · <b>drag right side</b> to look · <b>pinch</b> to zoom · <b>Jump</b> button</span>
    <br>Find all 8 stars. Push, smash and bounce on everything.
  </div>

  <div id="toast" role="status"></div>
  <div id="crosshair" hidden></div>
  <div id="stick-base" hidden></div>
  <div id="stick-knob" hidden></div>
  <button id="jump" type="button" aria-label="Jump">JUMP</button>
  <div id="error" hidden></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "cannon-es": "./vendor/cannon-es.js" } }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>

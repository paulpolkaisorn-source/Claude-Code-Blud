<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Old School - 3D Walkthrough</title>
<style>
  /* ---------- page + canvas ---------- */
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#101418;color:#f2e9d0;
    font-family:Georgia,'Times New Roman',serif;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  /* ---------- loading ---------- */
  #loading{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at center,#3a2a1c 0%,#150f0a 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
  #loading h1{font-size:34px;letter-spacing:3px;margin:0 0 6px;color:#e8d29a;text-shadow:0 2px 0 #000;text-align:center}
  #loading .sub{font-size:14px;opacity:.7;margin-bottom:26px;font-style:italic}
  #lbar{width:min(360px,70vw);height:12px;border:2px solid #b69a5a;border-radius:8px;overflow:hidden;background:#1c140d}
  #lfill{height:100%;width:0%;background:linear-gradient(#e8c870,#a8802a);transition:width .15s}
  #ltext{margin-top:14px;font-size:13px;opacity:.8;min-height:18px;text-align:center;padding:0 16px}
  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
  #miniWrap{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));
    width:140px;height:140px;border:2px solid rgba(232,210,154,.8);border-radius:6px;background:rgba(10,8,6,.55);overflow:hidden}
  #mini{width:140px;height:140px;display:block}
  #floorInd{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(156px + env(safe-area-inset-top));
    min-width:30px;height:30px;line-height:30px;text-align:center;padding:0 8px;border-radius:6px;font-weight:bold;
    background:rgba(10,8,6,.65);border:2px solid rgba(232,210,154,.8);color:#f2e3b0;font-size:16px}
  #roomLabel{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);
    padding:8px 22px;border-radius:8px;background:rgba(15,10,6,.7);border:1px solid rgba(232,210,154,.6);
    color:#f5e8c0;font-size:20px;letter-spacing:1px;opacity:0;transition:opacity .6s;white-space:nowrap;
    max-width:60vw;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
  #roomLabel.show{opacity:1}
  #hint{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);
    padding:6px 14px;background:rgba(0,0,0,.55);border-radius:14px;font-size:13px;opacity:0;transition:opacity 1s;
    font-family:Arial,sans-serif;white-space:nowrap}
  #hint.show{opacity:.95}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:rgba(255,255,255,.55);display:none}
  /* ---------- overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(8,6,4,.72);cursor:pointer;text-align:center}
  #overlay .box{padding:30px 44px;border:2px solid #b69a5a;border-radius:12px;background:rgba(30,20,12,.9);max-width:80vw}
  #overlay h2{margin:0 0 12px;font-size:30px;color:#e8d29a;letter-spacing:2px}
  #overlay p{margin:6px 0;font-size:16px;line-height:1.5}
  #overlay .go{margin-top:16px;font-size:20px;color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.35}}
  /* ---------- touch controls ---------- */
  #joy{position:fixed;left:calc(24px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));
    width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);
    display:none;z-index:20;touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;
    background:rgba(255,255,255,.42);border:2px solid rgba(255,255,255,.6);pointer-events:none}
  .btn{position:fixed;z-index:20;display:none;font-family:Arial,sans-serif;font-weight:bold;color:#fff;
    background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);border-radius:12px;touch-action:none;
    -webkit-user-select:none;user-select:none}
  #runBtn{right:calc(26px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));
    width:70px;height:44px;font-size:16px}
  #runBtn.on{background:rgba(220,160,40,.7)}
  #fsBtn{right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));
    width:44px;height:44px;font-size:20px;display:none}
  body.touch #joy,body.touch #runBtn{display:block}
  body.touch #cross{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading">
  <h1>THE OLD SCHOOL</h1>
  <div class="sub">A 1950s brick schoolhouse &middot; two floors</div>
  <div id="lbar"><div id="lfill"></div></div>
  <div id="ltext">Preparing...</div>
</div>

<div id="hud">
  <div id="miniWrap"><canvas id="mini" width="140" height="140"></canvas></div>
  <div id="floorInd">G</div>
  <div id="roomLabel"></div>
  <div id="hint"></div>
  <div id="cross"></div>
</div>

<div id="overlay">
  <div class="box">
    <h2>THE OLD SCHOOL</h2>
    <p>WASD / arrows to move &middot; mouse to look &middot; Shift to run</p>
    <p>Esc to pause</p>
    <div class="go">Click to play</div>
  </div>
</div>

<div id="joy"><div id="knob"></div></div>
<div id="runBtn" class="btn" style="line-height:40px;text-align:center">Run</div>
<div id="fsBtn" class="btn" style="line-height:40px;text-align:center">&#x26F6;</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   1. CONFIG  (everything tweakable lives here)
   ===================================================================== */
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const CONFIG = {
  WALK: 3.0, SPRINT: 5.5,            // m/s
  RADIUS: 0.35, EYE: 1.7,            // player cylinder radius / eye height (m)
  HEAD_BOB: true,                    // <- one constant switches the head-bob off
  BOB_AMP: 0.03, BOB_FREQ: 2.3,      // +-0.03 m
  MOUSE_SENS: 0.0022, TOUCH_SENS: 0.004,
  PITCH_MAX: 85 * Math.PI / 180,
  DT_MAX: 0.05,
  FOV: 72,
  MAX_PIXEL_RATIO: 2,
  MAX_LIGHTS: isTouch ? 6 : 10,      // active PointLights (<= 12)
  LIGHT_RANGE: 18,                   // only lights within this distance are enabled

  FLOOR_H: 4.0, CEIL_H: 3.7,
  SPAWN: { x: 0, z: 45, yaw: 0 }
};

/* tiny seeded PRNG so the procedural art is identical on every load */
let _seed = 1234567;
function rand() { _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0; let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function rr(a, b) { return a + (b - a) * rand(); }

const COLC = new Map();
function hx(c) { let v = COLC.get(c); if (!v) { v = [((c >> 16) & 255) / 255, ((c >> 8) & 255) / 255, (c & 255) / 255]; COLC.set(c, v); } return v; }

const $ = id => document.getElementById(id);
const clamp = THREE.MathUtils.clamp;
const nextFrame = () => new Promise(r => setTimeout(r, 0));
async function stage(p, txt) { $('lfill').style.width = p + '%'; $('ltext').textContent = txt; await nextFrame(); }

/* palette */
const COL = { wood: 0x8a5a2b, dwood: 0x4e3018, mah: 0x5b1d10, oak: 0xb88a4a, white: 0xf1efe8, grey: 0x8b918c, green: 0x2f5a3c,
  brass: 0xc9a227, red: 0x8e1f1f, black: 0x1e1e1e, steel: 0xb9bfc2, paper: 0xf2ecd8, cream: 0xe9dcc0, blue: 0x2f4f7f,
  locker: 0x6f8f7f, glassb: 0x9ec4e0, fabric: 0x7a2f2f, cork: 0xb98a55, brick: 0x8e4a38, stone: 0xd8c9a4, yellow: 0xd9b23a };

/* =====================================================================
   2. RENDERER / SCENE
   ===================================================================== */
const canvas = $('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !isTouch, powerPreference: 'high-performance' });
} catch (e) { $('ltext').textContent = 'WebGL is not available on this device/browser.'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO));
renderer.setSize(window.innerWidth, window.innerHeight, false);

const maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const FOG_COL = 0xd2dde6;
scene.background = new THREE.Color(FOG_COL);
scene.fog = new THREE.Fog(FOG_COL, 55, 140);
const camera = new THREE.PerspectiveCamera(CONFIG.FOV, window.innerWidth / window.innerHeight, 0.08, 420);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* =====================================================================
   3. CORE GEOMETRY BATCHER
   Static geometry is accumulated into per-material / per-chunk buffers
   (merged => few draw calls, frustum culled by chunk).
   ===================================================================== */
const BATCH = new Map();
const FN = ['px', 'nx', 'py', 'ny', 'pz', 'nz'];
function newB() { return { pos: [], nor: [], uv: [], col: [], idx: [] }; }

/* one quad of an axis aligned box. f: 0 +X, 1 -X, 2 +Y, 3 -Y, 4 +Z, 5 -Z. UVs are in metres */
function face(B, f, x1, y1, z1, x2, y2, z2, c) {
  const n = B.pos.length / 3; let nx = 0, ny = 0, nz = 0, v, u;

    case 1: nx = -1; v = [x1, y1, z1, x1, y1, z2, x1, y2, z2, x1, y2, z1]; u = [z1, y1, z2, y1, z2, y2, z1, y2]; break;
    case 2: ny = 1;  v = [x1, y2, z2, x2, y2, z2, x2, y2, z1, x1, y2, z1]; u = [x1, -z2, x2, -z2, x2, -z1, x1, -z1]; break;
    case 3: ny = -1; v = [x1, y1, z1, x2, y1, z1, x2, y1, z2, x1, y1, z2]; u = [x1, -z1, x2, -z1, x2, -z2, x1, -z2]; break;
    case 4: nz = 1;  v = [x1, y1, z2, x2, y1, z2, x2, y2, z2, x1, y2, z2]; u = [x1, y1, x2, y1, x2, y2, x1, y2]; break;
    default: nz = -1; v = [x2, y1, z1, x1, y1, z1, x1, y2, z1, x2, y2, z1]; u = [x2, y1, x1, y1, x1, y2, x2, y2]; break;
  }
  for (let k = 0; k < 4; k++) {
    B.pos.push(v[k * 3], v[k * 3 + 1], v[k * 3 + 2]); B.nor.push(nx, ny, nz);
    B.uv.push(u[k * 2], u[k * 2 + 1]); B.col.push(c[0], c[1], c[2]);

}
/* add a box to the static batches. m = material name, or {px,nx,py,ny,pz,nz,d} per face */
function addBox(m, x1, y1, z1, x2, y2, z2, col, skip) {
  let t;
  if (x2 < x1) { t = x1; x1 = x2; x2 = t; } if (y2 < y1) { t = y1; y1 = y2; y2 = t; } if (z2 < z1) { t = z1; z1 = z2; z2 = t; }
  if (x2 - x1 < 1e-5 || y2 - y1 < 1e-5 || z2 - z1 < 1e-5) return;
  const c = hx(col === undefined ? 0xffffff : col), ck = chunkId((x1 + x2) / 2, y1, (z1 + z2) / 2), str = typeof m === 'string';
  for (let f = 0; f < 6; f++) {
    if (skip && skip.indexOf(FN[f]) >= 0) continue;
    const mm = str ? m : (m[FN[f]] || m.d || 'vc');
    face(getB(mm, ck), f, x1, y1, z1, x2, y2, z2, c);
  }
}
/* free-form quad / triangle with computed normal (roofs, pediments) */
function polyQuad(B, p0, p1, p2, p3, col, uvf) {
  const n = B.pos.length / 3, c = hx(col);
  let ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2], bx = p3[0] - p0[0], by = p3[1] - p0[1], bz = p3[2] - p0[2];
  let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx; const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
  [p0, p1, p2, p3].forEach(p => { B.pos.push(p[0], p[1], p[2]); B.nor.push(nx, ny, nz); const uv = uvf ? uvf(p) : [p[0], p[1]]; B.uv.push(uv[0], uv[1]); B.col.push(c[0], c[1], c[2]); });
  B.idx.push(n, n + 1, n + 2, n, n + 2, n + 3);
}
function polyTri(B, p0, p1, p2, col, uvf) {
  const n = B.pos.length / 3, c = hx(col);
  let ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = p1[2] - p0[2], bx = p2[0] - p0[0], by = p2[1] - p0[1], bz = p2[2] - p0[2];
  let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx; const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
  [p0, p1, p2].forEach(p => { B.pos.push(p[0], p[1], p[2]); B.nor.push(nx, ny, nz); const uv = uvf ? uvf(p) : [p[0], p[1]]; B.uv.push(uv[0], uv[1]); B.col.push(c[0], c[1], c[2]); });
  B.idx.push(n, n + 1, n + 2);
}
/* copy any THREE geometry (cylinder, sphere...) transformed by m4 into a batch buffer */
const _v = new THREE.Vector3(), _n = new THREE.Vector3(), _nm = new THREE.Matrix3();
function geoInto(B, geo, m4, col) {
  const g = geo.index ? geo.toNonIndexed() : geo, P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv, c = hx(col);
  _nm.getNormalMatrix(m4); const base = B.pos.length / 3;
  for (let i = 0; i < P.count; i++) {
    _v.fromBufferAttribute(P, i).applyMatrix4(m4); B.pos.push(_v.x, _v.y, _v.z);
    _n.fromBufferAttribute(N, i).applyMatrix3(_nm).normalize(); B.nor.push(_n.x, _n.y, _n.z);
    B.uv.push(U ? U.getX(i) : 0, U ? U.getY(i) : 0); B.col.push(c[0], c[1], c[2]); B.idx.push(base + i);
  }
}
const GEOC = {};
function cachedGeo(key, mk) { return GEOC[key] || (GEOC[key] = mk()); }
const _gm = new THREE.Matrix4(), _gq = new THREE.Quaternion(), _gp = new THREE.Vector3(), _gs = new THREE.Vector3(1, 1, 1), _ge = new THREE.Euler();
function addGeo(m, geo, x, y, z, col, rx, ry, rz, sx, sy, sz) {
  _ge.set(rx || 0, ry || 0, rz || 0, 'YXZ'); _gq.setFromEuler(_ge); _gp.set(x, y, z); _gs.set(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz);

}
const G_CYL = (seg) => cachedGeo('cyl' + seg, () => new THREE.CylinderGeometry(1, 1, 1, seg));
const G_SPH = (seg) => cachedGeo('sph' + seg, () => new THREE.SphereGeometry(1, seg, Math.max(4, seg >> 1)));
const G_CONE = (seg) => cachedGeo('cone' + seg, () => new THREE.ConeGeometry(1, 1, seg));
const G_BOX = cachedGeo('box', () => new THREE.BoxGeometry(1, 1, 1));
const G_TORUS = cachedGeo('tor', () => new THREE.TorusGeometry(1, 0.06, 6, 16));

/* ---------------- Colliders: [ground, first floor, both] ---------------- */
const COLS = [[], [], []];
function addCol(x1, x2, z1, z2, f) { COLS[f === undefined ? 2 : f].push({ x1: Math.min(x1, x2), x2: Math.max(x1, x2), z1: Math.min(z1, z2), z2: Math.max(z1, z2) }); }
/* walkable platforms / ramps (stage, steps, risers, stairs) */
const SURF = [];

/* ---------------- Current build context ---------------- */
const CUR = { f: 0, y: 0 };
function setFloor(f) { CUR.f = f; CUR.y = f * CONFIG.FLOOR_H; }

/* ---------------- Point-light candidates (pool is driven from the loop) ---------------- */
const LIGHTS = [];
function lightAt(x, y, z, f, col, inten, dist) { LIGHTS.push({ x: x, y: y, z: z, f: f, c: col === undefined ? 0xffe2b0 : col, i: inten === undefined ? 0.9 : inten, d: dist || 12 }); }

/* =====================================================================
   4. INSTANCING (repeated objects: desks, chairs, lockers, books, windows...)
   ===================================================================== */
const TPL = {}, INST = {};
function boxInto(B, x1, y1, z1, x2, y2, z2, col, skip) {
  const c = hx(col === undefined ? 0xffffff : col);
  for (let f = 0; f < 6; f++) { if (skip && skip.indexOf(FN[f]) >= 0) continue; face(B, f, x1, y1, z1, x2, y2, z2, c); }
}
/* defT(name, materialKey, builder(api)); api.box(cx, y0, cz, sx, sy, sz, color, skip) */
function defT(name, mat, fn) {
  if (TPL[name]) return;
  const B = newB();
  const api = {
    box: (cx, y, cz, sx, sy, sz, col, skip) => boxInto(B, cx - sx / 2, y, cz - sz / 2, cx + sx / 2, y + sy, cz + sz / 2, col, skip === undefined ? (y > 1.8 ? '' : 'ny') : skip),
    cyl: (cx, y, cz, r, h, col, seg) => geoInto(B, G_CYL(seg || 10), new THREE.Matrix4().compose(new THREE.Vector3(cx, y + h / 2, cz), new THREE.Quaternion(), new THREE.Vector3(r, h, r)), col),
    sph: (cx, cy, cz, r, col, seg) => geoInto(B, G_SPH(seg || 10), new THREE.Matrix4().compose(new THREE.Vector3(cx, cy, cz), new THREE.Quaternion(), new THREE.Vector3(r, r, r)), col)

const _im = new THREE.Matrix4(), _iq = new THREE.Quaternion(), _ip = new THREE.Vector3(), _is = new THREE.Vector3(), _iup = new THREE.Vector3(0, 1, 0);
function inst(name, x, y, z, ry, sx, sy, sz) {
  if (!INST[name]) throw new Error('missing template ' + name);
  _iq.setFromAxisAngle(_iup, ry || 0); _ip.set(x, y, z); _is.set(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz);
  _im.compose(_ip, _iq, _is); const a = INST[name]; for (let i = 0; i < 16; i++) a.push(_im.elements[i]);
}

/* =====================================================================
   5. FRAME  (local coordinate system for props, rotated in quarter turns)
   local +Z = front of the object, local +X = viewer's right.
   q: 0 faces SOUTH(+Z), 1 faces EAST(+X), 2 faces NORTH(-Z), 3 faces WEST(-X)
   ===================================================================== */
class Frame {
  constructor(x, z, q, y) { this.x = x; this.z = z; this.q = q & 3; this.y = y; this.c = [1, 0, -1, 0][this.q]; this.s = [0, 1, 0, -1][this.q]; }
  wx(lx, lz) { return this.x + lx * this.c + lz * this.s; }
  wz(lx, lz) { return this.z - lx * this.s + lz * this.c; }
  /* box: centre (lx,lz), bottom ly, sizes */
  b(lx, ly, lz, sx, sy, sz, col, mat, skip) {
    const sw = this.q & 1, ex = sw ? sz : sx, ez = sw ? sx : sz, X = this.wx(lx, lz), Z = this.wz(lx, lz);
    addBox(mat || 'vc', X - ex / 2, this.y + ly, Z - ez / 2, X + ex / 2, this.y + ly + sy, Z + ez / 2, col, skip); return this;
  }
  e(lx, ly, lz, sx, sy, sz, col) { return this.b(lx, ly, lz, sx, sy, sz, col, 'emit'); }
  gl(lx, ly, lz, sx, sy, sz, col) { return this.b(lx, ly, lz, sx, sy, sz, col === undefined ? 0xbfe0f0 : col, 'glass'); }
  col(lx, lz, sx, sz, f) {
    const sw = this.q & 1, ex = sw ? sz : sx, ez = sw ? sx : sz, X = this.wx(lx, lz), Z = this.wz(lx, lz);
    addCol(X - ex / 2, X + ex / 2, Z - ez / 2, Z + ez / 2, f === undefined ? CUR.f : f); return this;

const WINDOWS = [];

function mergeIntervals(arr) {
  arr.sort((a, b) => a[0] - b[0]); const out = [];

}
function isExtLine(w, c) { return (w === 'h' && Math.abs(c) === 25) || (w === 'v' && Math.abs(c) === 40); }
function roomAtPoint(x, z, f) {
  let best = null, ba = 1e9;
  for (const r of ROOMS) { if (r.floor !== f || r.void) continue; if (x >= r.x1 && x <= r.x2 && z >= r.z1 && z <= r.z2) { const a = (r.x2 - r.x1) * (r.z2 - r.z1); if (a < ba) { ba = a; best = r; } } }

}
function wallLines(f) {
  const lines = new Map();
  ROOMS.forEach(r => {
    if (r.floor !== f || r.nowall) return; const sk = r.skip || '';
    const add = (w, c, a, b) => { const k = w + ':' + c; if (!lines.has(k)) lines.set(k, { w: w, c: c, iv: [] }); lines.get(k).iv.push([a, b]); };
    if (sk.indexOf('n') < 0) add('h', r.z1, r.x1, r.x2);
    if (sk.indexOf('s') < 0) add('h', r.z2, r.x1, r.x2);
    if (sk.indexOf('w') < 0) add('v', r.x1, r.z1, r.z2);
    if (sk.indexOf('e') < 0) add('v', r.x2, r.z1, r.z2);
  });
  lines.forEach(L => { L.iv = mergeIntervals(L.iv); });
  return lines;
}

/* ---- automatic exterior windows (every ~4 m inside each room span) ---- */
function genWindows() {
  for (let f = 0; f <= 1; f++) {
    wallLines(f).forEach(L => {
      if (!isExtLine(L.w, L.c)) return;
      const bp = new Set();
      ROOMS.forEach(r => {
        if (r.floor !== f || r.nowall) return;
        if (L.w === 'h' && (r.z1 === L.c || r.z2 === L.c)) { bp.add(r.x1); bp.add(r.x2); }
        if (L.w === 'v' && (r.x1 === L.c || r.x2 === L.c)) { bp.add(r.z1); bp.add(r.z2); }
      });
      const pts = Array.from(bp).sort((a, b) => a - b), doors = DOORS.filter(d => d.f === f && d.w === L.w && d.c === L.c);
      for (let i = 0; i < pts.length - 1; i++) {
        const s0 = pts[i], s1 = pts[i + 1], mid = (s0 + s1) / 2;
        let owner = null, ba = 1e9;
        ROOMS.forEach(r => {
          if (r.floor !== f || r.nowall) return;
          const on = L.w === 'h' ? ((r.z1 === L.c || r.z2 === L.c) && mid >= r.x1 && mid <= r.x2) : ((r.x1 === L.c || r.x2 === L.c) && mid >= r.z1 && mid <= r.z2);
          if (on) { const a = (r.x2 - r.x1) * (r.z2 - r.z1); if (a < ba) { ba = a; owner = r; } }
        });
        if (!owner || owner.autoWin === false) continue;
        const spec = owner.win || { w: 1.4, y0: 1.0, y1: 2.6 }, span = s1 - s0;
        if (span < spec.w + 0.9) continue;
        const n = Math.max(1, Math.round(span / 4));
        for (let k = 0; k < n; k++) {
          const p = s0 + (k + 0.5) * span / n;
          if (doors.some(d => Math.abs(d.p - p) < (d.width + spec.w) / 2 + 0.35)) continue;
          if (WIN_BLOCK.some(b => b.f === f && b.w === L.w && b.c === L.c && p + spec.w / 2 > b.l && p - spec.w / 2 < b.r)) continue;
          WINDOWS.push({ f: f, w: L.w, c: L.c, p: p, width: spec.w, y0: spec.y0, y1: spec.y1 });
        }
      }
    });
  }
  EXTRA_WINDOWS.forEach(w => WINDOWS.push(w));
}

/* ---- one wall line ---- */

  });

/* ---- slab rectangle subtraction (stair holes) ---- */
function subRects(rect, holes) {
  let rs = [rect];
  holes.forEach(h => {
    const out = [];
    rs.forEach(r => {
      if (h.x2 <= r.x1 || h.x1 >= r.x2 || h.z2 <= r.z1 || h.z1 >= r.z2) { out.push(r); return; }
      if (h.x1 > r.x1) out.push({ x1: r.x1, x2: h.x1, z1: r.z1, z2: r.z2 });
      if (h.x2 < r.x2) out.push({ x1: h.x2, x2: r.x2, z1: r.z1, z2: r.z2 });
      const mx1 = Math.max(r.x1, h.x1), mx2 = Math.min(r.x2, h.x2);
      if (h.z1 > r.z1) out.push({ x1: mx1, x2: mx2, z1: r.z1, z2: h.z1 });
      if (h.z2 < r.z2) out.push({ x1: mx1, x2: mx2, z1: h.z2, z2: r.z2 });
    });
    rs = out;
  });
  return rs;
}

/* straight railing with balusters; coll: collider floor (undefined = floor of y) */

  else { addBox('vc', x1 - 0.045, y + 1.0, lz, x1 + 0.045, y + 1.07, lz + len, 0x4a2c14); addBox('vc', x1 - 0.03, y + 0.08, lz, x1 + 0.03, y + 0.14, lz + len, 0x4a2c14); }
  for (let i = 0; i <= n; i++) { const t = i / n * len; inst('baluster', horiz ? lx + t : x1, y + 0.1, horiz ? z1 : lz + t, 0, 1, 1.05, 1); }
  const nP = Math.max(1, Math.round(len / 2.5));

}

  if (P.moving) P.bob += dt * spd * CONFIG.BOB_FREQ * 1.6; else P.bob *= 0.9;
  const bob = CONFIG.HEAD_BOB ? Math.sin(P.bob * 2) * CONFIG.BOB_AMP * Math.min(1, spd / CONFIG.WALK) : 0;
  const target = P.feetY + CONFIG.EYE + bob;
  P.camY += (target - P.camY) * Math.min(1, dt * 16); if (Math.abs(target - P.camY) > 1.2) P.camY = target;
  camera.position.set(P.x, P.camY, P.z); camera.rotation.set(P.pitch, P.yaw, 0);
  if (skyDome) skyDome.position.copy(camera.position);
}

/* =====================================================================
   18. HUD: minimap + room label
   ===================================================================== */
const MM = { s: 2.2, W: 0, off: [null, null], ox: 60, oz: 40 };
function renderMapFloor(f) {
  const s = MM.s, w = Math.round(120 * s), h = Math.round(80 * s), [c, g] = mk(w, h);
  const X = x => (x + 60) * s, Z = z => (z + 40) * s;
  g.fillStyle = 'rgba(20,16,12,0.92)'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(88,70,48,0.55)'; g.fillRect(X(-40), Z(-25), 80 * s, 50 * s);
  ROOMS.forEach(r => { if (r.floor !== f || r.nowall || r.void) return; g.fillStyle = r.id.indexOf('cor') === 0 ? 'rgba(150,130,96,0.55)' : 'rgba(120,98,66,0.55)'; g.fillRect(X(r.x1), Z(r.z1), (r.x2 - r.x1) * s, (r.z2 - r.z1) * s); });
  if (f === 1) { g.fillStyle = 'rgba(10,8,6,0.9)'; g.fillRect(X(-15), Z(-25), 30 * s, 13 * s); }
  g.strokeStyle = '#e8d9a8'; g.lineWidth = 1.4; g.lineCap = 'butt';
  ROOMS.forEach(r => { if (r.floor !== f || r.nowall) return; const sk = r.skip || ''; g.beginPath();
    if (sk.indexOf('n') < 0) { g.moveTo(X(r.x1), Z(r.z1)); g.lineTo(X(r.x2), Z(r.z1)); } if (sk.indexOf('s') < 0) { g.moveTo(X(r.x1), Z(r.z2)); g.lineTo(X(r.x2), Z(r.z2)); }
    if (sk.indexOf('w') < 0) { g.moveTo(X(r.x1), Z(r.z1)); g.lineTo(X(r.x1), Z(r.z2)); } if (sk.indexOf('e') < 0) { g.moveTo(X(r.x2), Z(r.z1)); g.lineTo(X(r.x2), Z(r.z2)); } g.stroke(); });
  g.lineWidth = 3.2; DOORS.forEach(d => { if (d.f !== f || d.block) return; g.strokeStyle = d.kind === 'open' ? 'rgba(120,98,66,0.9)' : '#c07a2a'; g.beginPath();
    if (d.w === 'h') { g.moveTo(X(d.p - d.width / 2), Z(d.c)); g.lineTo(X(d.p + d.width / 2), Z(d.c)); } else { g.moveTo(X(d.c), Z(d.p - d.width / 2)); g.lineTo(X(d.c), Z(d.p + d.width / 2)); } g.stroke(); });
  g.fillStyle = 'rgba(240,210,120,0.8)'; STAIRS.forEach(st => { g.fillRect(X(st.x1), Z(st.z1), (st.x2 - st.x1) * s, (st.z2 - st.z1) * s); g.strokeStyle = 'rgba(40,30,10,0.8)'; g.lineWidth = 1; const n = 7; for (let i = 1; i < n; i++) { g.beginPath(); if (st.axis === 'z') { g.moveTo(X(st.x1), Z(st.z1) + i * (st.z2 - st.z1) * s / n); g.lineTo(X(st.x2), Z(st.z1) + i * (st.z2 - st.z1) * s / n); } else { g.moveTo(X(st.x1) + i * (st.x2 - st.x1) * s / n, Z(st.z1)); g.lineTo(X(st.x1) + i * (st.x2 - st.x1) * s / n, Z(st.z2)); } g.stroke(); } });
  g.fillStyle = 'rgba(150,200,150,0.9)'; g.fillRect(X(-2), Z(25), 4 * s, 12 * s);
  return c;
}
const HUD = { label: $('roomLabel'), fl: $('floorInd'), mini: $('mini'), g: null, cur: '', timer: 0 };
function areaName() {
  const f = P.feetY >= 2 ? 1 : 0;
  if (Math.abs(P.x) <= 40 && P.z >= -25 && P.z <= 25) { const r = roomAtPoint(P.x, P.z, f); if (r) return (f ? 'First Floor \u2014 ' : 'Ground Floor \u2014 ') + r.name; }
  if (P.z > 25) return 'Front Courtyard';
  if (P.x >= -37 && P.x <= 37 && P.z <= -43 && P.z >= -102) return P.x > -31 && P.x < 31 && P.z < -49 && P.z > -96 ? 'Football Pitch' : 'Running Track';
  if (P.x >= -60 && P.x <= -45 && P.z >= -40 && P.z <= -25) return 'Playground';
  if (P.z < -25) return 'Back Grounds';
  return 'Side Yard';
}
function updateHUD(dt) {
  HUD.timer -= dt;
  const nm = areaName(); if (nm !== HUD.cur) { HUD.cur = nm; HUD.label.textContent = nm; HUD.label.classList.add('show'); HUD.timer = 3.2; }
  if (HUD.timer <= 0) HUD.label.classList.remove('show');
  const f = P.feetY >= 2 ? '1' : 'G'; if (HUD.fl.textContent !== f) HUD.fl.textContent = f;
  const g = HUD.g, fl = P.feetY >= 2 ? 1 : 0, off = MM.off[fl], s = MM.s;
  g.fillStyle = '#14100c'; g.fillRect(0, 0, 140, 140); g.drawImage(off, (P.x + 60) * s - 70, (P.z + 40) * s - 70, 140, 140, 0, 0, 140, 140);
  g.save(); g.translate(70, 70); g.rotate(-P.yaw); g.fillStyle = '#ff5a3a'; g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, -8); g.lineTo(5.5, 6); g.lineTo(0, 3); g.lineTo(-5.5, 6); g.closePath(); g.fill(); g.stroke(); g.restore();
  g.fillStyle = '#f2e3b0'; g.font = 'bold 11px Arial'; g.textAlign = 'center'; g.fillText('N', 70, 12);
}

/* =====================================================================
   19. MAIN LOOP
   ===================================================================== */
let clock = 0, lastT = 0;
function updateDynamic(dt, t) {
  /* waving flag */
  if (EXT.flag) { const p = EXT.flag.geometry.attributes.position, b = EXT.flagBase; for (let i = 0; i < p.count; i++) { const x = b[i * 3], y = b[i * 3 + 1]; p.setZ(i, Math.sin(x * 3.1 - t * 3.4 + y * 1.3) * 0.16 * (x / 2.6)); p.setY(i, y + Math.sin(x * 2.2 - t * 2.6) * 0.03 * (x / 2.6)); } p.needsUpdate = true; EXT.flag.geometry.computeVertexNormals(); }
  /* clock tower shows the real time */
  const sec = Math.floor(Date.now() / 1000); if (sec !== EXT.lastSec) { EXT.lastSec = sec; drawTowerClock(new Date()); }
  /* auto-opening entrance doors */
  const e = DYN.entrance; if (e) { const d = Math.hypot(P.x, P.z - 24.8); e.target = d < 3.8 && P.feetY < 2 ? 1 : 0; e.open += (e.target - e.open) * Math.min(1, dt * 3.5); e.leaves.forEach(l => { l.pv.rotation.y = -l.s * e.open * 1.75; }); }
  lightTimer -= dt; if (lightTimer <= 0) { lightTimer = 0.2; updateLights(); }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(CONFIG.DT_MAX, Math.max(0, (now - lastT) / 1000)); lastT = now; clock += dt;
  updatePlayer(dt); updateDynamic(dt, clock); updateHUD(dt);
  renderer.render(scene, camera);
}

/* =====================================================================
   20. BOOT
   ===================================================================== */
async function boot() {
  await stage(3, 'Painting bricks and plaster...');
  TEX.brick = T_brick(); TEX.wall = T_wall(); TEX.ceiling = T_ceiling(); await stage(10, 'Laying floors...');
  TEX.parquet = T_parquet(); TEX.checker = T_checker(); TEX.boards = T_boards(); TEX.stile = T_stile(); TEX.gym = T_gymfloor(); await stage(18, 'Slating the roof...');
  TEX.slate = T_slate(); TEX.grassW = T_grass(1 / 8); TEX.concrete = T_concrete(); TEX.carpet = T_carpet(); TEX.stone = T_stone(); TEX.panel = T_panel();
  TEX.sawdust = T_sawdust(); TEX.gravel = T_gravel(); TEX.stars = T_stars(); makeMaterials(); await stage(30, 'Raising the walls...');
  buildSky(); buildShell(); await stage(45, 'Furnishing the ground floor...');
  corridor(0, 'main'); corridor(0, 'back'); corridor(1, 'main'); corridor(1, 'back');
  ROOMS.forEach(r => { if (r.floor === 0 && RB[r.id]) { setFloor(0); RB[r.id](r); } }); await stage(62, 'Furnishing the first floor...');
  ROOMS.forEach(r => { if (r.floor === 1 && RB[r.id]) { setFloor(1); RB[r.id](r); } }); await stage(75, 'Adding the small details...');
  buildProps(); buildRadiators(); await stage(84, 'Landscaping the grounds...');
  buildExterior(); await stage(92, 'Hanging lamps and finishing...');
  finalizeScene(); MM.off[0] = renderMapFloor(0); MM.off[1] = renderMapFloor(1); HUD.g = HUD.mini.getContext('2d');
  setupInput(); updateLights(); renderer.render(scene, camera);
  window.__game = { P: P, Input: Input, scene: scene, camera: camera, renderer: renderer, COLS: COLS, ROOMS: ROOMS, STAIRS: STAIRS, STATS: STATS, atlas: ATLAS, update: updatePlayer, step: (dt) => { updatePlayer(dt); updateDynamic(dt, clock); }, getFloorY: getFloorY, hits: hits, lights: POOL };
  await stage(100, 'Welcome!');
  $('hud').style.display = 'block'; if (!isTouch) { overlay.style.display = 'flex'; $('cross').style.display = 'block'; }
  else { $('hint').textContent = 'Left stick: move · Right side: look'; $('hint').classList.add('show'); setTimeout(() => $('hint').classList.remove('show'), 9000); }
  const ld = $('loading'); ld.style.opacity = 0; setTimeout(() => { ld.style.display = 'none'; }, 700);
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
boot().catch(err => { console.error(err); $('ltext').textContent = 'Error: ' + (err && err.message ? err.message : err); });

})();
</script>

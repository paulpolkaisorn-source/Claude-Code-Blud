<title>Forearm Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, an arm-wrestling-table palette (red pad / blue pad on chalk-steel), bottom tab bar. */
:root {
  --bg: #e8ecf1;
  --surface: #f8fafc;
  --surface-2: #dfe5ec;
  --ink: #111a2b;
  --muted: #566176;
  --line: #c5cdd8;
  --pad: #c81e35;
  --pad-ink: #ffffff;
  --pad-soft: #f3c9cf;
  --steel: #234a86;
  --steel-ink: #ffffff;
  --steel-soft: #d3def0;
  --brass: #946a08;
  --brass-soft: #f1e2b8;
  --good: #1d7f47;
  --warn: #9a5b00;
  --warn-soft: #fbe9cc;
  --scrim: rgba(8, 14, 26, 0.55);
  --font-display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1320;
    --surface: #141e31;
    --surface-2: #1c2940;
    --ink: #e9eef6;
    --muted: #94a1b7;
    --line: #2a3a57;
    --pad: #ff4b60;
    --pad-ink: #1a0207;
    --pad-soft: #4a1b26;
    --steel: #7aa5ea;
    --steel-ink: #08152b;
    --steel-soft: #1d3157;
    --brass: #e7b746;
    --brass-soft: #3d3215;
    --good: #52c98a;
    --warn: #f2ad4e;
    --warn-soft: #3b2a10;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1320;
  --surface: #141e31;
  --surface-2: #1c2940;
  --ink: #e9eef6;
  --muted: #94a1b7;
  --line: #2a3a57;
  --pad: #ff4b60;
  --pad-ink: #1a0207;
  --pad-soft: #4a1b26;
  --steel: #7aa5ea;
  --steel-ink: #08152b;
  --steel-soft: #1d3157;
  --brass: #e7b746;
  --brass-soft: #3d3215;
  --good: #52c98a;
  --warn: #f2ad4e;
  --warn-soft: #3b2a10;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
a { color: var(--steel); }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 3px solid var(--steel); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; }

/* ---------- type ---------- */
.display {
  font-family: var(--font-display);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  line-height: 0.95;
  text-wrap: balance;
  margin: 0;
}
h1.display { font-size: clamp(2.1rem, 8.5vw, 3rem); }
h2.sec {
  font-family: var(--font-display);
  font-weight: 800;
  text-transform: uppercase;
  font-size: 1.45rem;
  line-height: 1;
  letter-spacing: 0.01em;
  margin: 0;
  text-wrap: balance;
}
h3.sub {
  font-family: var(--font-cond);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.95rem;
  margin: 0;
}
.eyebrow {
  font-family: var(--font-cond);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-size: 0.8rem;
  color: var(--muted);
  margin: 0;
}
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

/* ---------- header ---------- */
header.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 6;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 900; text-transform: uppercase;
  font-size: 1.25rem; letter-spacing: 0.02em; text-decoration: none; color: var(--ink);
}
.brand svg { width: 26px; height: 26px; }
.brand .b1 { fill: var(--pad); }
.brand .b2 { fill: var(--steel); }
.top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sync {
  font-family: var(--font-cond); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em;
  color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.sync.ok::before { background: var(--good); }
.sync.busy::before { background: var(--warn); }
.me {
  width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink);
  background: var(--surface); font-family: var(--font-display); font-weight: 900; font-size: 1.1rem;
  cursor: pointer; flex: none;
}

/* ---------- main ---------- */
main { display: flex; flex-direction: column; gap: 14px; padding-block: 16px 24px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
  min-width: 0;
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid2 > * { min-width: 0; }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--font-cond); font-weight: 700; font-size: 1rem;
  text-transform: uppercase; letter-spacing: 0.07em;
  border: 0; border-radius: 10px; padding: 11px 16px; min-height: 44px;
  background: var(--pad); color: var(--pad-ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
}
.btn:hover { filter: brightness(1.05); }
.btn.steel { background: var(--steel); color: var(--steel-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 0.9rem; }
.linkbtn {
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  font-family: var(--font-cond); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--steel); font-size: 0.9rem;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-cond); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.04em;
  padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink);
  border: 1px solid transparent;
}
.chip.pad { background: var(--pad-soft); }
.chip.steel { background: var(--steel-soft); }
.chip.brass { background: var(--brass-soft); }
button.chip { cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- mission card (the table) ---------- */
.mission {
  display: grid; grid-template-columns: 96px 1fr;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
}
.padblock {
  background: var(--pad); color: var(--pad-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 14px 6px; position: relative;
}
.padblock::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 76px; height: 76px;
  transform: translate(-50%, -42%);
  border-radius: 50%; border: 3px solid currentColor; opacity: 0.2;
}
.mission.rest .padblock { background: var(--steel); color: var(--steel-ink); }
.padblock .big { font: 900 4.2rem/0.85 var(--font-display); position: relative; z-index: 1; }
.padblock .tag { font: 700 0.72rem var(--font-cond); letter-spacing: 0.12em; text-transform: uppercase; }
.mission .body { padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mission .body .row { margin-top: 4px; }

/* ---------- week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 0 9px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  font-family: var(--font-cond); font-weight: 600; min-width: 0;
}
.wd .l { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.wd .n { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.wd .dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line); }
.wd.plan .dot { border-color: var(--pad); }
.wd.done .dot { background: var(--pad); border-color: var(--pad); }
.wd.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* ---------- meters ---------- */
.bigval { font: 800 2.1rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.bigval small { font: 600 0.95rem var(--font-cond); color: var(--muted); letter-spacing: 0.04em; margin-left: 4px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pad); border-radius: 99px; transition: width 0.3s ease; }
.bar.steel > i { background: var(--steel); }
.bar.brass > i { background: var(--brass); }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button {
  width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface);
  font: 800 1.3rem var(--font-display); cursor: pointer;
}
.stepper button:hover { border-color: var(--ink); }
.stepper .val { min-width: 3.2ch; text-align: center; font: 800 1.6rem var(--font-display); font-variant-numeric: tabular-nums; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); flex: none;
  display: grid; place-items: center; background: var(--surface);
}
.check.on { background: var(--good); border-color: var(--good); }
.check.on::after { content: ""; width: 10px; height: 6px; border-left: 3px solid var(--surface); border-bottom: 3px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
button.li { background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%; }
button.li:first-child { border-top: 0; }
.xp { font: 700 0.85rem var(--font-cond); color: var(--brass); letter-spacing: 0.04em; white-space: nowrap; }

/* ---------- callouts ---------- */
.note { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.note .t { font: 700 0.85rem var(--font-cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--warn); }
.why { background: var(--steel-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.why .t { font: 700 0.85rem var(--font-cond); letter-spacing: 0.08em; text-transform: uppercase; color: var(--steel); }
.tip { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.tip .q { font: 900 2.6rem/0.8 var(--font-display); color: var(--pad); }

/* ---------- train ---------- */
.phase-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.phase-track div { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.phase-track i { display: block; height: 100%; background: var(--pad); }
.daypick { display: flex; gap: 8px; flex-wrap: wrap; }
.exrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; }
.exrow:first-child { border-top: 0; }
.exrow .grow { flex: 1; min-width: 0; }
.exrow .nm { font-weight: 600; }
.exrow .rx { font: 600 0.95rem var(--font-cond); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.kind {
  font: 700 0.68rem var(--font-cond); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); flex: none; width: 64px; text-align: center;
}
.kind.forearm { background: var(--pad-soft); color: var(--ink); }
.kind.core { background: var(--steel-soft); color: var(--ink); }

/* session */
.sess-head { display: flex; flex-direction: column; gap: 8px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ex.is-skipped { opacity: 0.6; }
.ex.all-done { border-color: var(--good); }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ex-name { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: 800 1.35rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.01em; }
.ex-name .i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); font: 700 0.75rem var(--font-body); color: var(--muted); text-transform: none; vertical-align: 3px; margin-left: 6px; }
.hint { font-size: 0.9rem; color: var(--muted); }
.hint.up { color: var(--good); font-weight: 600; }
.sets { display: flex; flex-direction: column; gap: 8px; }
.set-row { display: grid; grid-template-columns: 26px 1fr 1fr 48px; gap: 8px; align-items: center; }
.set-row.no-w { grid-template-columns: 26px 1fr 48px; }
.set-n { font: 800 1.2rem var(--font-display); color: var(--muted); text-align: center; }
.fld { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 10px; min-width: 0; height: 46px; }
.fld:focus-within { border-color: var(--steel); }
.fld input { border: 0; background: transparent; width: 100%; min-width: 0; font: 700 1.15rem var(--font-body); font-variant-numeric: tabular-nums; padding: 0; outline: none; }
.fld span { font: 600 0.8rem var(--font-cond); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; flex: none; }
.tick {
  width: 48px; height: 46px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); cursor: pointer;
  display: grid; place-items: center;
}
.tick::after { content: ""; width: 14px; height: 8px; border-left: 3px solid var(--line); border-bottom: 3px solid var(--line); transform: rotate(-45deg) translate(1px, -2px); }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); }
.tick[aria-pressed="true"]::after { border-color: var(--surface); }
.set-row.done .fld { background: var(--surface-2); }
.ex-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.linkbtn.warn { color: var(--warn); }

/* rest timer */
#restbar {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rest-in {
  max-width: 640px; margin: 0 auto 8px; background: var(--ink); color: var(--bg);
  border-radius: 14px; padding: 10px 12px 12px 16px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 8px 24px var(--scrim);
}
.rest-row { display: flex; align-items: center; gap: 12px; }
.rest-fb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 34px; }
.rest-fb button { flex: 1; min-width: 0; }
.rest-fb .msg { font: 600 0.95rem var(--font-cond); letter-spacing: 0.03em; }
.rest-in .lbl { font: 700 0.8rem var(--font-cond); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75; }
.rest-in .time { font: 900 1.9rem/1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 3ch; }
.rest-in .track { flex: 1; height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--bg) 25%, transparent); overflow: hidden; min-width: 30px; }
.rest-in .track i { display: block; height: 100%; background: var(--pad); }
.rest-in button { background: transparent; color: var(--bg); border: 1.5px solid color-mix(in srgb, var(--bg) 40%, transparent); border-radius: 8px; padding: 6px 10px; font: 700 0.85rem var(--font-cond); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }

/* ---------- fuel ---------- */
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datenav button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font: 800 1.2rem var(--font-display); }
.datenav button:disabled { opacity: 0.35; cursor: default; }
.foods { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.food {
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
  padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface);
  cursor: pointer; text-align: left; min-height: 44px; font-size: 0.9rem; line-height: 1.2;
}
.food:hover { border-color: var(--pad); }
.food b { font: 700 0.9rem var(--font-cond); color: var(--pad); white-space: nowrap; }
.inline-form { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; }
.inline-form input, .field input, .field select {
  border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; min-height: 44px; width: 100%; min-width: 0;
}
.counter { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.counter:first-child { border-top: 0; }
.counter .grow { flex: 1; min-width: 150px; }
.x { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 1.2rem; padding: 4px 8px; border-radius: 6px; }
.x:hover { color: var(--pad); }

/* ---------- progress ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .v { font: 800 2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.class-card {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
}
.class-card .lvl {
  width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  border: 6px solid var(--brass); background: var(--surface-2); font: 900 1.9rem var(--font-display);
}
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.plate {
  width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
  border: 5px solid var(--line); background: var(--surface); color: var(--muted);
  font: 900 1.05rem var(--font-display); letter-spacing: 0.02em; position: relative;
}
.badge.on .plate { border-color: var(--brass); background: var(--brass-soft); color: var(--ink); }
.badge .bn { font: 700 0.8rem var(--font-cond); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; }
.badge .bd { font-size: 0.75rem; color: var(--muted); line-height: 1.2; }
.heat-wrap { display: grid; grid-template-columns: auto 1fr; gap: 6px; }
.heat-days { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; font: 600 0.65rem var(--font-cond); color: var(--muted); }
.heat-days span { display: flex; align-items: center; }
.heat { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); max-width: 100%; }
.heat i.l { background: var(--steel-soft); }

const LOCAL_KEY = 'forearmForge.v1';
const Store = {
  docs: {},
  mode: 'local',
  uid: null,
  col: null,
  dirty: new Set(),
  inflight: new Set(),
  timer: null,
  readLocal(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
  writeLocal(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage blocked: memory only */ } },
  cacheKey() { return this.mode === 'cloud' ? 'forearmForge.cache.' + this.uid : LOCAL_KEY; },
  persist() { this.writeLocal(this.cacheKey(), this.docs); },
  put(id, body) {
    if (body === undefined) delete this.docs[id]; else this.docs[id] = body;
    this.persist();
    if (this.mode === 'cloud') { this.dirty.add(id); this.schedule(600); }
  },
  schedule(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async flush() {
    if (this.mode !== 'cloud' || !this.col) return;
    const ids = [...this.dirty];
    for (const id of ids) {
      if (this.inflight.has(id)) continue;
      this.dirty.delete(id);
      this.inflight.add(id);
      setSync('saving');
      try {
        const body = this.docs[id];
        if (body === undefined) await this.col.doc(id).delete();
        else await this.col.doc(id).set(body);
      } catch (e) {
        const code = e && e.code;
        if (code === 'unavailable' || code === 'resource_exhausted') { this.dirty.add(id); this.inflight.delete(id); this.schedule(1500 + Math.random() * 2000); continue; }
        if (code === 'quota_exceeded') toast('Your save space is full. Older months may need clearing.');
        else if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled') { this.goLocal('offline'); }
        else console.warn('Save failed', e);
      }
      this.inflight.delete(id);
      if (this.dirty.has(id)) this.schedule(400);
    }
    if (!this.dirty.size && !this.inflight.size && this.mode === 'cloud') setSync('cloud');
  },
  goLocal(state) {
    this.mode = 'local';
    this.persist();
    setSync(state || 'device');
  },
};

function setSync(state) {
  const el = $('#sync');
  if (!el) return;
  const map = {
    device: ['Saved on this device', ''],
    connecting: ['Connecting…', 'busy'],
    cloud: ['Saved to your account', 'ok'],
    saving: ['Saving…', 'busy'],
    offline: ['Offline · saved on this device', 'busy'],
  };
  const [txt, cls] = map[state] || map.device;
  el.textContent = txt;
  el.className = 'sync' + (cls ? ' ' + cls : '');
}

async function initCloud() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  let db, user;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  let uid = null;
  try { uid = await user.id(); } catch (e) { uid = null; }
  if (!uid) return;

  const localDocs = clone(Store.docs) || {};
  Store.uid = uid;
  Store.mode = 'cloud';
  Store.col = db.collection('data/users/' + uid);
  Store.docs = Store.readLocal(Store.cacheKey()) || {};
  render();
  setSync('connecting');

  let gotServer = false;
  const loadTimer = setTimeout(() => { if (!gotServer) setSync('offline'); }, 10000);

  try {
    Store.col.onSnapshot((snap) => {
      if (!snap.metadata.fromCache && !gotServer) {
        gotServer = true;
        clearTimeout(loadTimer);
        if (snap.empty && Object.keys(localDocs).length) {
          // first visit with an account: move this device's data up (keep anything edited since)
          for (const [id, body] of Object.entries(localDocs)) {
            if (Store.dirty.has(id) || Store.inflight.has(id)) continue;
            Store.docs[id] = body; Store.dirty.add(id);
          }
          Store.persist();
          Store.schedule(50);
          render();
          return;
        }
        setSync('cloud');
      }
      let changed = false;
      for (const d of snap.docs) {
        if (Store.dirty.has(d.id) || Store.inflight.has(d.id)) continue;
        const body = d.data();
        if (JSON.stringify(body) !== JSON.stringify(Store.docs[d.id])) { Store.docs[d.id] = clone(body); changed = true; }
      }
      for (const ch of snap.docChanges()) {
        if (ch.type === 'removed' && !Store.dirty.has(ch.doc.id) && !Store.inflight.has(ch.doc.id) && Store.docs[ch.doc.id] !== undefined) {
          delete Store.docs[ch.doc.id]; changed = true;
        }
      }
      if (changed) { Store.persist(); render(); }
    }, (err) => {
      clearTimeout(loadTimer);
      console.warn('Sync stopped', err);
      Store.goLocal('offline');
    });
  } catch (e) {
    clearTimeout(loadTimer);
    Store.goLocal('device');
  }
}

      const up = av.find((v) => v > top + 0.01);
      if (up == null) return { text: `${lastTxt}. That is your heaviest dumbbell, so lower every rep over 3 seconds to make it harder.`, w: top, up: true };
      if (!jumpOk(id, top, up)) return { text: `${lastTxt}. Your next dumbbell (${fmtW(up)}) is a big jump. Stay at ${fmtW(top)} and lower each rep over 3 seconds first.`, w: top, up: true };
      return { text: `${lastTxt}. You hit the top of the range. Grab the ${fmtW(up)} dumbbell today.`, w: up, up: true };
    }
    if (W) { const nw = round1(top + incFor(id)); return { text: `${lastTxt}. You hit the top of the range. Try ${fmtW(nw)} today.`, w: nw, up: true }; }
    return { text: `${lastTxt}. Top of the range. Make it harder: slower reps or a harder version.`, w: null, up: true };
  }
  return { text: `${lastTxt}. Same ${W ? 'weight' : 'target'}, beat it by one ${isTimed(id) ? 'or two seconds' : 'rep'}.`, w: W ? top : null, up: false };
}

/* XP, levels, quests, badges — all derived from logs, never stored */
function questList() {
  const q = quests();
  const ws = doneWorkouts();
  const g = proteinGoal().goal;
  return [
    { id: 'setup', name: 'Set up your profile', done: hasProfile(), act: 'profile' },
    { id: 'rules', name: 'Read the 8 Gym Rules', done: !!q.rules, act: 'goto-rules' },
    { id: 'corner', name: 'Show this plan to a parent, guardian or coach', done: !!q.corner, act: 'corner' },
    { id: 'lore', name: 'Read the Devon Files', done: !!q.lore, act: 'goto-lore' },
    { id: 'gear', name: 'Add your dumbbells to the AI trainer', done: !!availW(), act: 'goto-coach' },
    { id: 'first', name: 'Finish your first workout', done: ws.length > 0, act: 'goto-train' },
    { id: 'fuel', name: 'Hit your protein goal once', done: allDays().some(([, d]) => dayProtein(d) >= g), act: 'goto-fuel' },
  ];
}
function xpInfo() {
  const g = proteinGoal().goal;
  const st = { xp: 0, workouts: 0, proteinDays: 0, waterDays: 0, sleepDays: 0, checkins: 0 };
  for (const [, d] of allDays()) {
    if (d.w && d.w.done) { st.xp += 100; st.workouts++; }
    if (dayProtein(d) >= g) { st.xp += 30; st.proteinDays++; }
    if ((d.wa || 0) >= 8) { st.xp += 10; st.waterDays++; }
    if (d.sl >= 8 && d.sl <= 10) { st.xp += 20; st.sleepDays++; }
    if (d.pl && d.pl.b) st.xp += 5;
    if (d.ck) { st.xp += 25; st.checkins++; }
  }
  st.xp += questList().filter((x) => x.done).length * 50;
  return st;
}
function levelFor(xp) {
  let i = 0;
  for (let j = 0; j < LEVELS.length; j++) if (xp >= LEVELS[j][0]) i = j;
  const cur = LEVELS[i], nxt = LEVELS[i + 1];
  return { i, name: cur[1], from: cur[0], to: nxt ? nxt[0] : null, nextName: nxt ? nxt[1] : null };
}
function weekStreak() {
  const counts = {};
  for (const { k } of doneWorkouts()) { const m = mondayOf(k); counts[m] = (counts[m] || 0) + 1; }
  let m = mondayOf(todayKey());
  if ((counts[m] || 0) < 2) m = addDays(m, -7);
  let s = 0;
  while ((counts[m] || 0) >= 2) { s++; m = addDays(m, -7); }
  return s;
}
function badgeList(st) {
  const ws = doneWorkouts();
  const perWeek = {};
  for (const { k } of ws) { const m = mondayOf(k); perWeek[m] = (perWeek[m] || 0) + 1; }
  const best3 = Object.values(perWeek).some((c) => c >= 3);
  return [
    { s: '1ST', n: 'First Rep', d: 'Finish 1 workout', on: ws.length >= 1 },
    { s: '3X', n: 'Hat Trick', d: '3 workouts in one week', on: best3 },
    { s: '4WK', n: 'Iron Month', d: '4-week streak', on: weekStreak() >= 4 },
    { s: 'P1', n: 'Form Master', d: 'Finish Phase 1', on: ws.length >= 12 },
    { s: 'P2', n: 'Engine Built', d: 'Finish Phase 2', on: ws.length >= 24 },
    { s: 'PRO', n: 'Protein Pro', d: 'Hit protein 5 days', on: st.proteinDays >= 5 },
    { s: 'ZZZ', n: 'Sleep Beast', d: '7 nights of 8–10 h', on: st.sleepDays >= 7 },
    { s: 'H2O', n: 'Hydro Homie', d: '8 glasses on 7 days', on: st.waterDays >= 7 },
    { s: 'CM', n: 'Measured Up', d: '3 body check-ins', on: st.checkins >= 3 },
    { s: '50', n: 'Fifty Club', d: '50 workouts', on: ws.length >= 50 },
  ];
}

const pct = (a, b) => (b ? clamp(Math.round((a / b) * 100), 0, 100) : 0);
const bar = (a, b, cls = '') => `<div class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="${b}" aria-valuenow="${a}"><i style="width:${pct(a, b)}%"></i></div>`;

function niceStep(range) {
  const raw = range / 3;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function lineChart(pts, opts = {}) {
  const W = 320, H = 160, L = 36, R = 44, T = 14, B = 26;
  if (!pts.length) return '';
  const ys = pts.map((p) => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo -= 1; hi += 1; }
  const step = niceStep(hi - lo);
  lo = Math.floor(lo / step) * step;
  hi = Math.ceil(hi / step) * step;
  if (lo < 0 && Math.min(...ys) >= 0) lo = 0;
  const x = (i) => (pts.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (pts.length - 1));
  const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
  let g = '';
  for (let v = lo; v <= hi + step / 1000; v += step) {
    const yy = y(v).toFixed(1);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${round1(v)}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  const area = pts.length > 1 ? `<path class="area" d="${line} L${x(pts.length - 1).toFixed(1)},${(H - B).toFixed(1)} L${x(0).toFixed(1)},${(H - B).toFixed(1)} Z"/>` : '';
  const dots = pts.map((p, i) => (i === pts.length - 1 ? '' : `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="3"/>`)).join('');
  const li = pts.length - 1;
  const end = `<circle class="end" cx="${x(li).toFixed(1)}" cy="${y(pts[li].y).toFixed(1)}" r="5"/><text class="endlbl" x="${(x(li) + 9).toFixed(1)}" y="${(y(pts[li].y) + 4).toFixed(1)}">${esc(String(round1(pts[li].y)))}${esc(opts.suffix || '')}</text>`;
  const xl = pts.length > 1
    ? `<text x="${x(0).toFixed(1)}" y="${H - 6}" text-anchor="start">${esc(pts[0].label)}</text><text x="${x(li).toFixed(1)}" y="${H - 6}" text-anchor="end">${esc(pts[li].label)}</text>`
    : `<text x="${x(0).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(pts[0].label)}</text>`;
  return `<svg class="chart ${opts.sample ? 'sample' : ''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Chart')}">${g}${area}<path class="ln" d="${line}"/>${dots}${end}${xl}</svg>`;
}

  let rest = false, letter = next, tag = 'Day', eyebrow, title, body, actions;

  if (open) {

    rest = true; letter = '✓'; tag = 'Done';
    eyebrow = 'Done for today';
    title = 'Rest is where you grow';
    body = `Workout #${n} is in the books. Next up: Day ${next}, ${D.name}. Now go eat something with protein in it.`;
    actions = `<a class="btn steel" href="#fuel">Log your food</a>`;
  } else if (yest.w && yest.w.done) {
    rest = true; letter = 'R'; tag = 'Rest';
    eyebrow = 'Rest day';
    title = 'Recovery mode';
    body = 'You trained yesterday. Muscles and growth plates rebuild on rest days, so no lifting today. Play a sport, ride a bike, or do the 5-minute mobility routine.';

/* ---------- train ---------- */
function doneSetCount(w) { let c = 0; for (const rows of Object.values(w.sets || {})) for (const r of rows) if (r[2]) c++; return c; }

function vTrain() {
  const open = openSession();
  if (open) return sessionView(open);
  const ws = doneWorkouts();
  const n = ws.length;
  const ph = phaseFor(n);
  const P = PHASES[ph - 1];
  const letter = S.previewDay || nextLetter();
  const D = DAYS[letter];
  const t = todayKey();
  const today = getDay(t);
  const yest = getDay(addDays(t, -1));
  const wk = weekCount(mondayOf(t));
  const inPhase = ph === 3 ? n - 24 : n - P.from;
  const track = PHASES.map((x, i) => {
    const filled = i + 1 < ph ? 100 : i + 1 === ph ? pct(Math.min(inPhase, 12), 12) : 0;

function exCard(k, w, id) {

/* ---------- coach: dumbbell trainer + AI ---------- */
function aiErr(code) {
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
    S.ai = 'off'; S.aiDenied = true;
    return 'The AI coach is turned off for this page, so the built-in coach takes over.';
  }
  if (code === 'rate_limited') return 'Coach needs a breather. Try again in a minute.';
  if (code === 'session_expired') return 'Sign in to Claude again to use the coach.';
  if (code === 'refused') return 'Coach can\'t help with that one. Try asking a different way.';
  if (code === 'invalid_json' || code === 'empty_completion') return 'Coach got mixed up. Try again.';
  if (code === 'prompt_too_large') return 'Too much to read at once. Clear the chat and try again.';
  return 'Couldn\'t reach the coach. Check your connection and try again.';
}

function athleteSummary() {
  const p = prof();
  const n = doneWorkouts().length;
  const t = todayKey();
  const today = getDay(t), yest = getDay(addDays(t, -1));
  const av = availW();
  return [
    `Age ${p.age}. Units: ${unitW()}.${p.bwKg ? ` Body weight ${bwDisplay(p.bwKg)} ${unitW()}.` : ''}`,
    `Program: phase ${phaseFor(n)} of 3 (${PHASES[phaseFor(n) - 1].name}), ${n} workouts done, ${weekCount(mondayOf(t))} this week. Trained yesterday: ${yest.w && yest.w.done ? 'yes' : 'no'}. Trained today: ${today.w && today.w.done ? 'yes' : 'no'}.`,
    `Dumbbells they own (pairs): ${av ? av.join(', ') + ' ' + unitW() : 'none entered yet'}.`,
    `Today so far: protein ${dayProtein(today)} of ${proteinGoal().goal} g, water ${today.wa || 0} of 8 glasses, sleep last night ${today.sl != null ? today.sl + ' h' : 'not logged'}.`,
  ].join('\n');
}
const FB_WORD = ['', 'too easy', 'good', 'too hard'];
function setsLine(w, id) {
  const rows = (w.sets && w.sets[id] || []).filter((x) => x[2]);
  if (!rows.length) return '';
  const u = w.u || 'kg';
  const fb = (w.fb && w.fb[id] || []).map((v) => FB_WORD[v]).filter(Boolean);
  const ws = rows.map((x) => (hasWeight(id) ? `${round1(toUnit(x[0] || 0, u, unitW()))}${unitW()}x` : '') + x[1] + (isTimed(id) ? 's' : ''));
  return `${id} ${ws.join(', ')}${fb.length ? ` (sets felt: ${fb.join(', ')})` : ''}`;
}
function historyLines(count) {
  const out = doneWorkouts().slice(-count).reverse().map(({ k, w }) => {
    const parts = sessEx(w).map((id) => setsLine(w, id)).filter(Boolean);
    const sk = Object.keys(w.sk || {});
    return `- ${fmtShort(k)}, ${sessName(w)}, felt ${['not rated', 'easy', 'just right', 'too hard'][w.feel || 0]}: ${parts.join('; ') || 'no sets logged'}${sk.length ? `; skipped because of pain: ${sk.join(', ')}` : ''}`;
  });
  return out.length ? out.join('\n') : '- none yet, this is their first workout';
}
function libraryLines() {
  const how = { wr: 'dumbbell weight + reps', r: 'bodyweight reps (weight 0)', ws: 'dumbbell weight + seconds held', s: 'bodyweight seconds held (weight 0)' };
  return Object.entries(EX).map(([id, e]) => `${id} | ${e.name} | ${how[e.log]}${e.side ? ` | reps are per ${e.side}` : ''} | ${e.kind} | loads: ${AREAS[id].join(', ') || 'nothing in particular'}`).join('\n');
}
function maxSetsNow() { const n = doneWorkouts().length; const ph = phaseFor(n); return ph === 1 ? (n < 3 ? 1 : 2) : 3; }
function exRange(minutes) { return minutes <= 20 ? [4, 5] : minutes <= 30 ? [6, 7] : [7, 8]; }

function aiPlanPrompt() {
  const C = S.coach;
  const [mn, mx] = exRange(C.time);
  const av = availW();
  return `You are Coach Forge, the strength coach inside Forearm Forge, a training app for a ${prof().age}-year-old who wants to get strong for arm wrestling (big Devon Larratt fan). Build ONE dumbbell workout for today.

Hard rules, never break them:
- Use only exercise ids from LIBRARY. ${mn}-${mx} exercises, no repeats.

- Reps: weighted lifts 8-15, forearm and finger work 12-25, core reps 6-15. Timed holds are in seconds, 10-45.

Reply with only JSON in exactly this shape:

${athleteSummary()}

/* clamp whatever comes back from the model to the app's safe ranges */
function capWeight(id, w, r) {
  const av = availW();
  const sg = suggestion(id, r, todayKey());
  let x = Number.isFinite(w) ? w : (av ? av[av.length - 1] : 0);
  if (av) x = snapDown(x, av);
  const cap = sg.w != null ? sg.w : lightCap(id);
  if (cap != null) x = Math.min(x, cap);
  return Math.max(0, round1(x));
}
function validatePlan(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.exercises)) return null;
  const C = S.coach;
  const maxS = maxSetsNow();
  const seen = new Set();
  const ex = [], rx = {}, cue = {}, w0 = {};
  for (const it of raw.exercises) {
    const id = String((it && it.id) || '');
    if (!EX[id] || seen.has(id)) continue;
    if (AREAS[id].some((a) => C.sore.includes(a))) continue;
    seen.add(id);
    const t = isTimed(id) ? 1 : 0;
    const k = EX[id].rx;
    const b = t ? [10, 45] : (k === 'forearm' || k === 'fingers') ? [12, 25] : k === 'core' ? [6, 15] : [5, 15];
    let lo = clamp(Math.round(+it.lo || b[0]), b[0], b[1]);
    let hi = clamp(Math.round(+it.hi || lo), b[0], b[1]);
    if (hi < lo) [lo, hi] = [hi, lo];
    let s = clamp(Math.round(+it.sets || 1), 1, maxS);
    if (C.energy === 1) s = Math.min(s, Math.max(1, maxS - 1));
    rx[id] = t ? { s, lo, hi, t: 1 } : { s, lo, hi };
    if (hasWeight(id)) w0[id] = capWeight(id, Number(it.weight), rx[id]);
    cue[id] = String((it && it.cue) || '').trim().slice(0, 140);
    ex.push(id);
    if (ex.length >= 8) break;
  }
  if (ex.length < 3) return null;
  return {
    title: String(raw.title || 'AI Session').trim().slice(0, 32) || 'AI Session',
    intro: String(raw.intro || '').trim().slice(0, 240),
    closer: String(raw.closer || '').trim().slice(0, 160),
    ex, rx, cue, w0, src: 'ai',
  };
}
function offlinePlan() {
  const C = S.coach;
  const n = doneWorkouts().length;
  const ph = phaseFor(n);
  const base = C.focus === 'full' ? DAYS[nextLetter()].ex : FOCUS_EX[C.focus];
  const count = exRange(C.time)[1];
  const ex = base.filter((id) => !AREAS[id].some((a) => C.sore.includes(a))).slice(0, count);
  if (ex.length < 3) return null;
  const rx = {}, w0 = {}, cue = {};
  for (const id of ex) {
    const r = rxFor(id, ph, n);
    if (C.energy === 1) r.s = Math.max(1, r.s - 1);
    rx[id] = r;
    if (hasWeight(id)) w0[id] = capWeight(id, Infinity, r);
    cue[id] = EX[id].cues[0];
  }
  const mood = C.energy === 1 ? 'Low energy day, so fewer sets.' : C.energy === 3 ? 'Fired up is great. Still no max-outs.' : 'Smooth reps, clean form.';
  return { title: `${FOCI[C.focus].name} session`, intro: `Built from your dumbbells and your last workouts. ${mood}`, closer: '', ex, rx, cue, w0, src: 'coach' };
}
const soreBlockMsg = () => 'With those sore spots there isn\'t enough left to train safely today. Take a rest day, or pick a focus that skips them (Lower body if it is your arms).';

async function buildWorkout() {
  const C = S.coach;
  if (C.building) return;
  if (!availW()) { toast('Add your dumbbells first.'); return; }
  C.err = null;
  if (S.ai !== 'ready' || !SAMPLE) {
    C.draft = offlinePlan();
    if (!C.draft) C.err = soreBlockMsg();
    render();
    return;
  }
  C.building = true; C.draft = null;
  render();
  const ctl = new AbortController();
  C.ctl = ctl;
  try {
    const raw = await SAMPLE.json(aiPlanPrompt(), { signal: ctl.signal, cache: false });
    const p = validatePlan(raw);
    if (p) C.draft = p;
    else {
      C.draft = offlinePlan();
      C.err = C.draft ? 'The AI plan did not fit your dumbbells or sore spots, so the built-in coach made this one.' : soreBlockMsg();
    }
  } catch (e) {
    const code = e && e.code;
    if (code !== 'cancelled') {
      C.err = aiErr(code);
      C.draft = offlinePlan();
      if (C.draft) C.err += ' Here is a plan from the built-in coach.';
    }
  } finally {
    C.building = false; C.ctl = null;
    render();
  }
}

function startPlan(p) {

function fmtMsg(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
function chatLogHTML() {
  if (!S.chat.length) return '<p class="chat-empty">Coach knows your dumbbells, your plan and your last workouts. Ask anything about form, weights, food or arm wrestling.</p>';
  return S.chat.map((m, i) => `<div class="msg ${m.role}" id="msg-${i}">${m.role === 'assistant' ? '<span class="who">Coach</span>' : ''}<span class="mt">${m.pending && !m.text ? '<span class="thinking"><span class="spin" aria-hidden="true"></span>Thinking…</span>' : fmtMsg(m.text)}</span>${m.err ? `<span class="err">${esc(m.err)}</span>` : ''}</div>`).join('');
}
function chatBlock() {
  return `<div class="chat-log" id="chat-log" aria-live="polite">${chatLogHTML()}</div>
    ${S.chat.length ? '' : `<div class="sugg">${SUGG.map((q) => `<button class="chip" data-act="ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}

    <p class="small muted">The coach is AI and can get things wrong. If it ever disagrees with the 8 Gym Rules, the rules win.</p>`;
}
function renderChat() {
  const log = $('#chat-log');
  if (log) { log.innerHTML = chatLogHTML(); log.scrollTop = log.scrollHeight; }
  const b = $('#chat-send');
  if (b) b.textContent = S.chatBusy ? 'Stop' : 'Send';
  const sg = $('.sugg');
  if (sg && S.chat.length) sg.remove();
}
function paintMsg(i) {
  const el = document.querySelector(`#msg-${i} .mt`);
  if (el) el.innerHTML = fmtMsg(S.chat[i].text);
  const log = $('#chat-log');
  if (log) log.scrollTop = log.scrollHeight;
}
async function sendChat(q) {
  if (S.ai !== 'ready' || !SAMPLE || S.chatBusy) return;
  const history = S.chat.filter((m) => m.text && !m.err).slice(-12).map((m) => ({ role: m.role, content: m.text }));
  const turns = [{ role: 'user', content: coachRules() }, ...history, { role: 'user', content: q }];
  S.chat.push({ role: 'user', text: q });
  S.chat.push({ role: 'assistant', text: '', pending: true });
  const msg = S.chat[S.chat.length - 1];
  S.chatBusy = true;
  renderChat();
  const ctl = new AbortController();
  S.chatCtl = ctl;
  try {
    const res = await SAMPLE(turns, {
      cache: false, signal: ctl.signal,
      onText: ({ text }) => { msg.text = text; msg.pending = false; const i = S.chat.indexOf(msg); if (i >= 0) paintMsg(i); },
    });
    msg.text = res.text;
    if (res.truncated) msg.err = 'Cut short. Ask for less at a time.';
  } catch (e) {
    const code = e && e.code;
    msg.text = code === 'refused' ? '' : (e && e.text) || msg.text || '';
    if (code !== 'cancelled') msg.err = aiErr(code);
    if (!msg.text && !msg.err) { const i = S.chat.indexOf(msg); if (i >= 0) S.chat.splice(i, 1); }
  } finally {
    msg.pending = false;
    S.chatBusy = false; S.chatCtl = null;
    saveChat();
    renderChat();
    if (S.ai === 'off') render();
  }
}

function dayNote(days) {
  if (days.length < 2) return 'Pick at least 2 days. 3 is ideal.';
  const s = days.slice().sort((a, b) => a - b);
  const set = new Set(s);
  const back2back = s.some((d) => set.has((d + 1) % 7));
  if (back2back) return 'Heads up: two of these days are back to back. Leave a rest day between them.';
  return days.length === 3 ? 'Perfect: 3 days with rest in between.' : '2 days works. 3 is better.';
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer;
function toast(html) {
  const el = $('#toast');
  el.innerHTML = html;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* =========================================================
   Timers: elapsed, rest
   ========================================================= */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function beep() {
  if (!actx) return;
  try {
    [0, 0.22].forEach((off) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880;
      const t0 = actx.currentTime + off;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.2);
    });
  } catch (e) { /* no sound available */ }
}
function startRest(sec, ex, i) {
  S.rest = { end: Date.now() + sec * 1000, total: sec, ex, i };
  const el = $('#restbar');
  el.innerHTML = `<div class="rest-in" role="timer" aria-live="off">
    <div class="rest-row"><div class="stack" style="gap:0"><span class="lbl">Rest</span><span class="time" id="rest-left">${sec}</span></div><div class="track"><i id="rest-fill" style="width:100%"></i></div><button data-act="rest-add">+15s</button><button data-act="rest-skip">Skip</button></div>
    ${ex ? `<div class="rest-fb" id="rest-fb"><span class="lbl">That set was</span><button data-act="setfeel" data-v="1">Too easy</button><button data-act="setfeel" data-v="2">Good</button><button data-act="setfeel" data-v="3">Too hard</button></div>` : ''}
  </div>`;
  el.hidden = false;
  tickRest();
}
function tickRest() {
  const el = $('#restbar');
  document.body.classList.toggle('resting', !!S.rest);
  if (!S.rest) { el.hidden = true; return; }
  const ms = S.rest.end - Date.now();
  if (ms <= 0) {
    S.rest = null; el.hidden = true;
    document.body.classList.remove('resting');
    beep();
    try { if (navigator.vibrate) navigator.vibrate([120, 80, 120]); } catch (e) { /* not allowed */ }
    toast('Rest over. Next set, lock in.');
    return;
  }
  const left = Math.ceil(ms / 1000);
  const m = Math.floor(left / 60), s = left % 60;
  const lt = $('#rest-left'), fill = $('#rest-fill');
  if (lt) lt.textContent = m ? `${m}:${pad2(s)}` : String(s);
  if (fill) fill.style.width = `${clamp((ms / (S.rest.total * 1000)) * 100, 0, 100)}%`;
}
function tickElapsed() {
  const el = $('#elapsed');
  if (!el) return;
  const o = openSession();
  if (!o) return;
  const sec = Math.max(0, Math.floor((Date.now() - o.w.st) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  el.textContent = h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}
setInterval(tickRest, 250);
setInterval(tickElapsed, 1000);

let wakePending = false;
async function holdWake(on) {
  try {
    if (on && !S.wake && !wakePending && navigator.wakeLock) {
      wakePending = true;
      S.wake = await navigator.wakeLock.request('screen');
      S.wake.addEventListener('release', () => { S.wake = null; });
    }
    if (!on && S.wake) { const l = S.wake; S.wake = null; await l.release(); }
  } catch (e) { S.wake = null; }
  wakePending = false;
}

/* =========================================================
   Render
   ========================================================= */
function render() {
  const main = $('#main');
  const fn = { today: vToday, train: vTrain, coach: vCoach, fuel: vFuel, progress: vProgress, lore: vLore }[S.view] || vToday;
  main.innerHTML = fn();
  document.querySelectorAll('.tab').forEach((a) => { if (a.dataset.tab === S.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const p = prof();
  $('#meBtn').textContent = (p.name || '?').trim().charAt(0).toUpperCase() || '?';
  tickElapsed();
  if (S.view === 'train' && openSession()) holdWake(true);
}

function go(view) {
  if (!VIEWS.includes(view)) view = 'today';
  if (location.hash !== '#' + view) { location.hash = view; return; }
  route();
}
function route() {
  const h = (location.hash || '').replace('#', '');
  const v = VIEWS.includes(h) ? h : 'today';
  const changed = v !== S.view;
  S.view = v;
  if (v === 'lore' && !quests().lore) {
    withXp(() => Store.put('quests', Object.assign({}, quests(), { lore: true })));
  }
  render();
  if (changed) window.scrollTo({ top: 0 });
}

/* XP diff → toast */
function withXp(fn) {
  const before = xpInfo().xp;
  const r = fn();
  const after = xpInfo().xp;
  if (after > before) {
    const lb = levelFor(before), la = levelFor(after);
    if (la.i > lb.i) toast(`LEVEL UP: <b>${esc(la.name)}</b> <span class="xpv">+${after - before} XP</span>`);
    else toast(`<span class="xpv">+${after - before} XP</span> · ${esc(pick(HYPE))}`);
  }
  return r;
}

/* =========================================================
   Actions
   ========================================================= */
function startWorkout(letter) {
  const t = todayKey();
  if (openSession()) { go('train'); return; }
  const today = getDay(t);
  if (today.w && today.w.done) { toast('Already trained today. Rest = growth.'); return; }
  const n = doneWorkouts().length;
  const ph = phaseFor(n);
  const sets = {};
  for (const id of DAYS[letter].ex) {
    const r = rxFor(id, ph, n);
    const sg = suggestion(id, r, t);
    sets[id] = Array.from({ length: r.s }, () => [hasWeight(id) ? sg.w : null, null, 0]);
  }
  updDay(t, (d) => { d.w = { d: letter, n, ph, u: unitW(), st: Date.now(), sets, sk: {}, wu: false, done: false }; });
  ensureAudio();
  S.previewDay = null;
  go('train');
  window.scrollTo({ top: 0 });
}

function updSession(fn) {
  const o = openSession();
  if (!o) return;
  updDay(o.k, (d) => fn(d.w));
}

const ACTIONS = {
  noop() { return false; },
  close() { closeSheet(); return false; },
  'sheet-bg'(el, ev) { if (ev.target === el) closeSheet(); return false; },
  profile() { profileSheet(); return false; },
  'goto-train'() { go('train'); return false; },

  'goto-rules'() { go('lore'); setTimeout(() => { const r = $('#rules'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); return false; },
  corner() {
    openSheet('Recruit your corner', `<div class="prose small">
      <p>Every arm wrestler has people in their corner. Show this app to a parent, guardian, PE teacher or coach. Walk them through the 8 Gym Rules and your training days.</p>

  mobility() {
    openSheet('5-minute mobility', `<ol class="small" style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px">${MOBILITY.map((x) => `<li>${esc(x)}</li>`).join('')}</ol><button class="btn ghost" data-act="close">Done</button>`, 'Rest day');
    return false;
  },
  start(el) { startWorkout(el.dataset.day || nextLetter()); return false; },
  preview(el) { S.previewDay = el.dataset.day; },
  info(el) { infoSheet(el.dataset.ex); return false; },
  water(el) {
    const k = el.dataset.k || todayKey();
    updDay(k, (d) => { d.wa = clamp((d.wa || 0) + Number(el.dataset.d), 0, 20); if (!d.wa) delete d.wa; });
  },
  sleep(el) {
    const k = el.dataset.k || todayKey();
    // first tap starts from a typical night instead of 0
    updDay(k, (d) => { d.sl = d.sl == null ? (Number(el.dataset.d) > 0 ? 8 : 7.5) : clamp(d.sl + Number(el.dataset.d), 0, 14); });
  },
  warmup() { updSession((w) => { w.wu = !w.wu; }); },
  tick(el) {
    const id = el.dataset.ex, i = Number(el.dataset.i);
    let started = false;
    updSession((w) => {
      const r = sessRx(w, id);
      const row = w.sets[id][i];
      if (row[2]) { row[2] = 0; return; }
      // pick up any typed values that have not fired a change event yet
      const wi = document.getElementById(`s-${id}-${i}-w`), ri = document.getElementById(`s-${id}-${i}-r`);
      if (wi && num(wi.value) != null) row[0] = num(wi.value);
      if (ri && num(ri.value) != null) row[1] = Math.round(num(ri.value));
      if (row[1] == null) row[1] = r.lo;
      if (hasWeight(id) && row[0] == null) row[0] = 0;
      row[2] = 1;
      // carry the weight to the next empty set
      const nxt = w.sets[id][i + 1];
      if (nxt && nxt[0] == null && hasWeight(id)) nxt[0] = row[0];
      started = true;
    });
    if (started) { ensureAudio(); startRest(EX[id].rest, id, i); }
  },
  setfeel(el) {
    const v = Number(el.dataset.v);
    const R = S.rest;
    if (!R || !R.ex) return false;
    const id = R.ex, i = R.i;
    let msg = '';
    updSession((w) => {
      w.fb = w.fb || {};
      const fb = (w.fb[id] = w.fb[id] || []);
      while (fb.length < i) fb.push(0);
      fb[i] = v;
      const rows = w.sets[id] || [];
      const row = rows[i];
      const nxt = rows.find((r, j) => j > i && !r[2]);
      if (v === 2) { msg = 'Nice. Same again.'; return; }
      if (!nxt) { msg = v === 1 ? 'Noted for next time. Last set of this one.' : 'Noted for next time. Good call stopping there.'; return; }
      if (!hasWeight(id) || !row) { msg = v === 1 ? 'Next set: lower every rep over 3 seconds.' : 'Next set: stop 2 reps earlier. Form first.'; return; }
      const cur = row[0] || 0;
      if (v === 1) {
        const up = stepUp(id, cur);
        if (up == null) msg = 'Next dumbbell is too big a jump. Slow every rep down instead.';
        else { nxt[0] = up; msg = `Next set: ${fmtW(up)}`; }
      } else {
        const dn = stepDown(id, cur);
        nxt[0] = dn;
        msg = dn < cur ? `Next set: ${fmtW(dn)}` : 'Lightest one already. Next set: fewer reps, clean form.';
      }
    });
    const fbEl = $('#rest-fb');
    if (fbEl) fbEl.innerHTML = `<span class="msg">${esc(msg)}</span>`;
  },
  'goto-coach'() { go('coach'); return false; },
  gearkind(el) { const g = gearNow(); g.kind = el.dataset.k === 'adj' ? 'adj' : 'fixed'; Store.put('gear', g); },
  gearw(el) {
    const x = Number(el.dataset.w);
    const g = gearNow();
    const i = g.w.findIndex((v) => Math.abs(v - x) < 0.01);
    if (i >= 0) g.w.splice(i, 1); else g.w.push(x);
    g.w.sort((a, b) => a - b);
    Store.put('gear', g);
  },
  'c-time'(el) { S.coach.time = Number(el.dataset.v); },
  'c-focus'(el) { S.coach.focus = FOCI[el.dataset.v] ? el.dataset.v : 'arm'; },
  'c-energy'(el) { S.coach.energy = Number(el.dataset.v); },
  'c-sore'(el) {
    const a = el.dataset.v;
    const s = S.coach.sore;
    const i = s.indexOf(a);
    if (i >= 0) s.splice(i, 1); else if (SORE.includes(a)) s.push(a);
  },
  build() { buildWorkout(); return false; },
  'build-stop'() { if (S.coach.ctl) S.coach.ctl.abort(); return false; },
  'plan-start'() { if (S.coach.draft) startPlan(S.coach.draft); return false; },
  ask(el) { sendChat(el.dataset.q || ''); return false; },
  'chat-clear'() { if (S.chatCtl) S.chatCtl.abort(); S.chat = []; saveChat(); },
  'coach-chat'() {
    openSheet('Ask Coach', chatBlock(), 'AI');
    const log = $('#chat-log'); if (log) log.scrollTop = log.scrollHeight;
    return false;
  },
  addset(el) {
    const id = el.dataset.ex;
    updSession((w) => { const rows = w.sets[id] || (w.sets[id] = []); if (rows.length >= 6) return; const last = rows[rows.length - 1]; rows.push([last ? last[0] : null, null, 0]); });
  },
  pain(el) { painSheet(el.dataset.ex); return false; },
  'skip-pain'(el) { const id = el.dataset.ex; updSession((w) => { w.sk = w.sk || {}; w.sk[id] = 'pain'; }); closeSheet(); toast('Skipped. Smart move. Tell a parent if it sticks around.'); },
  unskip(el) { const id = el.dataset.ex; updSession((w) => { if (w.sk) delete w.sk[id]; }); },
  'rest-add'() { if (S.rest) { S.rest.end += 15000; S.rest.total += 15; tickRest(); } return false; },
  'rest-skip'() { S.rest = null; tickRest(); return false; },
  finish() {
    const o = openSession();

      openSheet('Nothing logged yet', `<p class="small">Tap the check box on at least one set before finishing. Or cancel the workout if today is not the day.</p><button class="btn ghost" data-act="close">Back to it</button>`);
      return false;
    }
    openSheet('How did that feel?', `<p class="small muted">Be honest. It helps the app pick your weights next time.</p>
      <div class="feel">
        <button data-act="feel" data-v="1"><b>Easy</b><span>Could have done way more</span></button>
        <button data-act="feel" data-v="2"><b>Just right</b><span>Hard but clean</span></button>
        <button data-act="feel" data-v="3"><b>Too hard</b><span>Form got shaky</span></button>
      </div>`, 'Finish workout');
    return false;
  },
  feel(el) {
    const v = Number(el.dataset.v);
    const o = openSession();
    if (!o) return;
    const closer = o.w.ai && o.w.ai.closer;
    updDay(o.k, (d) => { d.w.done = true; d.w.feel = v; d.w.end = Date.now(); });
    S.rest = null; tickRest();

    openSheet(phaseUp ? `Phase ${phaseFor(n)} unlocked` : 'W workout', `
      <p>${phaseUp ? `Workout #${n} done. You graduated to <b>${esc(PHASES[phaseFor(n) - 1].name)}</b>. More sets start next session.` : `Workout #${n} done. Aura +100.`}</p>
      ${closer ? `<p class="coach-cue"><b>Coach</b> ${esc(closer)}</p>` : ''}
      <p class="small muted">Next up: Day ${nextLetter()}, ${esc(nxt.name)}. Do the cool-down stretches, then eat something with protein in the next couple of hours.</p>
      <a class="btn" href="#fuel" data-act="close-go" data-to="fuel">Log your food</a>
      <button class="btn ghost" data-act="close-go" data-to="today">Back to Today</button>`, 'Finished');
  },

    return false;
  },
  'cancel-yes'() {
    const o = openSession();
    if (o) updDay(o.k, (d) => { delete d.w; });
    S.rest = null; tickRest(); holdWake(false); closeSheet();
  },
  fueldate(el) {
    const t = todayKey();
    const cur = S.fuelDate && S.fuelDate <= t ? S.fuelDate : t;
    const nk = addDays(cur, Number(el.dataset.d));
    S.fuelDate = nk > t ? t : nk;
  },
  addfood(el) {
    const f = FOODS[Number(el.dataset.i)];
    const k = el.dataset.k || todayKey();
    updDay(k, (d) => { d.p = d.p || []; if (d.p.length < 60) d.p.push([f[0], f[1]]); });
  },
  rmfood(el) {
    const k = el.dataset.k, i = Number(el.dataset.i);
    updDay(k, (d) => { if (d.p) { d.p.splice(i, 1); if (!d.p.length) delete d.p; } });
  },
  breakfast(el) { updDay(el.dataset.k, (d) => { d.pl = d.pl || {}; d.pl.b = !d.pl.b; if (!d.pl.b) delete d.pl.b; if (!Object.keys(d.pl).length) delete d.pl; }); },
  plate(el) {
    const f = el.dataset.f;
    updDay(el.dataset.k, (d) => { d.pl = d.pl || {}; d.pl[f] = clamp((d.pl[f] || 0) + Number(el.dataset.d), 0, 15); if (!d.pl[f]) delete d.pl[f]; if (!Object.keys(d.pl).length) delete d.pl; });
  },

    if (i >= 0) days.splice(i, 1);
    else { if (days.length >= 3) { toast('3 days max. Unpick one first.'); return false; } days.push(wd); }
    el.setAttribute('aria-pressed', String(days.includes(wd)));
    const note = $('#pf-daynote'); if (note) note.textContent = dayNote(days);
    return false;
  },
  reset1() {
    const row = $('#reset-row');
    if (row) row.innerHTML = `<button class="btn sm" data-act="reset2">Yes, delete everything</button><button class="btn ghost sm" data-act="reset0">Keep my data</button>`;
    return false;
  },
  reset0() { const row = $('#reset-row'); if (row) row.innerHTML = `<button class="btn ghost sm" data-act="reset1">Reset everything</button>`; return false; },
  reset2() {
    for (const id of Object.keys(Store.docs)) Store.put(id, undefined);
    S.rest = null; tickRest(); closeSheet();
    toast('Fresh start. Let\'s go.');
  },
};

const FORMS = {
  profile(f) {
    const fd = new FormData(f);
    const name = String(fd.get('name') || '').trim().slice(0, 20);
    const age = clamp(Math.round(num(fd.get('age')) || 13), 8, 25);
    const unit = S.draftUnit || 'kg';
    const bwIn = num(fd.get('bw'));
    const bwKg = bwIn == null ? null : unit === 'kg' ? bwIn : bwIn * KG_PER_LB;
    const days = (S.draftDays || [1, 3, 5]).slice().sort((a, b) => a - b);
    if (days.length < 2) { toast('Pick at least 2 training days.'); return; }
    if (bwKg != null && (bwKg < 20 || bwKg > 200)) { toast('That body weight looks off. Check the units.'); return; }
    Store.put('profile', Object.assign({}, Store.docs.profile || {}, { name, age, unit, bwKg: bwKg == null ? null : round1(bwKg), days }));
    closeSheet();
  },
  customfood(f) {
    const fd = new FormData(f);
    const name = String(fd.get('name') || '').trim().slice(0, 40) || 'Food';
    const g = num(fd.get('g'));
    if (g == null || g < 0 || g > 150) { toast('Enter the protein grams (0–150).'); return; }
    updDay(f.dataset.k || todayKey(), (d) => { d.p = d.p || []; if (d.p.length < 60) d.p.push([name, Math.round(g)]); });
  },
  chat(f) {
    if (S.chatBusy) { if (S.chatCtl) S.chatCtl.abort(); return false; }
    const inp = f.querySelector('input[name="q"]');
    const q = ((inp && inp.value) || '').trim();
    if (!q) return false;
    inp.value = '';
    sendChat(q.slice(0, 500));
    return false;
  },
  'gear-add'(f) {
    const x = num(new FormData(f).get('w'));
    const maxW = unitW() === 'kg' ? 100 : 220;
    if (x == null || x <= 0 || x > maxW) { toast(`Enter a weight between 0 and ${maxW} ${unitW()}.`); return false; }
    const g = gearNow();
    g.kind = 'fixed';
    if (!g.w.some((v) => Math.abs(v - x) < 0.01)) g.w.push(round1(x));
    g.w.sort((a, b) => a - b);
    Store.put('gear', g);
  },
  'gear-adj'(f) {
    const fd = new FormData(f);
    const mn = num(fd.get('min')), mx = num(fd.get('max')), st = num(fd.get('step'));
    if (mn == null || mx == null || st == null || mn <= 0 || mx <= mn || st <= 0) { toast('Lightest must be above 0, heaviest above lightest, and steps above 0.'); return false; }
    if ((mx - mn) / st > 100) { toast('That is a lot of steps. Use a bigger step size.'); return false; }
    const g = gearNow();
    Object.assign(g, { kind: 'adj', min: round1(mn), max: round1(mx), step: round1(st) });
    Store.put('gear', g);
  },
  checkin(f) {
    const fd = new FormData(f);
    const bw = num(fd.get('bw')), h = num(fd.get('h')), fa = num(fd.get('fa'));
    if (bw == null && h == null && fa == null) { toast('Fill in at least one box.'); return; }
    const metric = unitW() === 'kg';
    const ck = {};
    if (bw != null) ck.bw = round1(metric ? bw : bw * KG_PER_LB);
    if (h != null) ck.h = round1(metric ? h : h * 2.54);
    if (fa != null) ck.fa = round1(metric ? fa : fa * 2.54);
    if (ck.bw != null && (ck.bw < 20 || ck.bw > 200)) { toast('That weight looks off. Check the units.'); return; }
    if (ck.h != null && (ck.h < 100 || ck.h > 230)) { toast('That height looks off. Check the units.'); return; }
    if (ck.fa != null && (ck.fa < 10 || ck.fa > 60)) { toast('That forearm number looks off. Measure the thickest part.'); return; }
    updDay(todayKey(), (d) => { d.ck = ck; });
    if (ck.bw != null && hasProfile()) Store.put('profile', Object.assign({}, Store.docs.profile, { bwKg: ck.bw }));
  },
};

const CHANGES = {
  setw(el) {
    const id = el.dataset.ex, i = Number(el.dataset.i);
    const v = num(el.value);
    updSession((w) => { const row = w.sets[id] && w.sets[id][i]; if (row) row[0] = v == null ? null : clamp(v, 0, 500); });
    return false;
  },
  setr(el) {
    const id = el.dataset.ex, i = Number(el.dataset.i);
    const v = num(el.value);
    updSession((w) => { const row = w.sets[id] && w.sets[id][i]; if (row) row[1] = v == null ? null : clamp(Math.round(v), 0, 999); });
    return false;
  },
  chartex(el) { S.chartEx = el.value; },
  bodymetric(el) { S.bodyMetric = el.value; },
};

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'BUTTON' && el.type !== 'submit') ev.preventDefault();
  const res = withXp(() => fn(el, ev));
  if (res !== false) render();
});
document.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-chg]');
  if (!el) return;
  const fn = CHANGES[el.dataset.chg];
  if (!fn) return;
  const res = fn(el, ev);
  if (res !== false) render();
});
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  const fn = FORMS[f.dataset.form];
  if (!fn) return;
  const res = withXp(() => fn(f));
  if (res !== false) render();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && $('#sheet-root').firstChild) closeSheet();
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.fld input')) ev.target.blur();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (S.view === 'train' && openSession()) holdWake(true); render(); }
});
window.addEventListener('hashchange', route);

/* =========================================================
   Boot
   ========================================================= */
async function initAI() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.ai = 'off'; return; }
  try { SAMPLE = await c.use('sample'); } catch (e) { SAMPLE = null; }
  S.ai = SAMPLE ? 'ready' : 'off';
  if (S.view === 'coach' || (S.view === 'train' && openSession())) render();
}

Store.docs = Store.readLocal(LOCAL_KEY) || {};
S.chat = loadChat();
setSync('device');
route();
initCloud();
initAI();
})();
</script>

          <h2 class="t-display-xl code__title" id="code-title">In code</h2>
          <p class="t-body code__intro">On the Claude Platform, developers can get started with <span class="code__nowrap">claude-haiku-5-5</span>. This request streams the reply and sets effort to low.</p>
        </div>
        <div class="code__panel">
          <p class="sr-only" id="code-sr">Short TypeScript program that streams a reply from Claude Haiku 5.5 with effort set to low, and an example of that reply.</p>
          <div class="code__request">
            <p class="t-label code__label" id="code-request-label">REQUEST</p>
            <figure class="code__figure" aria-labelledby="code-request-label" aria-describedby="code-sr"><pre class="t-code code__pre" tabindex="0" role="region" aria-labelledby="code-request-label"><code class="code__code code__code--request"><span class="code__line"><span class="tok-kw">import</span> Anthropic <span class="tok-kw">from</span> <span class="tok-str">"@anthropic-ai/sdk"</span><span class="tok-pun">;</span></span>
<span class="code__line"><span class="tok-kw">const</span> client <span class="tok-pun">=</span> <span class="tok-kw">new</span> Anthropic<span class="tok-pun">();</span></span>
<span class="code__line"><span class="tok-kw">const</span> ticket <span class="tok-pun">=</span> <span class="tok-str">"Charged twice for one seat."</span><span class="tok-pun">;</span></span>
<span class="code__line"></span>
<span class="code__line"><span class="tok-kw">await</span> client<span class="tok-pun">.</span>messages</span>
<span class="code__line">  <span class="tok-pun">.</span>stream<span class="tok-pun">({</span></span>
<span class="code__line">    model<span class="tok-pun">:</span> <span class="tok-str">"claude-haiku-5-5"</span><span class="tok-pun">,</span> max_tokens<span class="tok-pun">:</span> 1024<span class="tok-pun">,</span></span>
<span class="code__line">    output_config<span class="tok-pun">: {</span> effort<span class="tok-pun">:</span> <span class="tok-str">"low"</span> <span class="tok-pun">},</span></span>
<span class="code__line">    messages<span class="tok-pun">: [{</span> role<span class="tok-pun">:</span> <span class="tok-str">"user"</span><span class="tok-pun">,</span> content<span class="tok-pun">:</span> ticket <span class="tok-pun">}],</span></span>
<span class="code__line">  <span class="tok-pun">})</span></span>
<span class="code__line">  <span class="tok-pun">.</span>on<span class="tok-pun">(</span><span class="tok-str">"text"</span><span class="tok-pun">,</span> <span class="tok-pun">(</span>t<span class="tok-pun">)</span> <span class="tok-pun">=&gt;</span> process<span class="tok-pun">.</span>stdout<span class="tok-pun">.</span>write<span class="tok-pun">(</span>t<span class="tok-pun">));</span></span></code></pre></figure>

<span class="code__line">Refund the second charge.</span>
<span class="code__line">Bill the seat once from now on.</span></code></pre></figure>

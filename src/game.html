<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Clawd vs Bugs</title>
<style>
:root{--o:#D97757;--o1:#ef916f;--o2:#a34f33;--ink:#fff4ea;--bg:#120d0a;--pan:#2a201a;--pan2:#3b2d24;--gold:#f6c54e;--line:rgba(255,255,255,.09);--good:#8fe36f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at center,#22170f 0%,#0a0705 80%);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;touch-action:none;overscroll-behavior:none}
#game{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#000;border-radius:6px;box-shadow:0 20px 80px #000c}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(40,26,18,.82),rgba(10,7,5,.94));padding:22px 40px;gap:12px;z-index:10;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scr.on{display:flex;animation:scrIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes scrIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#title{justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(20,12,8,.15),rgba(10,7,5,.7));gap:14px}
#pause,#end,#set{justify-content:center;gap:16px}
h1{margin:0;font-size:84px;letter-spacing:4px;color:var(--o);text-shadow:0 4px 0 #8a3f27,0 8px 0 #4a2014,0 14px 30px #000a;text-align:center;line-height:1}
h2{margin:0;font-size:32px;color:var(--o);text-shadow:0 3px 0 #4a2014}
h3{margin:0;font-size:22px;text-align:center}
h4{margin:0 0 4px;color:var(--o);font-size:17px}
p{margin:2px 0;font-size:13px;line-height:1.35}
.btn{font:inherit;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(180deg,var(--o1),var(--o) 55%,#c4603f);border:2px solid #ffffff30;border-radius:14px;padding:11px 22px;box-shadow:0 6px 0 var(--o2),0 10px 18px #0007,inset 0 2px 0 #ffffff40;cursor:pointer;text-shadow:0 2px 0 #0005;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--o2),0 4px 8px #0007,inset 0 2px 0 #ffffff40}
.btn.alt{background:linear-gradient(180deg,#5b4738,#45362b);box-shadow:0 6px 0 #241a14,0 10px 18px #0007,inset 0 2px 0 #ffffff1c}
.btn.big{font-size:32px;padding:14px 44px;border-radius:18px}
.btn:disabled{opacity:.4;cursor:default;transform:none;filter:none}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:360px}
.muted{opacity:.72}.small{font-size:14px}
.tag{font-size:22px;opacity:.92;text-shadow:0 2px 6px #000}
.logo{width:230px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 14px 10px #0008)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.hdr{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-right:150px}
.coins{font-size:22px;font-weight:800;color:var(--gold);text-shadow:0 2px 0 #0008}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:linear-gradient(180deg,#5b4738,#45362b);border:2px solid #ffffff18;border-radius:12px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 #241a14}
.tab.on{background:linear-gradient(180deg,var(--o1),var(--o));box-shadow:0 4px 0 var(--o2)}.tab:disabled{opacity:.45}
.path{position:relative;width:1180px;height:370px;border-radius:22px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 4px #0006,inset 0 -40px 60px #0005,0 10px 30px #0008}
.wname{position:absolute;right:20px;bottom:12px;font-size:28px;font-weight:900;opacity:.45;text-shadow:0 2px 0 #0008}
.node{position:absolute;width:122px;height:122px;border-radius:50%;border:5px solid #00000070;font:inherit;font-weight:900;font-size:26px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 #000a,inset 0 6px 0 #ffffff40,inset 0 -10px 18px #0006;text-shadow:2px 2px 0 #0009;transition:transform .12s}
.node:hover{transform:scale(1.06)}
.node .ty{font-size:12px;opacity:.95}.node .st{font-size:17px;color:var(--gold)}
.node.lock{filter:grayscale(1) brightness(.45);cursor:default}
.node.cur{animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.09);box-shadow:0 8px 0 #000a,inset 0 6px 0 #ffffff40,0 0 34px #ffd27a}}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:100%;flex:1;min-height:0;align-content:start;padding:4px}
.card{font:inherit;color:#2a1d14;background:linear-gradient(180deg,#f9ebcd,#dcc39a);border:3px solid #6b4a2f;border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;gap:1px;box-shadow:0 4px 0 #3b2a1c;transition:transform .1s}
.card:hover{transform:translateY(-3px)}
.card img{width:80px;height:69px}.card b{font-size:12px;text-align:center;line-height:1.1}.card span{font-size:13px;font-weight:800}
.card.on{opacity:.3}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:78px;height:92px;border:3px dashed #ffffff40;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0003;font:inherit;color:var(--ink);padding:0}
.slot.f{border:3px solid var(--o);background:linear-gradient(180deg,#f9ebcd,#dcc39a);color:#2a1d14;cursor:pointer;font-weight:800;font-size:12px;box-shadow:0 4px 0 #3b2a1c}
.slot img{width:66px;height:57px}
.bugs img{width:56px;height:48px}
.bugp{display:flex;flex-direction:column;align-items:center;font-size:11px;width:76px;text-align:center}
.alm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;flex:1;min-height:0;align-content:start}
.ai{display:flex;gap:10px;background:linear-gradient(180deg,#45352a,#33271f);border:1px solid var(--line);border-radius:14px;padding:8px;align-items:flex-start}
.ai img{width:96px;height:83px;flex:none;background:#0004;border-radius:10px}
.ai.lk img{filter:brightness(0) opacity(.55)}
.bo{color:var(--good)}
.shopg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.si{background:linear-gradient(180deg,#45352a,#33271f);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 20px #0006}
.si .btn{margin-top:auto;font-size:18px}
.stars{font-size:64px;color:var(--gold);letter-spacing:8px;text-shadow:0 4px 0 #8a5a10,0 8px 20px #000}
.stars span{display:inline-block;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.unl{display:flex;gap:14px;align-items:center;background:linear-gradient(180deg,#45352a,#33271f);border:2px solid var(--gold);border-radius:16px;padding:12px 18px;max-width:760px;box-shadow:0 0 30px #f6c54e40}
.unl img{width:110px;height:95px}
.panel{background:linear-gradient(180deg,#3a2b22,#2a1f19);border:2px solid #5a4030;border-radius:20px;padding:22px 28px;box-shadow:0 14px 40px #000a,inset 0 1px 0 #ffffff14;display:flex;flex-direction:column;gap:16px;min-width:460px}
.sl{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700}
.sl label{width:150px}
.sl input[type=range]{flex:1;accent-color:var(--o);height:28px}
.sl input[type=checkbox]{width:26px;height:26px;accent-color:var(--o)}
#ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:30}
.ib{width:44px;height:44px;border-radius:12px;border:2px solid #ffffff22;background:linear-gradient(180deg,#3a2b22,#21180f);color:#fff;font:800 17px ui-monospace,Menlo,monospace;cursor:pointer;box-shadow:0 4px 0 #000,0 6px 12px #0008;padding:0}
.ib:active{transform:translateY(2px)}
#toast{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);background:rgba(20,14,10,.95);border:2px solid var(--o);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.on{opacity:1}
#rot{position:fixed;left:0;right:0;top:0;padding:8px;text-align:center;background:var(--o);color:#fff;font-weight:800;font-size:14px;display:none;z-index:50}
@media (orientation:portrait) and (max-width:820px){#rot{display:block}}
</style>
</head>

    <button class="ib" id="bG" data-a="set" title="Settings">⚙</button>

  <div id="map" class="scr"></div>
  <div id="choose" class="scr"></div>

  <div id="alma" class="scr"></div>
  <div id="pause" class="scr"></div>
  <div id="end" class="scr"></div>

</div>

<script>
'use strict';
/* ================= constants & utils ================= */
const W=1280,H=720,ROWS=5,COLS=9,TW=96,TH=104,GX=232,GY=160,LX=GX+COLS*TW,LB=GY+ROWS*TH;
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const cxOf=c=>GX+c*TW+TW/2,cyOf=r=>GY+r*TH+TH/2;
const srand=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
let SC=1,BS=1;

/* ================= save ================= */
const SKEY='clawd-vs-bugs/save/v1';
const DEF={v:1,lvl:0,stars:{},units:['token','shooter'],coins:0,shop:{slots:0,start:0,dmg:0,auto:0,boost:0},zap:2,best:0,seen:{},last:[],vm:.7,vs:.9,shk:1};
const clone=o=>JSON.parse(JSON.stringify(o));
function load(){let s=clone(DEF);try{const j=JSON.parse(localStorage.getItem(SKEY)||'null');if(j&&j.v===1){s=Object.assign(s,j);s.shop=Object.assign(clone(DEF.shop),j.shop||{});s.stars=j.stars||{};s.seen=j.seen||{};if(j.sound===0&&j.vs==null){s.vs=0;s.vm=0}}}catch(e){}return s}
let S=load(),saveWarned=false;
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('Could not save progress on this device')}}}

/* ================= data ================= */
const U={
token:{n:'Token Clawd',cost:50,cd:7.5,hp:300,col:'#E9B44C',d:'Mints 25 tokens every 24 seconds. Plant plenty early on!',b:'Instantly mints 150 tokens.'},
shooter:{n:'Shooter Clawd',cost:100,cd:7.5,hp:300,col:'#D97757',d:'Fires code bits at bugs in its lane. 20 damage per shot.',b:'Rapid-fire barrage.'},
wall:{n:'Firewall Clawd',cost:50,cd:30,hp:4000,col:'#B5523B',d:'Tough as legacy code. Bugs have to chew through it.',b:'Full heal plus steel plating.'},

frost:{n:'Frost Clawd',cost:175,cd:7.5,hp:300,col:'#8CC8F0',d:'Shoots icy bits that slow bugs to half speed.',b:'Freezes its whole lane, then sprays ice.'},

spike:{n:'Lint Spikes',cost:100,cd:7.5,hp:300,col:'#8a8f98',d:'Pokes every bug walking over it. Bugs can\'t chew it, but giants smash it.',b:'Spikes its whole lane for 300.'},

freeze:{n:'Ctrl+C Clawd',cost:25,cd:20,hp:300,col:'#BFE6FF',d:'Freezes the first bug that touches it (and its buddies) for 10s.',b:'Freezes every bug on screen.'},
punch:{n:'Punch Clawd',cost:150,cd:7.5,hp:300,col:'#D9573F',d:'Rapid jabs at bugs right in front of or behind it.',b:'3x3 punch frenzy.'},
compiler:{n:'Compiler Clawd',cost:175,cd:7.5,hp:500,col:'#C2410C',d:'Code bits passing through get compiled into fireballs: 2x damage + splash. Thaws ice bits.',b:'Spits a stream of fireballs.'},
tri:{n:'Tri Clawd',cost:325,cd:7.5,hp:300,col:'#E58A4E',d:'Fires into its own lane and both neighbors.',b:'Three-lane barrage.'},
twin:{n:'Twin Token Clawd',cost:125,cd:30,hp:300,col:'#F2C94C',d:'Mints 50 tokens every 24 seconds.',b:'Instantly mints 250 tokens.'}
};
const B={
bug:{n:'Bug',hp:200,sp:20,c:1,w:4,col:'#5DAE4B',d:'A garden-variety bug. Slow, hungry, everywhere.'},
flag:{n:'Flag Bug',hp:200,sp:26,c:1,w:0,col:'#5DAE4B',d:'Leads huge waves, waving its flag like it just merged to main.'},
hard:{n:'Hardhat Bug',hp:200,ar:370,sp:20,c:2,w:3,col:'#5DAE4B',d:'Wears a hard hat. Takes nearly 3x the hits.'},
racer:{n:'Race Condition',hp:200,sp:40,c:2,w:2,col:'#D94F4F',d:'Fast. Shows up before you expect it.'},
moth:{n:'Moth',hp:160,sp:30,c:2,w:2,fly:1,col:'#9C7A5B',d:'The original bug. Flies over Clawds; spikes, traps, Ctrl+C and GC can\'t touch it.'},
shield:{n:'Firewall Bug',hp:200,sh:800,sp:20,c:3,w:2,col:'#4FA0A6',d:'Its firewall blocks straight shots. Lobs, spikes, punches and blasts get around it.'},

};
const SZ={garg:2.1,boss:2.7,mini:.62};
const BIG=b=>b.type==='garg'||b.type==='boss';
const WORLDS=[
{n:'Terminal Garden',g:['#86c95e','#77bb51'],skyA:'#6fbef0',skyB:'#d4f0fd',city:'#86b7d6',city2:'#5f97bd',road:'#8a7b67',hedge:'#3f8a3a',sky:1,obs:0,deco:'#f7e27a',amb:'pollen',clouds:1},
{n:'Midnight Debug',g:['#3e6075','#355367'],skyA:'#070b24',skyB:'#26315e',city:'#1c2450',city2:'#121838',road:'#3a3e55',hedge:'#1f3b48',sky:.55,obs:1,deco:'#9fd0ff',amb:'fireflies',moon:1},
{n:'Cloud Server Farm',g:['#c4d1ec','#b2c1e4'],skyA:'#6f86c9',skyB:'#d3defa',city:'#8c9fd6',city2:'#5d72ad',road:'#7e88a8',hedge:'#7d8fbf',sky:1,obs:0,deco:'#4fb8e0',amb:'data',clouds:1},
{n:'The Kernel',g:['#6d3232','#5e2a2a'],skyA:'#1c0404',skyB:'#7a2010',city:'#3a0d08',city2:'#220605',road:'#3b2020',hedge:'#4a1a12',sky:.85,obs:1,deco:'#ff7a3d',amb:'embers'},
{n:'Infinite Loop',g:['#6b4c8c','#5e427d'],skyA:'#10081f',skyB:'#4a2a70',city:'#2a1648',city2:'#180c2c',road:'#3a2c50',hedge:'#3a2560',sky:1,obs:0,deco:'#d6a8ff',amb:'sparkle',moon:1}];
const LV=[
['n',4,'bug'],['n',6,'bug hard'],['n',7,'bug hard racer'],['c',8,'bug hard racer','shooter wall mine bomb lobber'],['n',9,'bug hard racer server'],['b',10,'bug hard racer server'],
['n',8,'bug hard moth racer'],['n',9,'bug hard moth hopper'],['n',10,'bug hard moth hopper server racer'],['c',10,'bug hard moth hopper racer','frost double gc spike mine wall'],['s',8,'bug hard moth hopper server racer'],['b',12,'bug hard moth hopper server racer'],
['n',10,'bug hard shield racer moth'],['n',11,'bug hard shield fork racer'],['n',12,'bug hard shield fork hopper server moth'],['c',12,'bug shield fork hopper racer server','laser freeze punch compiler shooter wall'],['s',10,'bug hard shield fork hopper server'],['b',13,'bug hard shield fork hopper server moth racer'],
['n',12,'bug hard shield fork hopper server moth racer'],['n',13,'bug hard shield fork hopper server moth racer garg'],['n',14,'hard shield fork hopper server moth racer garg'],['c',14,'hard shield fork hopper server moth racer garg','tri double laser wall bomb freeze compiler frost'],['s',12,'bug hard shield fork hopper server moth racer'],['b',15,'hard shield fork hopper server moth racer garg']];
const LT={n:['Normal','Squash every bug before it reaches your repo.'],c:['Conveyor','Clawds roll in on a belt. No tokens needed!'],s:['Last Stand','No falling tokens. Build your defense with a big budget, then press SHIP IT.'],b:['Boss','A Segfault giant leads the final wave!']};
const UNLOCK=['wall','mine','lobber','bomb','frost','double','gc','spike','laser','freeze','punch','compiler','tri','twin'];
const TIPS={0:'Tap falling ✻ tokens to collect them. Plant Token Clawds for income, Shooter Clawds to fight!',1:'Glowing bugs drop ⚡ BOOSTS. Tap the boost card, then a Clawd, to supercharge it!',3:'Conveyor level: Clawds arrive on the belt for free. Use them fast!',5:'Boss level! The Segfault smashes anything in its way. Traps and rm -rf help.',6:'Night shift: fewer tokens fall and legacy code blocks your shots. Moths fly over Clawds!',10:'Last Stand: spend your budget wisely, then hit SHIP IT.',12:'Firewall Bugs block straight shots. Lob over them!',13:'Fork Bombs split in two when squashed. GC Clawds delete them cleanly.',23:'Final level. The Kernel Panic is coming. Good luck!'};
const SHOP=[
{k:'slots',n:'Extra Seed Slot',d:'Bring one more Clawd into every battle.',max:3,p:l=>[500,1000,2000][l]},
{k:'start',n:'Head Start',d:'+25 starting tokens every level.',max:4,p:l=>200*(l+1)},
{k:'dmg',n:'Sharper Claws',d:'+10% damage for every Clawd.',max:3,p:l=>[400,800,1600][l]},

/* ================= assets / audio ================= */
const ASSETS=window.__ASSETS||{sfx:{},music:{},sprites:{}};
const SPR={};for(const k in (ASSETS.sprites||{})){const im=new Image();im.src=ASSETS.sprites[k];SPR[k]=im}
const spr=k=>{const im=SPR[k];return im&&im.complete&&im.naturalWidth?im:null};
let AC=null,MASTER=null,SFXG=null,MUSG=null,NB=null;const BUF={};
function b64buf(d){const s=atob(d.slice(d.indexOf(',')+1)),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function audioInit(){
  if(!AC){

  if(b.st==='smash'){b.smT-=dt*f;if(b.smT<=0){const p=g.grid[b.r*COLS+b.tc];if(p){removePlant(p,true);burst(p.x,p.y+30,'#7a5a3a',16,240);smoke(p.x,p.y+30,6);ring(p.x,p.y+34,70,'#fff4ea',6,.35);decal(p.x,p.y+34,30,'rgba(40,25,15,.5)','scorch');shake(.45);g.hs=Math.max(g.hs,.05)}sfx('smash');b.st='walk'}return}
  b.eat=0;
  if(!b.fly){
    const c=Math.floor((b.x-(b.sz>1.5?28*b.sz:8*b.sz)-GX)/TW);
    if(c>=0&&c<COLS){
      const p=g.grid[b.r*COLS+c];

        if(p.type==='mine'&&!(p.arm>0)){mineBoom(p);if(b.dead)return}
        else if(p.type==='freeze'){freezeTrap(p);return}
        else if(BIG(b)){b.st='smash';b.smT=1;b.tc=c;return}
        else if(p.type!=='spike'){
          if(b.type==='hopper'&&!b.jumped){b.st='jump';b.tt=0;b.fx=b.x;sfx('jump');return}
          b.eat=1;damagePlant(p,100*dt*f);sfx('chomp');if(Math.random()<dt*6)burst(p.x+20,p.y+10,U[p.type].col,1,80,.3);return}
      }
    }
  }
  b.x-=b.sp*f*dt;checkHouse(b);
}

/* ---------- plants ---------- */
function firstBug(r,x){let best=null;for(const b of G.bugs)if(b.r===r&&!b.dead&&b.st!=='thrown'&&b.x>x-10&&b.x<W-10&&(!best||b.x<best.x))best=b;return best}
function shoot(p,r,k,dmg,big){G.projs.push({x:p.x+30,y:p.y-12,ty:cyOf(r)-12,r,k,dmg:dmg*G.dm,vx:470,big:big?1:0,last:0,tr:[]});p.rec=.12;burst(p.x+36,p.y-12,k==='ice'?'#dff6ff':'#ffd9c4',1,60,.15);sfx('shoot',1,k==='ice'?1.25:1)}
function lob(p,b,dmg){const T=.85,f=(b.frz>0||b.eat||b.st==='smash')?0:(b.slow>0?.5:1);G.projs.push({k:'lob',x:p.x,y:p.y-24,x0:p.x,y0:p.y-24,tx:b.x-b.sp*f*T,ty:b.y-6+(b.fly?-40:0),t:0,T,b,r:b.r,dmg:dmg*G.dm,tr:[]});p.la=.35;sfx('lob')}
function laserHit(p,d,k){for(const b of G.bugs)if(b.r===p.r&&!b.dead&&b.st!=='thrown'&&b.x>p.x-10&&b.x<W-10){hurt(b,d,k);if(Math.random()<.4)sparks(b.x-10,b.y-6,'#7ff0ff',2,160)}}
function updPlant(p,dt){
  p.t+=dt;p.age+=dt;for(const k of ['flash','rec','la','bite','punch','spk'])if(p[k]>0)p[k]-=dt;
  const bo=p.bt>0;if(bo){p.bt-=dt;if(Math.random()<dt*20)glows(p.x,p.y+10,'#7dff6a',1,40,60)}
  switch(p.type){
  case 'token':case 'twin':p.cd-=dt;if(p.cd<=0){p.cd=24;makeTokens(p,p.type==='twin'?2:1);p.rec=.12}break;
  case 'shooter':case 'double':case 'frost':case 'tri':{
    const k=p.type==='frost'?'ice':'norm',rows=p.type==='tri'?[p.r-1,p.r,p.r+1].filter(r=>r>=0&&r<ROWS):[p.r];
    if(bo){p.ft-=dt;if(p.ft<=0){p.ft=p.type==='double'?.09:.06;for(const r of rows)shoot(p,r,k,p.type==='double'?60:20,p.type==='double')}break}
    p.cd-=dt;if(p.sp2>0){p.sp2-=dt;if(p.sp2<=0)shoot(p,p.r,k,20)}
    if(p.cd<=0&&rows.some(r=>firstBug(r,p.x))){p.cd=1.35;for(const r of rows)shoot(p,r,k,20);if(p.type==='double')p.sp2=.16}}break;
  case 'lobber':p.cd-=dt;if(p.cd<=0){const b=firstBug(p.r,p.x);if(b){p.cd=2.8;lob(p,b,40)}}break;
  case 'laser':if(bo){laserHit(p,300*dt*G.dm,'lob');G.beams.push({x:p.x+30,y:p.y-12,t:.04,mt:.04,w:24,col:'120,240,255'})}
    else{p.cd-=dt;if(p.cd<=0&&firstBug(p.r,p.x)){p.cd=2.2;laserHit(p,40*G.dm,'straight');G.beams.push({x:p.x+30,y:p.y-12,t:.25,mt:.25,w:10,col:'80,230,255'});flash(p.x+40,p.y-12,30,'#bff6ff');p.rec=.12;sfx('laser')}}break;
  case 'gc':if(p.chew>0){p.chew-=dt;break}
    for(const b of G.bugs)if(b.r===p.r&&!b.dead&&!b.fly&&b.st!=='thrown'&&b.x>p.x-30&&b.x<p.x+140){p.bite=.3;if(BIG(b)){hurt(b,40,'explode');p.chew=1;sfx('chomp')}else{killBug(b,true);p.chew=15;burst(p.x+40,p.y,B[b.type].col,6,140);sfx('gulp');G.texts.push({x:p.x,y:p.y-40,s:'free()',l:1,ml:1,c:'#e9d8ff'})}break}break;
  case 'mine':if(p.arm>0){p.arm-=dt;if(p.arm<=0){burst(p.x,p.y+30,'#7a5a3a',8,120);ring(p.x,p.y+20,30,'#ff4b40',3,.3);sfx('arm')}}break;
  case 'bomb':p.fuse-=dt;if(Math.random()<dt*30)sparks(p.x+10,p.y-30,'#ffd23f',1,120);if(p.fuse<=0)bombBoom(p);break;
  case 'spike':p.cd-=dt;if(p.cd<=0){let hit=0;for(const b of G.bugs)if(b.r===p.r&&!b.dead&&!b.fly&&b.st!=='thrown'&&Math.abs(b.x-p.x)<TW*.55){hurt(b,20*G.dm,'lob');hit=1}if(hit){p.cd=1;p.spk=.25;sparks(p.x,p.y+28,'#ffffff',3,120)}else p.cd=.2}break;
  case 'punch':p.cd-=dt;
    if(bo){if(p.cd<=0){p.cd=.12;p.pa=!p.pa;p.punch=.1;for(const b of G.bugs)if(!b.dead&&Math.abs(b.r-p.r)<=1&&Math.abs(b.x-p.x)<TW*1.5){hurt(b,60*G.dm,'lob');fxHit(b.x-10,b.y,'#ffd23f')}sfx('punch')}}
    else if(p.cd<=0){let tb=null;for(const b of G.bugs)if(b.r===p.r&&!b.dead&&b.st!=='thrown'&&Math.abs(b.x-p.x)<118&&(!tb||Math.abs(b.x-p.x)<Math.abs(tb.x-p.x)))tb=b;
      if(tb){hurt(tb,18*G.dm,'lob');p.cd=.3;p.pa=tb.x>p.x?1:0;p.punch=.12;fxHit(tb.x+(tb.x>p.x?-14:14),tb.y,'#ffd23f');sfx('punch')}else p.cd=.1}break;
  case 'compiler':if(bo){p.ft-=dt;if(p.ft<=0){p.ft=.12;G.projs.push({x:p.x+30,y:p.y-12,ty:p.y-12,r:p.r,k:'fire',dmg:60*G.dm,vx:520,big:1,last:p.id,tr:[]});sfx('fire')}}break;

function applyBoost(p){

  case 'lobber':for(const b of g.bugs)if(!b.dead&&b.st!=='thrown'&&b.x<W-10)lob(p,b,80);break;

  case 'gc':{const t=g.bugs.filter(b=>b.r===p.r&&!b.dead&&!b.fly&&!BIG(b)&&b.st!=='thrown'&&b.x>p.x-30&&b.x<p.x+TW*3.5).sort((a,b)=>a.x-b.x).slice(0,3);for(const b of t){killBug(b,true);burst(b.x,b.y,B[b.type].col,6,140)}p.chew=0;p.bite=.4;sfx('gulp')}break;
  case 'spike':for(const b of g.bugs)if(b.r===p.r&&!b.dead&&!b.fly)hurt(b,300*g.dm,'lob');p.spk=.6;for(let k=p.c;k<COLS;k++){burst(cxOf(k),cyOf(p.r)+30,'#d0d4da',4,120);sparks(cxOf(k),cyOf(p.r)+30,'#ffffff',2,160)}break;
  case 'punch':p.bt=2.2;p.cd=0;break;

  }
  return true;
}

/* ---------- projectiles ---------- */
function updProj(q,dt){
  const g=G;q.tr.push(q.x,q.y);if(q.tr.length>12)q.tr.splice(0,2);
  if(q.k==='lob'){q.t+=dt;const u=q.t/q.T;q.x=q.x0+(q.tx-q.x0)*u;q.y=q.y0+(q.ty-q.y0)*u-Math.sin(Math.PI*Math.min(u,1))*140;
    if(u>=1){q.dead=1;let b=q.b;if(!b||b.dead||b.r!==q.r||Math.abs(b.x-q.tx)>80){b=null;let bd=70;for(const o of g.bugs)if(o.r===q.r&&!o.dead&&o.st!=='thrown'&&Math.abs(o.x-q.tx)<bd){bd=Math.abs(o.x-q.tx);b=o}}
      if(b)hurt(b,q.dmg,'lob');burst(q.x,q.y,'#f6c54e',6,120);ring(q.x,q.y,24,'#f6c54e',3,.2)}return}
  q.x+=q.vx*dt;if(q.y!==q.ty)q.y+=(q.ty-q.y)*Math.min(1,dt*10);
  if(q.k==='fire'&&Math.random()<dt*30)G.parts.push({k:'glow',x:q.x-8,y:q.y+rnd(-4,4),vx:-40,vy:rnd(-30,-10),l:.3,ml:.3,c:'#ff8a1f',r:7});
  if(q.x>W+30){q.dead=1;return}
  const c=Math.floor((q.x-GX)/TW);
  if(c>=0&&c<COLS){const p=g.grid[q.r*COLS+c];if(p&&p.type==='compiler'&&q.last!==p.id&&q.x>=p.x-6){q.last=p.id;if(q.k==='norm'){q.k='fire';q.dmg*=2;glows(q.x,q.y,'#ff8a1f',3,60);sfx('fire',.6)}else if(q.k==='ice')q.k='norm'}}
  for(const o of g.obs)if(o.r===q.r&&Math.abs(o.x-q.x)<22){q.dead=1;o.hp-=q.dmg;o.flash=.08;fxHit(q.x,q.y,'#c9d1e0');sfx('hitwall');if(o.hp<=0){burst(o.x,o.y,'#9aa3b5',16,200);smoke(o.x,o.y,5);g.obs=g.obs.filter(z=>z!==o)}return}
  let hit=null;
  for(const b of g.bugs){if(b.r!==q.r||b.dead||b.st==='thrown'||b.x>W-10)continue;const hw=18*b.sz;if(q.x>b.x-hw-6&&q.x<b.x+hw&&(!hit||b.x<hit.x))hit=b}
  if(hit){q.dead=1;const shielded=hit.sh>0;hurt(hit,q.dmg,'straight');
    if(q.k==='ice'&&!shielded&&!hit.dead)hit.slow=10;
    if(q.k==='fire'){hit.slow=0;hit.frz=0;for(const o of g.bugs)if(o!==hit&&o.r===q.r&&!o.dead&&Math.abs(o.x-hit.x)<60)hurt(o,q.dmg/3,'lob');glows(q.x,q.y,'#ff8a1f',6,120);ring(q.x,q.y,40,'#ff8a1f',5,.25)}
    else fxHit(q.x,q.y,q.k==='ice'?'#dff6ff':'#ffb48f',q.big)}
}

/* ---------- waves ---------- */
function isHuge(i){return G.end?i%10===9:(i===G.N-1||(G.N>=8&&i===Math.floor(G.N/2)-1))}
function waveBudget(i){return G.end?2+i*.8:(i===0?1:1+G.w*.4+i*(.24+.05*G.w+.03*G.l))}
function updWaves(dt){
  const g=G;if(g.wave>=g.N)return;
  if(g.annT>0){g.annT-=dt;if(g.annT<=0)spawnWave();return}
  g.waveT-=dt;g.since+=dt;
  let frac=1;if(g.wave>0){let hp=0;for(const b of g.waveBugs)if(!b.dead)hp+=b.hp+b.ar+b.sh;frac=hp/g.waveHP0}
  if(g.waveT<=0||(g.wave>0&&g.since>6&&frac<.3)){
    if(isHuge(g.wave)){g.annT=4;const fin=!g.end&&g.wave===g.N-1;if(fin)g.finalOn=1;banner('A HUGE WAVE OF BUGS','IS APPROACHING!','#ff6b5b',3.6);sfx('siren');shake(.3)}else spawnWave()}
}
function spawnWave(){
  const g=G,i=g.wave,huge=isHuge(i),fin=!g.end&&i===g.N-1;
  let bud=waveBudget(i)*(huge?1.7:1);const list=[];
  if(huge)list.push('flag');
  if(fin&&g.type==='b'){const n=[1,1,2,2][g.w];for(let k=0;k<n;k++)list.push('garg');if(g.w===3)list.push('boss');bud*=.5}
  if(g.end&&i>=14&&i%5===4)list.push('garg');
  const pool=g.pool.filter(t=>t!=='garg'||(g.end?i>=10:i>=4));
  let guard=0;
  while(bud>=1&&guard++<300){const o=pool.filter(t=>B[t].c<=bud&&B[t].w>0);if(!o.length)break;let tot=0;for(const t of o)tot+=B[t].w;let r=Math.random()*tot,t=o[0];for(const x of o){r-=B[x].w;if(r<=0){t=x;break}}list.push(t);bud-=B[t].c}
  if(!list.length)list.push(pool[0]||'bug');
  const rows=[0,1,2,3,4].sort(()=>Math.random()-.5),sp=[];
  list.forEach((t,k)=>{const r=t==='boss'?2:rows[k%5];sp.push(spawnBug(t,r,W+30+k*14+rnd(0,70)+(t==='boss'?140:0)))});
  if(g.idx!==0&&Math.random()<.6){const c=sp.filter(b=>!BIG(b));if(c.length)pick(c).glow=1}
  g.waveBugs=sp;g.waveHP0=sp.reduce((a,b)=>a+b.hp+b.ar+b.sh,0)||1;
  g.wave++;g.waveT=huge?30:24;g.since=0;
  if(i===0)sfx('swarm');
  if(fin){banner('FINAL WAVE','','#ff6b5b',2.6);sfx('finalwave');g.finalOn=1;shake(.35)}
}
function musicStage(){const g=G;if(!g||g.phase==='done'||g.phase==='lost')return;let k='first';
  if(g.end)k=(g.annT>0||(g.wave>0&&isHuge(g.wave-1)&&g.since<22))?'final':['first','midA','midB'][Math.floor(g.wave/5)%3];
  else{const f=g.wave/g.N;k=g.finalOn?'final':f>=.6?'midB':f>=.3?'midA':'first'}
  Music.play(k)}

/* ---------- pickups / mowers ---------- */
function collect(k){
  const g=G;if(k.fly||k.dead)return;k.fly=1;
  if(k.kind==='token'){g.tok+=k.val;k.tx=56;k.ty=38;g.tokB=1;sfx('token');glows(k.x,k.y,'#ffd46b',4,80)}
  else if(k.kind==='coin'){S.coins+=k.val;g.coins+=k.val;k.tx=628;k.ty=700;sfx('coin')}
  else if(k.kind==='boost'){g.boosts=Math.min(3,g.boosts+1);k.tx=931;k.ty=50;sfx('token',1,1.3)}
  else if(k.kind==='prize'){k.tx=640;k.ty=320;win()}
}
function updPicks(dt){
  for(const k of G.picks){
    if(k.fly){k.tr.push(k.x,k.y);if(k.tr.length>16)k.tr.splice(0,2);const dx=k.tx-k.x,dy=k.ty-k.y;k.x+=dx*Math.min(1,dt*9);k.y+=dy*Math.min(1,dt*9);if(Math.abs(dx)+Math.abs(dy)<14)k.dead=1;continue}
    if(k.fall){k.y+=75*dt;if(k.y>=k.gy){k.y=k.gy;k.fall=0}}
    else if(k.vy!=null){k.vy+=700*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.x=clamp(k.x,GX+10,LX-10);if(k.vy>0&&k.y>=k.gy){k.y=k.gy;k.vy=null}}
    else k.landT+=dt;
    k.life-=dt;if(k.life<=0)k.dead=1;
    if(S.shop.auto&&k.kind==='token'&&k.landT>.5)collect(k);
    if(k.kind==='prize'&&k.landT>3.5)collect(k);
  }
}
function updMowers(dt){
  for(const m of G.mowers){if(!m.on)continue;m.x+=540*dt;if(Math.random()<dt*40)smoke(m.x-20,cyOf(m.r)+30,1,'#9a9088');
    for(const b of G.bugs){if(b.r!==m.r||b.dead)continue;if(Math.abs(b.x-m.x)<30*b.sz+10){if(b.type==='boss'){hurt(b,2500,'explode');m.on=0;m.gone=1;fxBoom(m.x,cyOf(m.r),60);break}else{killBug(b);sparks(b.x,b.y,'#ffffff',6,240)}}}
    if(m.x>W+40){m.on=0;m.gone=1}}
}
function updParts(dt){
  const g=G;
  for(const p of g.parts){p.l-=dt;if(p.k==='sq'){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}else if(p.k==='spark'||p.k==='glow'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92}else if(p.k==='smoke'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*22}}
  g.parts=g.parts.filter(p=>p.l>0);for(const t of g.texts){t.l-=dt;t.y-=40*dt}g.texts=g.texts.filter(t=>t.l>0);
  for(const d of g.decals)d.l-=dt;g.decals=g.decals.filter(d=>d.l>0);
}

/* ---------- main update ---------- */
function update(dt){
  const g=G;g.t+=dt;
  if(g.tr>0)g.tr=Math.max(0,g.tr-dt*1.6);if(g.zm>0)g.zm=Math.max(0,g.zm-dt*3);if(g.tokB>0)g.tokB=Math.max(0,g.tokB-dt*4);
  if(g.tipT>0&&g.phase!=='intro')g.tipT-=dt;if(g.msg){g.msg.t-=dt;if(g.msg.t<=0)g.msg=null}if(g.ban){g.ban.t-=dt;if(g.ban.t<=0)g.ban=null}

function pauseGame(){if(state!=='play'||!G)return;state='pause';renderPause();showScr('pause');if(MUSG&&AC)ramp(MUSG.gain,S.vm*.3,.3)}
function resumeGame(){if(!G)return;state='play';showScr(null);last=performance.now();if(MUSG&&AC)ramp(MUSG.gain,S.vm*.8,.3)}
function quitToMap(){if(G&&G.end&&state!=='end'){S.best=Math.max(S.best,G.wave)}save();applyVol();G=null;showMap(mapW)}
function showEnd(win,info){
  const g=G;state='end';let h='';
  if(g.end){const wv=g.wave,nb=wv>S.best;S.best=Math.max(S.best,wv);const c=wv*15;S.coins+=c;save();
    h=`<h1 style="font-size:60px;color:#ff6b5b">GAME OVER</h1><h3>You survived ${wv} waves${nb?' · NEW BEST!':''}</h3><div class="coins">+🪙 ${c}</div><div class="row"><button class="btn big" data-a="retry">↻ Again</button><button class="btn alt" data-a="map">🗺 Map</button></div>`}
  else if(win){const lastL=g.idx===LV.length-1;
    h=`<h1 style="font-size:64px;color:#9dff8a;text-shadow:0 4px 0 #2f6a1f,0 8px 0 #183a10,0 14px 30px #000a">${lastL?'KERNEL DEBUGGED!':'LEVEL CLEAR!'}</h1><div class="stars">${[0,1,2].map(i=>`<span style="animation-delay:${.15+i*.18}s;${i<info.stars?'':'opacity:.22'}">★</span>`).join('')}</div><div class="muted small">★ clear &nbsp;·&nbsp; ★ no rollback bots used &nbsp;·&nbsp; ★ no Clawds lost</div>
    ${info.unit?`<div class="unl"><img src="${thumb('u',info.unit)}" alt=""><div><h3 style="text-align:left">New Clawd: ${U[info.unit].n}!</h3><p>${U[info.unit].d}</p></div></div>`:''}
    <div class="coins">+🪙 ${info.coins}</div>${lastL?'<h3>You beat Clawd vs Bugs! Endless mode is waiting.</h3>':''}
    <div class="row">${g.idx<LV.length-1?'<button class="btn big" data-a="next">Next ▶</button>':''}<button class="btn alt" data-a="retry">↻ Replay</button><button class="btn alt" data-a="map">🗺 Map</button></div>`}
  else h=`<h1 style="font-size:54px;color:#ff6b5b">THE BUGS SHIPPED TO PROD!</h1><h3>They got into your repo.</h3><div class="row"><button class="btn big" data-a="retry">↻ Retry</button><button class="btn alt" data-a="map">🗺 Map</button></div>`;
  $('#end').innerHTML=h;showScr('end');
}
function toggleFS(){
  const d=document,el=d.documentElement,fs=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(fs){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else{const req=el.requestFullscreen||el.webkitRequestFullscreen;
      if(req){const pr=req.call(el,{navigationUI:'hide'});if(pr&&pr.then)pr.then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>toast('Fullscreen was blocked by the browser'))}
      else toast('Fullscreen isn\'t supported here. Try "Add to Home Screen".')}
  }catch(e){toast('Fullscreen isn\'t available here')}
}
const ACT={
  play:()=>showMap(),title:()=>showTitle(),world:v=>showMap(+v),
  lvl:v=>{v=+v;if(v>S.lvl)return;if(LV[v][0]==='c')startLevel(v,[]);else showChoose(v)},
  endless:()=>{if(S.lvl>=6)showChoose(-1);else toast('Clear World 1 to unlock Endless')},
  shop:()=>showShop(),buy:k=>{const it=SHOP.find(s=>s.k===k),lv=k==='zap'?S.zap:S.shop[k];if(!it||lv>=it.max)return;const pr=it.p(lv);if(S.coins<pr)return;S.coins-=pr;if(k==='zap')S.zap++;else S.shop[k]++;save();sfx('coin');renderShop()},
  alma:()=>showAlma('u'),atab:v=>showAlma(v),
  back:()=>{if(menuFrom==='map')showMap(mapW);else if(menuFrom==='choose')showScr('choose');else showTitle()},
  set:()=>{if(state==='play')pauseGame();showSet()},
  setBack:()=>{if(setFrom==='pause'&&G){renderPause();showScr('pause')}else if(setFrom==='map')showMap(mapW);else if(setFrom==='choose')showScr('choose');else if(setFrom==='end')showScr('end');else showTitle()},
  pickU:t=>{const slots=6+S.shop.slots,i=chosen.indexOf(t);if(i>=0)chosen.splice(i,1);else if(chosen.length<slots)chosen.push(t);else toast('Lineup is full. Tap a Clawd in the lineup to remove it.');renderChoose()},
  go:()=>{if(!chosen.length)return;S.last=chosen.slice();save();startLevel(chooseIdx,chosen.slice())},
  pause:()=>pauseGame(),resume:()=>resumeGame(),
  restart:()=>{if(G){applyVol();startLevel(G.idx,G.seedList)}},
  retry:()=>{if(G)startLevel(G.idx,G.seedList)},
  next:()=>{if(!G)return;const n=G.idx+1;if(n>=LV.length){showMap();return}if(LV[n][0]==='c')startLevel(n,[]);else showChoose(n)},
  map:()=>quitToMap(),
  speed:()=>{if(G){G.spd=G.spd===1?2:1;setCtl()}},
  fs:()=>toggleFS(),
  reset:(v,el)=>{if(el.dataset.arm){try{localStorage.removeItem(SKEY)}catch(e){}S=load();applyVol();toast('Progress wiped');showMap(0)}else{el.dataset.arm='1';el.textContent='Tap again to wipe ALL progress';setTimeout(()=>{if(el.isConnected){delete el.dataset.arm;el.textContent='Reset progress'}},3000)}},
  hideRot:(v,el)=>{el.style.display='none'}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;audioInit();if(el.dataset.a!=='buy')sfx('click');const f=ACT[el.dataset.a];if(f)f(el.dataset.v,el)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.s;if(!k)return;S[k]=e.target.type==='checkbox'?(e.target.checked?1:0):+e.target.value;applyVol();if(state==='pause'&&MUSG)MUSG.gain.value=S.vm*.3;save()});

/* ================= boot ================= */
function resize(){
  const iw=window.innerWidth,ih=window.innerHeight,k=Math.min(iw/W,ih/H);
  $('#game').style.transform=`translate(${Math.round((iw-W*k)/2)}px,${Math.round((ih-H*k)/2)}px) scale(${k})`;
  const dpr=window.devicePixelRatio||1;SC=Math.min(2,Math.max(.5,k*dpr));cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);BS=Math.min(2,Math.ceil(SC*2)/2);
}
addEventListener('resize',resize);
document.addEventListener('fullscreenchange',resize);document.addEventListener('webkitfullscreenchange',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')pauseGame();save();if(AC&&AC.state==='running')AC.suspend().catch(()=>{})}else if(AC)AC.resume().catch(()=>{})});
addEventListener('pagehide',save);
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  try{if(state==='play'&&G){if(G.hs>0)G.hs-=dt;else for(let i=0;i<G.spd;i++){update(dt);if(state!=='play'||!G)break}}render(now/1000)}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
window.CVB={startLevel,update,place,get G(){return G},get S(){return S},showMap,showChoose,Music,BUF};
resize();showTitle();requestAnimationFrame(loop);
</script>
</body>
</html>

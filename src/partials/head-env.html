<script>
// head-env: sets <html> classes before first paint; src/core/env.ts reads them.
// WebGL2 is detected, never created (D13.2). `in` does not load the interface; typeof does (about 1.6 ms cold).
(function () {
  var t0 = performance.now();
  var cl = document.documentElement.classList;
  try {
    cl.remove('no-js');
    cl.add('js');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) cl.add('reduced-motion');
    if (matchMedia('(hover: none) and (pointer: coarse)').matches) cl.add('touch');
    // No WebGL2, or ?nogl (the QA switch). A context that fails later makes boot add no-gl.
    if (!('WebGL2RenderingContext' in window) || location.search.includes('nogl')) cl.add('no-gl');
  } catch (e) {
    // Nothing set: boot checks WebGL itself and adds no-gl if it fails.
  }
  try {
    performance.measure('head-env', { start: t0, end: performance.now() });
  } catch (e) {
    // No User Timing: the measure is informational only.
  }
})();
</script>

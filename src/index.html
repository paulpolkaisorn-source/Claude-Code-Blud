<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0a1a">
  <meta name="description" content="Hush — a calm ASMR playground of 2D and 3D mini games. Every sound is synthesized live. Headphones recommended.">
  <title>Hush — an ASMR playground</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23ffe3f1'/%3E%3Cstop offset='1' stop-color='%23b58cff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230d0a1a'/%3E%3Ccircle cx='32' cy='33' r='18' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <!-- First screen: needed so the browser lets us start audio. -->
  <section id="splash" class="screen">
    <div class="splash-inner">
      <div class="splash-orb" aria-hidden="true"></div>
      <h1 class="logo">hush</h1>
      <p class="tag">tiny worlds for your ears</p>
      <button id="begin" class="primary" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-1a7 7 0 0 1 14 0v1h-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z"/></svg>
        Put on headphones &amp; begin
      </button>
      <p class="fine">All sound is generated live — no audio files. Best with headphones.</p>
    </div>
  </section>

  <main id="hub" class="screen" hidden>
    <header class="hub-head">
      <div>
        <h1 class="logo small">hush</h1>
        <p class="tag">Pick a tiny world. Take your time.</p>
      </div>
      <div class="head-actions">
        <button id="btn-mute-hub" class="icon-btn" type="button" aria-label="Mute"></button>
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
        </button>
      </div>
    </header>
    <nav class="filters" aria-label="Filter games">
      <button class="chip active" data-filter="all" type="button">All</button>
      <button class="chip" data-filter="2D" type="button">2D</button>
      <button class="chip" data-filter="3D" type="button">3D</button>
    </nav>
    <div id="grid" class="grid"></div>
    <footer class="hub-foot">
      <span>Every sound is synthesized in your browser.</span>
      <span class="dot">·</span>
      <span>Press <kbd>Esc</kbd> to return here.</span>
    </footer>
  </main>

  <section id="stage" class="screen" hidden>
    <div id="game-root" class="game-root"></div>
    <div id="hud" class="hud">
      <div class="hud-top">
        <button id="btn-back" class="icon-btn pill" type="button" aria-label="Back to menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
          <span>Menu</span>
        </button>
        <div id="hud-title" class="hud-title"></div>
        <div class="hud-right">
          <div id="hud-stat" class="hud-stat"></div>
          <button id="btn-mute" class="icon-btn" type="button" aria-label="Mute"></button>
          <button id="btn-full" class="icon-btn" type="button" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
      <div class="hud-bottom">
        <div id="hud-hint" class="hud-hint"></div>
        <div id="hud-tools" class="hud-tools"></div>
      </div>
    </div>
    <div id="loading" class="loading" hidden><div class="spinner"></div></div>
  </section>

  <aside id="settings" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card">
      <h2 id="settings-title">Settings</h2>
      <label class="row">
        <span>Master volume</span>
        <input id="set-volume" type="range" min="0" max="1" step="0.01">
      </label>
      <label class="row switch-row">
        <span>Ambient music</span>
        <input id="set-ambience" type="checkbox" role="switch">
      </label>
      <label class="row switch-row">
        <span>Haptics <small>(phones)</small></span>
        <input id="set-haptics" type="checkbox" role="switch">
      </label>
      <label class="row">
        <span>Graphics</span>
        <select id="set-quality">
          <option value="auto">Auto</option>
          <option value="high">High</option>
          <option value="low">Battery saver</option>
        </select>
      </label>
      <button id="settings-close" class="primary" type="button">Done</button>
    </div>
  </aside>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">Hush needs JavaScript to run.</p></noscript>
  <script src="hush.js" defer></script>
</body>
</html>

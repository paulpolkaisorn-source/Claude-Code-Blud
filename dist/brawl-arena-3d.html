<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1440" />
  <meta name="description" content="Brawl Arena 3D — an original 3v3 cartoon hero-shooter that runs in the browser." />
  <title>Brawl Arena 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4l22 14v28L32 60 10 46V18z' fill='%23c46bff' stroke='%231a1230' stroke-width='5'/%3E%3C/svg%3E" />
  <style data-ui-css>
/* ui.css - Brawl Arena menus and HUD. Premium cartoon arcade look: chunky gradient buttons with a 3D bottom
   edge and press animation, thick dark outlines, outlined panels, pop-in entrances. Original CSS only, no images. */

.ui-root {
  --ink: #1a1230;
  --me: #4dff8a;
  --t0: #3d9bff;
  --t1: #ff4b5c;
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --outline: 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink),
    2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
  --outline-lg: 0 4px 0 var(--ink), 0 -3px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink),
    3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink),
    0 10px 18px rgba(0, 0, 0, .45);
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  color: #fff;
  font-family: "Arial Rounded MT Bold", ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  font-weight: 900;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
.ui-root *, .ui-root *::before, .ui-root *::after { box-sizing: border-box; }

/* ---------- screens ---------- */
.screen {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  overflow-x: hidden;
  overflow-y: auto;
  padding: calc(var(--sat) + 14px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .25s ease, visibility .25s ease;
  background: radial-gradient(ellipse at 50% 25%, rgba(110, 70, 190, .42), rgba(12, 7, 28, .78) 70%);
}
.screen.active { opacity: 1; visibility: visible; pointer-events: auto; }
.screen > * { margin: auto; }
.s-pause, .s-settings { background: rgba(12, 7, 28, .55); }
.s-results { background: rgba(12, 7, 28, .7); }
.anim { animation: pop .5s cubic-bezier(.2, 1.35, .4, 1) both; animation-delay: var(--d, 0s); }
.screen:not(.active) .anim { animation: none; }

/* ---------- buttons ---------- */
.btn {
  --g1: #ffe981;
  --g2: #ffa51f;
  --edge: #b35e00;
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 170px;
  min-height: 52px;
  padding: 10px 22px 12px;
  border: 3px solid var(--ink);
  border-radius: 18px;
  background: linear-gradient(180deg, var(--g1), var(--g2));
  color: #fff;
  font: inherit;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .04em;
  text-shadow: var(--outline), 0 5px 8px rgba(0, 0, 0, .35);
  box-shadow: 0 6px 0 var(--edge), 0 12px 18px rgba(0, 0, 0, .35), inset 0 2px 0 rgba(255, 255, 255, .45);
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active {
  transform: translateY(5px);
  box-shadow: 0 1px 0 var(--edge), 0 4px 8px rgba(0, 0, 0, .3), inset 0 2px 0 rgba(255, 255, 255, .45);
}
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn-t { font-size: 20px; line-height: 1.1; }
.btn-s { font-size: 13px; opacity: .92; }
.btn.big { min-width: 240px; min-height: 66px; }
.btn.big .btn-t { font-size: 24px; }
.btn-sm { min-width: 0; min-height: 40px; padding: 6px 14px 8px; border-radius: 14px; }
.btn-sm .btn-t { font-size: 15px; }
.btn-gold { --g1: #fff3a8; --g2: #ffb020; --edge: #b35e00; }
.btn-green { --g1: #b8ff6b; --g2: #22c55e; --edge: #137a3a; }
.btn-blue { --g1: #8fd8ff; --g2: #2a7bff; --edge: #1a4fb0; }
.btn-red { --g1: #ff9a9a; --g2: #ff3b4e; --edge: #a3152a; }
.btn-ghost { --g1: #5a4a8e; --g2: #2c2056; --edge: #0d0820; }

/* ---------- panels and titles ---------- */
.panel {
  position: relative;
  width: 100%;
  max-width: 100%;
  padding: 18px 18px 20px;
  border: 4px solid var(--ink);
  border-radius: 26px;
  background: linear-gradient(180deg, #3a2a6c, #1c1340);
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .1), 0 10px 0 #0a0616, 0 26px 40px rgba(0, 0, 0, .5);
}
.menu-wrap { width: min(560px, 100%); text-align: center; }
.title {
  margin: 0;
  font-size: clamp(54px, 15vw, 118px);
  font-weight: 900;
  line-height: .92;
  letter-spacing: .02em;
  animation: bob 2.6s ease-in-out infinite;
}
.title-a { display: inline-block; color: #fff1a0; text-shadow: var(--outline-lg); }
.title-b { display: inline-block; color: #7fd8ff; text-shadow: var(--outline-lg); }
.tagline { margin: 12px 0 26px; font-size: 16px; text-shadow: var(--outline); }
.menu-btns { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.mode-lbl {
  display: inline-block;
  margin-top: 2px;
  padding: 2px 12px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: rgba(0, 0, 0, .35);
  font-size: 12px;
  letter-spacing: .08em;
}

/* ---------- select ---------- */
.sel-panel { width: min(980px, 100%); }
.sel-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.sel-title { flex: 1; text-align: center; }
.sel-title h2 { margin: 0; font-size: clamp(20px, 4.4vw, 30px); letter-spacing: .04em; text-shadow: var(--outline); }
.sel-body {
  display: grid;
  gap: 14px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  grid-template-areas: "prev cards" "prev maps" "foot foot";
  align-items: stretch;
}
.preview {
  grid-area: prev;
  position: relative;
  min-height: 300px;
  overflow: hidden;
  border: 3px solid var(--ink);
  border-radius: 22px;
  background: radial-gradient(circle at 50% 30%, #6a58b8, #1d1442 72%);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .1), 0 6px 0 #0a0616;
}
.preview-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.preview-name { position: absolute; left: 14px; bottom: 10px; font-size: 26px; letter-spacing: .03em; text-shadow: var(--outline); }
.cards { grid-area: cards; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 6px 10px;
  align-items: center;
  padding: 10px;
  border: 3px solid var(--ink);
  border-radius: 18px;
  background: linear-gradient(180deg, #41307a, #251a4e);
  color: #fff;
  font: inherit;
  text-align: left;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
  box-shadow: 0 5px 0 #0a0616, inset 0 0 0 2px rgba(255, 255, 255, .08);
  transition: transform .1s ease, box-shadow .1s ease;
}
.card:hover { transform: translateY(-2px); }
.card.on { background: linear-gradient(180deg, #4b3a8c, #2c2060); box-shadow: 0 0 0 4px var(--c, #fff), 0 5px 0 #0a0616; }
.card-av {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--c, #888);
  font-size: 22px;
  text-shadow: var(--outline);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25);
}
.card-id { display: flex; flex-direction: column; min-width: 0; }
.card-name { font-size: 17px; line-height: 1.05; text-shadow: var(--outline); }
.card-role { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.card-bars { grid-column: 1 / -1; display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 6px; font-size: 10px; letter-spacing: .05em; }
.bar-t { display: block; height: 8px; overflow: hidden; border: 1px solid rgba(0, 0, 0, .5); border-radius: 6px; background: rgba(0, 0, 0, .4); }
.bar-t i { display: block; height: 100%; background: var(--c, #fff); transform-origin: left center; transform: scaleX(var(--v, 0)); }
.maps { grid-area: maps; display: flex; gap: 8px; align-items: stretch; }
.map-btn {
  flex: 1 1 0;
  min-width: 0;
  padding: 10px 6px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: linear-gradient(180deg, #4d3c86, #2a1f52);
  color: #fff;
  font: inherit;
  font-size: 14px;
  letter-spacing: .05em;
  text-transform: uppercase;
  text-shadow: var(--outline);
  box-shadow: 0 4px 0 #0a0616;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
}
.map-btn.on { background: linear-gradient(180deg, #b8ff6b, #22c55e); box-shadow: 0 4px 0 #137a3a; }
.sel-foot { grid-area: foot; display: flex; justify-content: center; }

/* ---------- matchmaking ---------- */
.mm-panel { width: min(640px, 100%); text-align: center; }
.mm-title { margin: 0; font-size: clamp(24px, 6vw, 36px); text-shadow: var(--outline); }
.mm-mode { margin: 8px auto 16px; }
.mm-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; text-align: left; }
.mm-col { display: grid; align-content: start; gap: 10px; }
.slot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 3px solid var(--ink);
  border-radius: 16px;
  background: rgba(0, 0, 0, .3);
  opacity: .5;
}
.slot.on { opacity: 1; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.slot.me { box-shadow: 0 0 0 3px var(--me); }
.slot-av { flex: none; width: 26px; height: 26px; border: 3px solid var(--ink); border-radius: 50%; background: #888; }
.slot.t0 .slot-av { background: var(--t0); }
.slot.t1 .slot-av { background: var(--t1); }
.slot-name { font-size: 16px; text-shadow: var(--outline); }
.slot:not(.on) .slot-name { opacity: .6; animation: blink 1s ease-in-out infinite; }
.mm-count { margin-top: 22px; font-size: 14px; letter-spacing: .1em; }
.mm-count b { display: block; font-size: 64px; line-height: 1; color: #ffd23f; text-shadow: var(--outline-lg); font-variant-numeric: tabular-nums; }
.mm-bar { max-width: 420px; height: 14px; margin: 14px auto 0; overflow: hidden; border: 3px solid var(--ink); border-radius: 10px; background: rgba(0, 0, 0, .4); }
.mm-fill { display: block; height: 100%; background: linear-gradient(180deg, #fff1a0, #ffa51f); transform-origin: left center; transform: scaleX(0); }

/* ---------- pause ---------- */
.pause-panel { width: min(360px, 100%); text-align: center; }
.pause-title { margin: 0 0 16px; font-size: 34px; letter-spacing: .08em; text-shadow: var(--outline); }
.pause-btns { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.pause-btns .btn { width: 100%; }

/* ---------- settings ---------- */
.set-panel { width: min(520px, 100%); }
.set-title { margin: 0 0 14px; font-size: 30px; letter-spacing: .06em; text-align: center; text-shadow: var(--outline); }
.set-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 52px; align-items: center; gap: 12px; margin: 14px 0; }
.set-q { grid-template-columns: 96px minmax(0, 1fr); }
.set-k { font-size: 14px; letter-spacing: .08em; text-shadow: var(--outline); }
.set-v { font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
.set-foot { display: flex; justify-content: center; margin-top: 10px; }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 16px;
  margin: 0;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: rgba(0, 0, 0, .45);
  outline: none;
  cursor: pointer;
  pointer-events: auto;
  touch-action: pan-y;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  box-sizing: border-box;
  width: 28px;
  height: 28px;
  margin-top: -6px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #ffd23f 55%, #ff9d1c);
  box-shadow: 0 3px 0 #b35e00;
}
input[type="range"]::-moz-range-thumb {
  box-sizing: border-box;
  width: 24px;
  height: 24px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #ffd23f 55%, #ff9d1c);
}
input[type="range"]::-moz-range-track { height: 12px; background: transparent; }
.seg-group { display: flex; gap: 8px; }
.seg-group button {
  flex: 1;
  min-height: 42px;
  border: 3px solid var(--ink);
  border-radius: 13px;
  background: linear-gradient(180deg, #4d3c86, #2a1f52);
  color: #fff;
  font: inherit;
  font-size: 14px;
  letter-spacing: .06em;
  text-shadow: var(--outline);
  box-shadow: 0 4px 0 #0a0616;
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
}
.seg-group button.on { background: linear-gradient(180deg, #ffe981, #ffa51f); box-shadow: 0 4px 0 #b35e00; }

/* ---------- results ---------- */
.res-panel { width: min(740px, 100%); }
.res-banner {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 10px 12px 12px;
  border: 4px solid var(--ink);
  border-radius: 20px;
}
.res-banner.victory { background: linear-gradient(180deg, #fff6b8, #ffb020); }
.res-banner.defeat { background: linear-gradient(180deg, #ffb0b0, #e0283f); }
.res-banner.draw { background: linear-gradient(180deg, #dfe6ff, #7b8cd6); }
.res-text { font-size: clamp(40px, 10vw, 66px); line-height: 1; letter-spacing: .04em; text-shadow: var(--outline-lg); }
.res-sub { font-size: 14px; letter-spacing: .08em; text-shadow: var(--outline); }
.res-body { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); align-items: start; gap: 12px; margin-top: 14px; }
.mvp {
  padding: 12px;
  text-align: center;
  border: 3px solid var(--ink);
  border-radius: 18px;
  background: linear-gradient(180deg, #4a3a86, #261c52);
  box-shadow: 0 5px 0 #0a0616;
}
.mvp-tag { font-size: 12px; letter-spacing: .2em; color: #ffd23f; text-shadow: var(--outline); }
.mvp-av {
  width: 66px;
  height: 66px;
  margin: 8px auto;
  display: grid;
  place-items: center;
  border: 4px solid var(--ink);
  border-radius: 50%;
  background: var(--c, #fff);
  font-size: 30px;
  text-shadow: var(--outline);
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .25);
}
.mvp-name { font-size: 20px; text-shadow: var(--outline); }
.mvp-stats { margin-top: 4px; font-size: 12px; opacity: .85; }
.res-table-wrap { min-width: 0; overflow-x: auto; }
.res-table { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: 13px; }
.res-table th { padding: 0 6px 2px; font-size: 10px; letter-spacing: .08em; text-align: right; white-space: nowrap; opacity: .75; }
.res-table td {
  padding: 7px 6px;
  text-align: right;
  white-space: nowrap;
  background: rgba(0, 0, 0, .28);
  font-variant-numeric: tabular-nums;
}
.res-table th:first-child, .res-table td:first-child { text-align: left; }
.res-table td:first-child { border-left: 6px solid var(--tc, #888); border-radius: 10px 0 0 10px; }
.res-table tr.t0 { --tc: var(--t0); }
.res-table tr.t1 { --tc: var(--t1); }
.res-table tr.me td { background: rgba(77, 255, 138, .2); }
.c-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.c-br { color: rgba(255, 255, 255, .8); }
.res-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 16px; }

/* ---------- HUD (sits under the screens; pointer-events none except its buttons) ---------- */
.hud {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s ease, visibility .25s ease;
}
.ui-root.in-match .hud { opacity: 1; visibility: visible; }
.hud-top {
  position: absolute;
  top: calc(var(--sat) + 8px);
  left: calc(var(--sal) + 8px);
  right: calc(var(--sar) + 8px);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 6px;
}
.hud-score {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
  padding: 5px 10px 9px;
  border: 3px solid var(--ink);
  border-radius: 14px;
  background: rgba(16, 10, 36, .85);
  box-shadow: 0 4px 0 #0a0616;
  white-space: nowrap;
}
.hud-score.t0 .hs-name { color: var(--t0); }
.hud-score.t1 .hs-name { color: var(--t1); }
.hs-name { font-size: 11px; letter-spacing: .08em; }
.hs-n { font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: var(--outline); }
.hs-tgt { font-size: 11px; opacity: .7; }
.hs-bar { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 4px; overflow: hidden; border-radius: 3px; background: rgba(255, 255, 255, .15); }
.hs-fill { display: block; height: 100%; transform-origin: left center; transform: scaleX(0); }
.hud-score.t0 .hs-fill { background: var(--t0); }
.hud-score.t1 .hs-fill { background: var(--t1); }
.hud-clock {
  padding: 4px 14px 6px;
  border: 3px solid var(--ink);
  border-radius: 999px;
  background: rgba(16, 10, 36, .85);
  box-shadow: 0 4px 0 #0a0616;
}
.hud-timer { display: inline-block; font-size: 24px; line-height: 1.1; letter-spacing: .05em; font-variant-numeric: tabular-nums; text-shadow: var(--outline); }
.hud.urgent .hud-timer { color: #ff6b6b; animation: beat .5s ease-in-out infinite alternate; }
.hud-pause {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 50px;
  height: 50px;
  padding: 0;
  border: 3px solid var(--ink);
  border-radius: 16px;
  background: linear-gradient(180deg, #5a4a8e, #2c2056);
  box-shadow: 0 4px 0 #0a0616, inset 0 2px 0 rgba(255, 255, 255, .2);
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
}
.hud-pause span { display: block; width: 7px; height: 20px; border-radius: 3px; background: #fff; box-shadow: 0 2px 0 var(--ink); }
.hud-pause:active { transform: translateY(3px); }
.hud-banner {
  position: absolute;
  left: 50%;
  top: 24%;
  transform: translate(-50%, -50%) scale(.85);
  opacity: 0;
  padding: 6px 18px;
  border: 3px solid var(--ink);
  border-radius: 999px;
  background: #fff;
  color: #1a1230;
  font-size: 15px;
  letter-spacing: .04em;
  white-space: nowrap;
  box-shadow: 0 4px 0 #0a0616;
  transition: opacity .2s ease, transform .2s ease;
}
.hud-banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.hud-banner.t0 { background: var(--t0); color: #fff; text-shadow: var(--outline); }
.hud-banner.t1 { background: var(--t1); color: #fff; text-shadow: var(--outline); }
.hud-status {
  position: absolute;
  top: calc(var(--sat) + 72px);
  left: calc(var(--sal) + 8px);
  width: min(158px, 44vw);
  display: grid;
  gap: 7px;
}
.hud-hp {
  position: relative;
  height: 22px;
  overflow: hidden;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: rgba(16, 10, 36, .85);
  box-shadow: 0 4px 0 #0a0616;
}
.hp-fill { position: absolute; inset: 0; background: linear-gradient(180deg, #b8ff6b, #22c55e); transform-origin: left center; transform: scaleX(1); }
.hud-hp.low .hp-fill { background: linear-gradient(180deg, #ffb0b0, #ff3b4e); }
.hp-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums; text-shadow: var(--outline); }
.hud-ammo { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
.seg { position: relative; height: 12px; overflow: hidden; border: 2px solid var(--ink); border-radius: 6px; background: rgba(16, 10, 36, .85); }
.seg-fill { position: absolute; inset: 0; background: linear-gradient(180deg, #fff1a0, #ffa51f); transform-origin: left center; transform: scaleX(0); }
.hud-super { display: flex; align-items: center; gap: 6px; }
.sp-track { position: relative; flex: 1; height: 12px; overflow: hidden; border: 2px solid var(--ink); border-radius: 6px; background: rgba(16, 10, 36, .85); }
.sp-fill { position: absolute; inset: 0; background: linear-gradient(180deg, #f1d4ff, #b35cf0); transform-origin: left center; transform: scaleX(0); }
.sp-lbl { min-width: 64px; font-size: 10px; letter-spacing: .08em; text-align: right; white-space: nowrap; color: #e7b8ff; text-shadow: var(--outline); }
.hud-super.ready .sp-track { animation: glow .7s ease-in-out infinite alternate; }
.hud-super.ready .sp-fill { background: linear-gradient(180deg, #ffffff, #e7b8ff); }
.hud-super.ready .sp-lbl { color: #fff; animation: beat .6s ease-in-out infinite alternate; }
.hud-feed {
  position: absolute;
  top: calc(var(--sat) + 72px);
  right: calc(var(--sar) + 8px);
  max-width: 56vw;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.kf {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: rgba(16, 10, 36, .82);
  font-size: 13px;
  white-space: nowrap;
  animation: feedIn .25s cubic-bezier(.2, 1.4, .4, 1) both;
}
.kf-n { max-width: 110px; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.kf-n.t0 { color: var(--t0); }
.kf-n.t1 { color: var(--t1); }
.kf-arrow { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid rgba(255, 255, 255, .75); }
.hud-toasts { position: absolute; left: 0; right: 0; top: 34%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast {
  padding: 7px 18px;
  border: 3px solid var(--ink);
  border-radius: 999px;
  background: #fff;
  color: #1a1230;
  font-size: 18px;
  letter-spacing: .03em;
  white-space: nowrap;
  box-shadow: 0 4px 0 #0a0616;
  animation: toastIn .3s cubic-bezier(.2, 1.5, .4, 1) both, toastOut .3s ease-in 1.7s forwards;
}
.toast.k-info { background: linear-gradient(180deg, #ffffff, #c9d3ff); }
.toast.k-good { background: linear-gradient(180deg, #b8ff6b, #22c55e); color: #0b2a12; }
.toast.k-bad { background: linear-gradient(180deg, #ffb0b0, #ff3b4e); color: #fff; text-shadow: var(--outline); }
.toast.k-crystal { background: linear-gradient(180deg, #f1d4ff, #b35cf0); color: #fff; text-shadow: var(--outline); }
.hud-respawn {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(10, 6, 24, .35);
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s ease, visibility .2s ease;
}
.hud-respawn.show { opacity: 1; visibility: visible; }
.rs-card {
  padding: 16px 30px 18px;
  border: 4px solid var(--ink);
  border-radius: 22px;
  background: linear-gradient(180deg, #3a2a6c, #1c1340);
  text-align: center;
  box-shadow: 0 8px 0 #0a0616;
}
.rs-lbl { display: block; font-size: 14px; letter-spacing: .14em; text-shadow: var(--outline); }
.rs-n { display: block; font-size: 66px; line-height: 1; color: #ffd23f; text-shadow: var(--outline-lg); font-variant-numeric: tabular-nums; }
.hud-labels { position: absolute; inset: 0; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; will-change: transform; }
.lbl-in { display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; transform: translate(-50%, -100%); }
.lbl-name { font-size: 13px; letter-spacing: .03em; text-shadow: var(--outline); }
.lbl.me .lbl-name { color: var(--me); }
.lbl-hp { position: relative; width: 66px; height: 8px; overflow: hidden; border: 2px solid var(--ink); border-radius: 6px; background: rgba(16, 10, 36, .8); }
.lbl-hp-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(1); }
.lbl.t0 .lbl-hp-fill { background: var(--t0); }
.lbl.t1 .lbl-hp-fill { background: var(--t1); }
.lbl.me .lbl-hp { box-shadow: 0 0 0 2px var(--me); }
.lbl-cr {
  display: none;
  align-items: center;
  gap: 3px;
  padding: 0 7px 0 5px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: #c46bff;
  font-size: 11px;
  line-height: 16px;
}
.lbl-cr.show { display: inline-flex; }
.lbl-cr i { width: 7px; height: 10px; background: #fff; clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); }

/* ---------- small phones: single-column select and results ---------- */
@media (max-width: 699px) {
  .sel-body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "prev" "cards" "maps" "foot"; gap: 10px; }
  .preview { min-height: 190px; }
  .card-av { width: 38px; height: 38px; font-size: 19px; }
  .card-name { font-size: 15px; }
  .sel-head h2 { font-size: 18px; }
  .res-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .c-br { display: none; }
  .res-table { font-size: 12px; }
  .set-row { grid-template-columns: 78px minmax(0, 1fr) 46px; gap: 8px; }
  .set-q { grid-template-columns: 78px minmax(0, 1fr); }
}

/* ---------- keyframes ---------- */
@keyframes pop { 0% { opacity: 0; transform: translateY(22px) scale(.92); } 100% { opacity: 1; transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(1deg); } }
@keyframes beat { from { transform: scale(1); } to { transform: scale(1.12); } }
@keyframes glow { from { box-shadow: 0 0 4px #e7b8ff; } to { box-shadow: 0 0 18px #ffffff, 0 0 34px #b35cf0; } }
@keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
@keyframes feedIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.8); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

@media (prefers-reduced-motion: reduce) {
  .anim, .slot.on, .toast, .kf, .title, .hud.urgent .hud-timer,
  .hud-super.ready .sp-track, .hud-super.ready .sp-lbl, .slot:not(.on) .slot-name {
    animation: none !important;
  }
}

  pointer-events:none;display:none;will-change:transform}
.bi-ring.bi-on{display:block}
.bi-ring-move{background:rgba(77,255,138,.16)}
.bi-ring-atk{background:rgba(255,179,71,.18)}
.bi-ring-sup{background:rgba(196,107,255,.2)}
.bi-ring i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;box-sizing:border-box;
  border-radius:50%;border:4px solid ${Ti};box-shadow:0 4px 0 ${Ti};will-change:transform}
.bi-ring-move i{background:radial-gradient(circle at 35% 30%,#fff 0,${Yv} 50%,#1fa35a 100%)}
.bi-ring-atk i{background:radial-gradient(circle at 35% 30%,#fff 0,${Zv} 50%,#e8701a 100%)}
.bi-ring-sup i{background:radial-gradient(circle at 35% 30%,#fff 0,${$v} 50%,#8a3fd6 100%)}
.bi-pad{position:absolute;width:124px;height:124px;border-radius:50%;pointer-events:auto;touch-action:none}
.bi-pad::before{content:"";position:absolute;left:-14px;top:-14px;right:-14px;bottom:-14px;border-radius:50%}
.bi-atk{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px))}
.bi-sup{width:88px;height:88px;right:calc(34px + env(safe-area-inset-right,0px));
  bottom:calc(156px + env(safe-area-inset-bottom,0px))}
.bi-face{position:absolute;left:0;top:0;right:0;bottom:0;box-sizing:border-box;border-radius:50%;
  border:5px solid ${Ti};display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 ${Ti};
  transition:transform .07s ease-out,box-shadow .07s ease-out,filter .2s,opacity .2s}
.bi-face svg{width:44%;height:44%;overflow:visible;filter:drop-shadow(0 3px 0 ${Ti})}
.bi-atk .bi-face{background:radial-gradient(circle at 34% 26%,#fff3d6 0,#ffb347 42%,#f0751f 100%)}
.bi-sup .bi-face{background:radial-gradient(circle at 34% 26%,#f3e1ff 0,#c46bff 46%,#8a3fd6 100%)}
.bi-pad.bi-down .bi-face{transform:translateY(4px) scale(.94);box-shadow:0 3px 0 ${Ti}}
.bi-sup.bi-dim .bi-face{filter:grayscale(.8) brightness(.75);opacity:.7}
.bi-sup.bi-ready .bi-face{animation:bi-pulse 1s ease-in-out infinite;
  box-shadow:0 7px 0 ${Ti},0 0 0 6px rgba(196,107,255,.5),0 0 28px 10px rgba(196,107,255,.55)}
@keyframes bi-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.bi-sup.bi-ready .bi-face{animation:none}}

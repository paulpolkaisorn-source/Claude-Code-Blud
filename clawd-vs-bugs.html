<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16110e">
<title>Clawd vs Bugs</title>
<style>
:root{--o:#D97757;--o2:#9c4b30;--ink:#fff4ea;--bg:#16110e;--pan:#2a201a;--pan2:#3b2d24;--gold:#f6c54e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;touch-action:none;overscroll-behavior:none}
#game{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;background:rgba(16,11,9,.88);padding:22px 40px;gap:12px;z-index:10}
.scr.on{display:flex}
#title{justify-content:center;background:rgba(16,11,9,.55);gap:16px}
#pause,#end{justify-content:center;gap:16px}
h1{margin:0;font-size:84px;letter-spacing:4px;color:var(--o);text-shadow:6px 6px 0 #4a2014;text-align:center}
h2{margin:0;font-size:32px;color:var(--o)}
h3{margin:0;font-size:22px;text-align:center}
h4{margin:0 0 4px;color:var(--o);font-size:17px}
p{margin:2px 0;font-size:13px;line-height:1.35}
.btn{font:inherit;font-weight:800;font-size:20px;color:var(--ink);background:var(--o);border:0;border-radius:12px;padding:11px 20px;box-shadow:0 5px 0 var(--o2);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--o2)}
.btn.alt{background:#4a3a30;box-shadow:0 5px 0 #231a15}
.btn.big{font-size:30px;padding:14px 40px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:340px}
.muted{opacity:.72}.small{font-size:14px}
.tag{font-size:22px;opacity:.9}
.logo{width:220px;image-rendering:pixelated}
.hdr{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-right:44px}
.coins{font-size:22px;font-weight:800;color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:#4a3a30;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.tab.on{background:var(--o)}.tab:disabled{opacity:.45}
.path{position:relative;width:1180px;height:370px;border-radius:18px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 4px #0005}
.wname{position:absolute;right:18px;bottom:10px;font-size:26px;font-weight:800;opacity:.35}
.node{position:absolute;width:120px;height:120px;border-radius:50%;border:5px solid #0006;font:inherit;font-weight:900;font-size:26px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 0 #0009;text-shadow:2px 2px 0 #0008}
.node .ty{font-size:12px;opacity:.95}.node .st{font-size:17px;color:var(--gold)}
.node.lock{filter:grayscale(1) brightness(.5);cursor:default}
.node.cur{animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.09);box-shadow:0 7px 0 #0009,0 0 28px #ffd27a}}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:100%;flex:1;min-height:0;align-content:start;padding:4px}
.card{font:inherit;color:#2a1d14;background:#f1dfbf;border:3px solid #6b4a2f;border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;gap:1px}
.card img{width:80px;height:69px}.card b{font-size:12px;text-align:center;line-height:1.1}.card span{font-size:13px;font-weight:800}
.card.on{opacity:.3}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:78px;height:92px;border:3px dashed #ffffff40;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;font:inherit;color:var(--ink);padding:0}
.slot.f{border:3px solid var(--o);background:#f1dfbf;color:#2a1d14;cursor:pointer;font-weight:800;font-size:12px}
.slot img{width:66px;height:57px}
.bugs img{width:56px;height:48px}
.bugp{display:flex;flex-direction:column;align-items:center;font-size:11px;width:76px;text-align:center}
.alm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;flex:1;min-height:0;align-content:start}
.ai{display:flex;gap:10px;background:var(--pan2);border-radius:12px;padding:8px;align-items:flex-start}
.ai img{width:96px;height:83px;flex:none;background:#0004;border-radius:8px}
.ai.lk img{filter:brightness(0) opacity(.55)}
.bo{color:#9dff8a}
.shopg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.si{background:var(--pan2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.si .btn{margin-top:auto;font-size:18px}
.stars{font-size:60px;color:var(--gold);letter-spacing:8px;text-shadow:3px 3px 0 #0008}
.unl{display:flex;gap:14px;align-items:center;background:var(--pan2);border-radius:14px;padding:12px 18px;max-width:760px}
.unl img{width:110px;height:95px}
#ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:30}
.ib{width:44px;height:44px;border-radius:10px;border:0;background:rgba(30,22,18,.9);color:#fff;font:800 17px ui-monospace,Menlo,monospace;cursor:pointer;box-shadow:0 3px 0 #000;padding:0}
.ib:active{transform:translateY(2px)}
#toast{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);background:rgba(20,14,10,.95);border:2px solid var(--o);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.on{opacity:1}
#rot{position:fixed;left:0;right:0;top:0;padding:8px;text-align:center;background:var(--o);color:#fff;font-weight:800;font-size:14px;display:none;z-index:50}
@media (orientation:portrait) and (max-width:820px){#rot{display:block}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="ctl">
    <button class="ib" id="bP" data-a="pause" title="Pause (Space)">❚❚</button>
    <button class="ib" id="bS" data-a="speed" title="Game speed">1x</button>
    <button class="ib" id="bF" data-a="fs" title="Fullscreen (F)">⛶</button>
  </div>
  <div id="title" class="scr"></div>
  <div id="map" class="scr"></div>
  <div id="choose" class="scr"></div>
  <div id="shop" class="scr"></div>
  <div id="alma" class="scr"></div>
  <div id="pause" class="scr"></div>

<script>
'use strict';
/* ================= constants & utils ================= */
const W=1280,H=720,ROWS=5,COLS=9,TW=96,TH=104,GX=232,GY=160,LX=GX+COLS*TW,LB=GY+ROWS*TH;
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const cxOf=c=>GX+c*TW+TW/2,cyOf=r=>GY+r*TH+TH/2;
const srand=s=>()=>(s=(s*16807)%2147483647)/2147483647;
let SC=1,BS=1;

/* ================= save ================= */
const SKEY='clawd-vs-bugs/save/v1';
const DEF={v:1,lvl:0,stars:{},units:['token','shooter'],coins:0,shop:{slots:0,start:0,dmg:0,auto:0,boost:0},zap:2,best:0,sound:1,seen:{},last:[]};

function load(){let s=clone(DEF);try{const j=JSON.parse(localStorage.getItem(SKEY)||'null');if(j&&j.v===1){s=Object.assign(s,j);s.shop=Object.assign(clone(DEF.shop),j.shop||{});s.stars=j.stars||{};s.seen=j.seen||{}}}catch(e){}return s}
let S=load(),saveWarned=false;
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('Could not save progress on this device')}}}

/* ================= data ================= */
const U={
token:{n:'Token Clawd',cost:50,cd:7.5,hp:300,col:'#E9B44C',d:'Mints 25 tokens every 24 seconds. Plant plenty early on!',b:'Instantly mints 150 tokens.'},
shooter:{n:'Shooter Clawd',cost:100,cd:7.5,hp:300,col:'#D97757',d:'Fires code bits at bugs in its lane. 20 damage per shot.',b:'Rapid-fire barrage.'},

lobber:{n:'Lobber Clawd',cost:100,cd:7.5,hp:300,col:'#7DAA4F',d:'Lobs curly braces over shields. 40 damage.',b:'Lobs a brace at every bug on screen.'},

};
const B={
bug:{n:'Bug',hp:200,sp:20,c:1,w:4,col:'#5DAE4B',d:'A garden-variety bug. Slow, hungry, everywhere.'},
flag:{n:'Flag Bug',hp:200,sp:26,c:1,w:0,col:'#5DAE4B',d:'Leads huge waves, waving its flag like it just merged to main.'},
hard:{n:'Hardhat Bug',hp:200,ar:370,sp:20,c:2,w:3,col:'#5DAE4B',d:'Wears a hard hat. Takes nearly 3x the hits.'},
racer:{n:'Race Condition',hp:200,sp:40,c:2,w:2,col:'#D94F4F',d:'Fast. Shows up before you expect it.'},
moth:{n:'Moth',hp:160,sp:30,c:2,w:2,fly:1,col:'#9C7A5B',d:'The original bug. Flies over Clawds; spikes, traps, Ctrl+C and GC can\'t touch it.'},
shield:{n:'Firewall Bug',hp:200,sh:800,sp:20,c:3,w:2,col:'#4FA0A6',d:'Its firewall blocks straight shots. Lobs, spikes, punches and blasts get around it.'},
hopper:{n:'Hopper Bug',hp:340,sp:38,c:3,w:2,col:'#8E5CC2',d:'Hops over the first Clawd it meets, then slows down.'},
fork:{n:'Fork Bomb',hp:400,sp:18,c:3,w:2,col:'#2F9E8F',d:'Splits into two Null Pointers when squashed. (GC deletes it cleanly.)'},

garg:{n:'Segfault',hp:3000,sp:12,c:12,w:.5,col:'#4B3B6B',d:'A giant. Smashes Clawds flat and throws a Null Pointer when hurt.'},

};
const SZ={garg:2.1,boss:2.7,mini:.62};
const BIG=b=>b.type==='garg'||b.type==='boss';
const WORLDS=[
{n:'Terminal Garden',g:['#83c75d','#76ba51'],top:'#203a24',road:'#8a7b67',sky:1,obs:0,deco:'#f7e27a'},
{n:'Midnight Debug',g:['#3e6075','#355367'],top:'#0d1226',road:'#3a3e55',sky:.55,obs:1,deco:'#9fd0ff'},
{n:'Cloud Server Farm',g:['#c4d1ec','#b4c3e4'],top:'#34436f',road:'#7e88a8',sky:1,obs:0,deco:'#4fb8e0'},
{n:'The Kernel',g:['#6d3232','#5e2a2a'],top:'#1a0808',road:'#3b2020',sky:.85,obs:1,deco:'#ff7a3d'},
{n:'Infinite Loop',g:['#6b4c8c','#5e427d'],top:'#1b1030',road:'#3a2c50',sky:1,obs:0,deco:'#d6a8ff'}];
// [type, waves, bug pool, conveyor pool]
const LV=[
['n',4,'bug'],['n',6,'bug hard'],['n',7,'bug hard racer'],['c',8,'bug hard racer','shooter wall mine bomb lobber'],['n',9,'bug hard racer server'],['b',10,'bug hard racer server'],
['n',8,'bug hard moth racer'],['n',9,'bug hard moth hopper'],['n',10,'bug hard moth hopper server racer'],['c',10,'bug hard moth hopper racer','frost double gc spike mine wall'],['s',8,'bug hard moth hopper server racer'],['b',12,'bug hard moth hopper server racer'],
['n',10,'bug hard shield racer moth'],['n',11,'bug hard shield fork racer'],['n',12,'bug hard shield fork hopper server moth'],['c',12,'bug shield fork hopper racer server','laser freeze punch compiler shooter wall'],['s',10,'bug hard shield fork hopper server'],['b',13,'bug hard shield fork hopper server moth racer'],
['n',12,'bug hard shield fork hopper server moth racer'],['n',13,'bug hard shield fork hopper server moth racer garg'],['n',14,'hard shield fork hopper server moth racer garg'],['c',14,'hard shield fork hopper server moth racer garg','tri double laser wall bomb freeze compiler frost'],['s',12,'bug hard shield fork hopper server moth racer'],['b',15,'hard shield fork hopper server moth racer garg']];
const LT={n:['Normal','Squash every bug before it reaches your repo.'],c:['Conveyor','Clawds roll in on a belt. No tokens needed!'],s:['Last Stand','No falling tokens. Build your defense with a big budget, then press SHIP IT.'],b:['Boss','A Segfault giant leads the final wave!']};
const UNLOCK=['wall','mine','lobber','bomb','frost','double','gc','spike','laser','freeze','punch','compiler','tri','twin'];
const TIPS={0:'Tap falling ✻ tokens to collect them. Plant Token Clawds for income, Shooter Clawds to fight!',1:'Glowing bugs drop ⚡ BOOSTS. Tap the boost card, then a Clawd, to supercharge it!',3:'Conveyor level: Clawds arrive on the belt for free. Use them fast!',5:'Boss level! The Segfault smashes anything in its way. Traps and rm -rf help.',6:'Night shift: fewer tokens fall and legacy code blocks your shots. Moths fly over Clawds!',10:'Last Stand: spend your budget wisely, then hit SHIP IT.',12:'Firewall Bugs block straight shots. Lob over them!',13:'Fork Bombs split in two when squashed. GC Clawds delete them cleanly.',23:'Final level. The Kernel Panic is coming. Good luck!'};
const SHOP=[
{k:'slots',n:'Extra Seed Slot',d:'Bring one more Clawd into every battle.',max:3,p:l=>[500,1000,2000][l]},
{k:'start',n:'Head Start',d:'+25 starting tokens every level.',max:4,p:l=>200*(l+1)},
{k:'dmg',n:'Sharper Claws',d:'+10% damage for every Clawd.',max:3,p:l=>[400,800,1600][l]},
{k:'auto',n:'Auto-Collector',d:'Tokens collect themselves after they land.',max:1,p:()=>1000},
{k:'boost',n:'Pre-Boosted',d:'Start every level holding one ⚡ Boost.',max:1,p:()=>800},
{k:'zap',n:'Zap Charge',d:'In battle tap the Zap card, then a bug, to fry it for 600 damage.',max:99,p:()=>150}];
const levelName=i=>i<0?'Endless · Infinite Loop':`${Math.floor(i/6)+1}-${i%6+1} ${WORLDS[Math.floor(i/6)].n}`;

/* ================= audio ================= */
let AC=null,NB=null;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d,ty,v,sl,dl){const t0=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t0+d);g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(d,v){if(!NB){NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.6),AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),t0=AC.currentTime;f.type='lowpass';f.frequency.value=900;s.buffer=NB;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t0);s.stop(t0+d)}
const SND={
shoot:()=>tone(640,.05,'square',.018,.5),hit:()=>tone(210,.06,'triangle',.05,.6),
collect:()=>{tone(988,.07,'sine',.07);tone(1480,.1,'sine',.06,0,.06)},plant:()=>tone(240,.12,'triangle',.09,1.9),
no:()=>tone(130,.14,'square',.04),click:()=>tone(720,.03,'square',.025),boom:()=>{noise(.55,.4);tone(90,.4,'sine',.15,.4)},
squash:()=>tone(170,.09,'sawtooth',.035,.4),chomp:()=>tone(105,.12,'sawtooth',.05,.6),laser:()=>tone(1500,.18,'sawtooth',.025,.3),
zap:()=>{noise(.3,.3);tone(1900,.28,'sawtooth',.05,.1)},boost:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.05,0,i*.06)),
wave:()=>{tone(330,.7,'sawtooth',.05,1.6);tone(330,.7,'sawtooth',.05,1.6,.75)},win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'square',.05,0,i*.12)),
lose:()=>[440,370,311,262,196].forEach((f,i)=>tone(f,.3,'triangle',.08,0,i*.2)),dig:()=>noise(.18,.2),ready:()=>tone(520,.15,'square',.05),go:()=>tone(880,.35,'square',.06,1.2)};
const RL={shoot:.07,hit:.05,chomp:.3,squash:.06,laser:.1},lastS={};
function sfx(n){if(!S.sound||!AC||AC.state!=='running')return;const t=AC.currentTime;if(lastS[n]!=null&&t-lastS[n]<(RL[n]||.03))return;lastS[n]=t;try{SND[n]()}catch(e){}}

/* ================= drawing helpers ================= */
const FONT=s=>`bold ${s}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
function rrp(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function rr(c,x,y,w,h,r,f){rrp(c,x,y,w,h,r);c.fillStyle=f;c.fill()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,6.2832);c.fill()}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,6.2832);c.fill()}
function txt(c,s,x,y,size,col,al,stroke){c.font=FONT(size);c.textAlign=al||'center';c.textBaseline='middle';if(stroke){c.lineJoin='round';c.lineWidth=stroke;c.strokeStyle='#1a0f0a';c.strokeText(s,x,y)}c.fillStyle=col;c.fillText(s,x,y)}
const shC={};
function shade(h,a){const k=h+a;if(shC[k])return shC[k];const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,p=Math.abs(a);r=Math.round((f-r)*p+r);g=Math.round((f-g)*p+g);b=Math.round((f-b)*p+b);return shC[k]='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}

// Clawd: the Claude Code mascot, built from its terminal block-art (18x5 quadrant grid, pixels are 1:2)
function clawd(c,x,y,s,col,o){

  if(c>=0&&c<COLS){const p=g.grid[q.r*COLS+c];if(p&&p.type==='compiler'&&q.last!==p.id&&q.x>=p.x-6){q.last=p.id;if(q.k==='norm'){q.k='fire';q.dmg*=2}else if(q.k==='ice')q.k='norm'}}
  for(const o of g.obs)if(o.r===q.r&&Math.abs(o.x-q.x)<22){q.dead=1;o.hp-=q.dmg;o.flash=.08;if(o.hp<=0){burst(o.x,o.y,'#9aa3b5',14,180);g.obs=g.obs.filter(z=>z!==o)}return}
  let hit=null;
  for(const b of g.bugs){if(b.r!==q.r||b.dead||b.st==='thrown'||b.x>W-10)continue;const hw=18*b.sz;if(q.x>b.x-hw-6&&q.x<b.x+hw&&(!hit||b.x<hit.x))hit=b}
  if(hit){q.dead=1;const shielded=hit.sh>0;hurt(hit,q.dmg,'straight');
    if(q.k==='ice'&&!shielded&&!hit.dead)hit.slow=10;
    if(q.k==='fire'){hit.slow=0;hit.frz=0;for(const o of g.bugs)if(o!==hit&&o.r===q.r&&!o.dead&&Math.abs(o.x-hit.x)<60)hurt(o,q.dmg/3,'lob');burst(q.x,q.y,'#ff8a1f',6,140)}
    else burst(q.x,q.y,q.k==='ice'?'#bfe9ff':'#D97757',3,90);sfx('hit')}
}

/* ---------- waves ---------- */
function isHuge(i){return G.end?i%10===9:(i===G.N-1||(G.N>=8&&i===Math.floor(G.N/2)-1))}
function waveBudget(i){return G.end?2+i*.8:(i===0?1:1+G.w*.4+i*(.24+.05*G.w+.03*G.l))}
function updWaves(dt){
  const g=G;if(g.wave>=g.N)return;
  if(g.annT>0){g.annT-=dt;if(g.annT<=0)spawnWave();return}
  g.waveT-=dt;g.since+=dt;
  let frac=1;if(g.wave>0){let hp=0;for(const b of g.waveBugs)if(!b.dead)hp+=b.hp+b.ar+b.sh;frac=hp/g.waveHP0}
  if(g.waveT<=0||(g.wave>0&&g.since>6&&frac<.3)){
    if(isHuge(g.wave)){g.annT=4;msg('A HUGE WAVE OF BUGS IS APPROACHING!','#ff6b5b',3.5);sfx('wave')}else spawnWave()}
}
function spawnWave(){
  const g=G,i=g.wave,huge=isHuge(i),fin=!g.end&&i===g.N-1;
  let bud=waveBudget(i)*(huge?1.7:1);const list=[];
  if(huge)list.push('flag');
  if(fin&&g.type==='b'){const n=[1,1,2,2][g.w];for(let k=0;k<n;k++)list.push('garg');if(g.w===3)list.push('boss');bud*=.5}
  if(g.end&&i>=14&&i%5===4)list.push('garg');
  const pool=g.pool.filter(t=>t!=='garg'||(g.end?i>=10:i>=4));
  let guard=0;
  while(bud>=1&&guard++<300){const o=pool.filter(t=>B[t].c<=bud&&B[t].w>0);if(!o.length)break;let tot=0;for(const t of o)tot+=B[t].w;let r=Math.random()*tot,t=o[0];for(const x of o){r-=B[x].w;if(r<=0){t=x;break}}list.push(t);bud-=B[t].c}
  if(!list.length)list.push(pool[0]||'bug');
  const rows=[0,1,2,3,4].sort(()=>Math.random()-.5),sp=[];
  list.forEach((t,k)=>{const r=t==='boss'?2:rows[k%5];sp.push(spawnBug(t,r,W+30+k*14+rnd(0,70)+(t==='boss'?140:0)))});
  if(g.idx!==0&&Math.random()<.6){const c=sp.filter(b=>!BIG(b));if(c.length)pick(c).glow=1}
  g.waveBugs=sp;g.waveHP0=sp.reduce((a,b)=>a+b.hp+b.ar+b.sh,0)||1;
  g.wave++;g.waveT=huge?30:24;g.since=0;
  if(fin)msg('FINAL WAVE','#ff6b5b',2.5);
}

/* ---------- pickups / mowers ---------- */
function collect(k){
  const g=G;if(k.fly||k.dead)return;k.fly=1;
  if(k.kind==='token'){g.tok+=k.val;k.tx=56;k.ty=40;sfx('collect')}
  else if(k.kind==='coin'){S.coins+=k.val;g.coins+=k.val;k.tx=640;k.ty=700;sfx('collect')}
  else if(k.kind==='boost'){g.boosts=Math.min(3,g.boosts+1);k.tx=931;k.ty=50;sfx('boost')}
  else if(k.kind==='prize'){k.tx=640;k.ty=320;win()}
}
function updPicks(dt){
  for(const k of G.picks){
    if(k.fly){const dx=k.tx-k.x,dy=k.ty-k.y;k.x+=dx*Math.min(1,dt*9);k.y+=dy*Math.min(1,dt*9);if(Math.abs(dx)+Math.abs(dy)<14)k.dead=1;continue}
    if(k.fall){k.y+=75*dt;if(k.y>=k.gy){k.y=k.gy;k.fall=0}}
    else if(k.vy!=null){k.vy+=700*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.x=clamp(k.x,GX+10,LX-10);if(k.vy>0&&k.y>=k.gy){k.y=k.gy;k.vy=null}}
    else k.landT+=dt;
    k.life-=dt;if(k.life<=0)k.dead=1;
    if(S.shop.auto&&k.kind==='token'&&k.landT>.5)collect(k);
    if(k.kind==='prize'&&k.landT>3.5)collect(k);
  }
}
function updMowers(dt){
  for(const m of G.mowers){if(!m.on)continue;m.x+=540*dt;
    for(const b of G.bugs){if(b.r!==m.r||b.dead)continue;if(Math.abs(b.x-m.x)<30*b.sz+10){if(b.type==='boss'){hurt(b,2500,'explode');m.on=0;m.gone=1;boomFX(m.x,cyOf(m.r),60);break}else{killBug(b);burst(b.x,b.y,'#ffffff',6)}}}
    if(m.x>W+40){m.on=0;m.gone=1}}
}
function updParts(dt){const g=G;for(const p of g.parts){p.l-=dt;if(!p.ring){p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}}g.parts=g.parts.filter(p=>p.l>0);for(const t of g.texts){t.l-=dt;t.y-=40*dt}g.texts=g.texts.filter(t=>t.l>0)}

/* ---------- main update ---------- */
function update(dt){
  const g=G;g.t+=dt;
  if(g.shake>0)g.shake-=dt;if(g.tipT>0&&g.phase!=='intro')g.tipT-=dt;if(g.msg){g.msg.t-=dt;if(g.msg.t<=0)g.msg=null}
  for(const o of g.obs)if(o.flash>0)o.flash-=dt;
  updParts(dt);
  if(g.phase==='intro'){const pv=g.introT;g.introT-=dt;if((pv>1.6&&g.introT<=1.6)||(pv>.8&&g.introT<=.8))sfx('ready');
    if(g.introT<=0){g.phase=g.type==='s'?'setup':'play';sfx('go');if(g.type==='s')msg('Build your defense, then SHIP IT!','#ffe7a0',3.5)}return}
  if(g.phase==='lost'){g.lostT-=dt;if(g.lostT<=0&&!g.lostShown){g.lostShown=1;showEnd(false)}return}
  for(const s of g.seeds){if(s.cd>0)s.cd-=dt;if(s.dx>0)s.dx=Math.max(0,s.dx-dt*700)}
  if(g.phase==='play'){
    if(g.type!=='s'&&g.type!=='c'&&g.th.sky>0){g.skyT-=dt;if(g.skyT<=0){g.skyT=rnd(8,11)/g.th.sky;spawnPick('token',rnd(GX+30,LX-30),-20,{fall:1,gy:rnd(GY+60,LB-40)})}}
    if(g.beltPool){g.beltT-=dt;if(g.beltT<=0){if(g.seeds.length<8){let t=pick(g.beltPool);if((t==='bomb'||t==='freeze')&&Math.random()<.5)t=pick(g.beltPool);const i=g.seeds.length;g.seeds.push({t,cd:0,belt:1,dx:Math.max(0,820-(12+i*78))})}g.beltT=g.seeds.length<3?1.5:rnd(3.2,5)}}
    updWaves(dt);
  }
  for(const p of g.plants)if(!p.dead)updPlant(p,dt);
  for(const q of g.projs)if(!q.dead)updProj(q,dt);
  for(const b of g.bugs)updBug(b,dt);
  if(g.phase==='lost')return;
  updMowers(dt);updPicks(dt);
  for(const bm of g.beams)bm.t-=dt;
  g.plants=g.plants.filter(p=>!p.dead);g.projs=g.projs.filter(q=>!q.dead);g.bugs=g.bugs.filter(b=>!(b.gone||(b.dead&&b.dt>.6)));g.picks=g.picks.filter(k=>!k.dead);g.beams=g.beams.filter(b=>b.t>0);
  if(g.phase==='play'&&!g.end&&g.wave>=g.N&&g.annT<=0&&!g.bugs.some(b=>!b.dead)){
    g.phase='won';const lk=g.lastKill||{x:LX-150,y:cyOf(2)};const y=clamp(lk.y,GY+50,LB-50);
    spawnPick('prize',clamp(lk.x,GX+80,LX-60),y-30,{vy:-260,vx:-40,gy:y});msg('All bugs squashed! Grab the prize!','#9dff8a',2.5);
  }
}
function lose(){const g=G;if(g.phase==='lost'||g.phase==='done')return;g.phase='lost';g.lostT=2.2;msg('THE BUGS SHIPPED TO PROD!','#ff6b5b',3);sfx('lose');g.sel=-1;g.mode=null}
function win(){
  const g=G;if(g.phase==='done')return;g.phase='done';
  const stars=1+(g.mowUsed===0?1:0)+(g.lost===0?1:0),first=g.idx===S.lvl;
  S.stars[g.idx]=Math.max(S.stars[g.idx]||0,stars);
  let unit=null;const coins=first?150+50*g.w:100+25*g.w;
  if(first){S.lvl=Math.min(LV.length,S.lvl+1);const u=UNLOCK[g.idx];if(u&&!S.units.includes(u)){S.units.push(u);unit=u}}
  S.coins+=coins;save();sfx('win');
  setTimeout(()=>{if(G===g)showEnd(true,{stars,unit,coins})},900);

/* ================= input ================= */
function hudHit(x,y){
  const g=G;if(y<6||y>96)return null;
  const base=g.type==='c'?12:110;
  for(let i=0;i<g.seeds.length;i++){const sx=base+i*78+(g.seeds[i].dx||0);if(x>=sx&&x<=sx+74)return{seed:i}}
  if(x>=816&&x<=890)return{card:'shovel'};if(x>=894&&x<=968)return{card:'boost'};if(x>=972&&x<=1046)return{card:'zap'};
  return null;
}
function selSeed(i){const g=G,s=g.seeds[i];if(!s||g.phase==='intro')return;if(g.sel===i){g.sel=-1;return}
  if(s.cd>0||(g.type!=='c'&&g.tok<U[s.t].cost)){sfx('no');return}g.sel=i;g.mode=null;sfx('click')}
function setMode(m){const g=G;if(g.mode===m){g.mode=null;return}
  if(m==='boost'&&g.boosts<=0){sfx('no');toast('No boosts. Squash glowing bugs to get some!');return}
  if(m==='zap'&&S.zap<=0){sfx('no');toast('No Zap charges. Buy them in the Shop!');return}
  g.mode=m;g.sel=-1;sfx('click')}
function onTap(x,y){
  const g=G;if(g.phase==='intro'||g.phase==='lost'||g.phase==='done')return;
  if(g.phase==='setup'&&x>540&&x<740&&y>604&&y<664){g.phase='play';g.waveT=3;sfx('wave');msg('Here they come!','#ffe7a0',2);return}
  const h=hudHit(x,y);
  if(h){if(h.seed!=null)selSeed(h.seed);else setMode(h.card);return}
  let best=null,bd=48;for(const k of g.picks){if(k.fly)continue;const d=Math.hypot(k.x-x,k.y-y);if(d<bd){bd=d;best=k}}
  if(best){collect(best);return}
  if(g.mode==='zap'){let tb=null,td=1e9;for(const b of g.bugs){if(b.dead||b.x>W)continue;const by=b.y+(b.fly?-40:0)+(b.yo||0),d=Math.hypot(b.x-x,by-y);if(d<55*b.sz&&d<td){td=d;tb=b}}
    if(tb){const by=tb.y+(tb.fly?-40:0);hurt(tb,600,'explode');S.zap--;save();g.beams.push({zap:1,x:tb.x,y:by,t:.3,mt:.3});sfx('zap');g.shake=.15;g.mode=null}return}
  const c=Math.floor((x-GX)/TW),r=Math.floor((y-GY)/TH),inG=r>=0&&r<ROWS&&c>=0&&c<COLS&&x>=GX&&y>=GY;
  if(g.sel>=0){
    const s=g.seeds[g.sel];
    if(s&&inG&&canPlace(r,c)){place(s.t,r,c);
      if(g.type==='c'){g.seeds.splice(g.sel,1);for(let j=g.sel;j<g.seeds.length;j++)g.seeds[j].dx=(g.seeds[j].dx||0)+78}
      else{g.tok-=U[s.t].cost;s.cd=g.phase==='setup'?0:U[s.t].cd}
      g.sel=-1}
    else if(!inG)g.sel=-1;else sfx('no');
    return}
  if(g.mode==='shovel'){if(inG){const p=g.grid[r*COLS+c];if(p){removePlant(p);burst(p.x,p.y+30,'#7a5a3a',10,140);sfx('dig');g.mode=null}}else g.mode=null;return}
  if(g.mode==='boost'){if(inG){const p=g.grid[r*COLS+c];if(p&&applyBoost(p)){g.boosts--;g.mode=null}}else g.mode=null;return}
}
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{audioInit();const p=toGame(e);mouse.x=p.x;mouse.y=p.y;mouse.in=true;mouse.touch=e.pointerType!=='mouse';if(state==='play'&&G)onTap(p.x,p.y)});
cv.addEventListener('pointermove',e=>{const p=toGame(e);mouse.x=p.x;mouse.y=p.y;mouse.in=true;mouse.touch=e.pointerType!=='mouse';
  if(state==='play'&&G&&e.pointerType==='mouse')for(const k of G.picks)if(k.kind==='coin'&&!k.fly&&Math.hypot(k.x-p.x,k.y-p.y)<40)collect(k)});

addEventListener('keydown',e=>{
  audioInit();const k=e.key.toLowerCase();

function resize(){
  const iw=window.innerWidth,ih=window.innerHeight,k=Math.min(iw/W,ih/H);
  $('#game').style.transform=`translate(${Math.round((iw-W*k)/2)}px,${Math.round((ih-H*k)/2)}px) scale(${k})`;
  const dpr=window.devicePixelRatio||1;SC=Math.min(2,Math.max(.5,k*dpr));cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);BS=Math.min(2,Math.ceil(SC*2)/2);
}
addEventListener('resize',resize);
document.addEventListener('fullscreenchange',resize);document.addEventListener('webkitfullscreenchange',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')pauseGame();save()}});
addEventListener('pagehide',save);
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  try{if(state==='play'&&G){for(let i=0;i<G.spd;i++){update(dt);if(state!=='play'||!G)break}}render(now/1000)}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
window.CVB={startLevel,update,place,get G(){return G},get S(){return S},showMap,showChoose};
resize();showTitle();requestAnimationFrame(loop);
</script>
</body>
</html>

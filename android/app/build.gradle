plugins {
    id "com.android.application"
}

android {
    namespace "app.cavityshield"
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "app.cavityshield"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Personal app key, committed so any rebuild can update the installed app.
            storeFile rootProject.file("keystore/cavityshield.jks")
            storePassword "cavityshield"
            keyAlias "cavityshield"
            keyPassword "cavityshield"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The app UI is the same page as the web version: ../cavity-shield.html, wrapped in a document skeleton.
def webSrc = rootProject.file("../cavity-shield.html")
def webOut = file("src/main/assets/index.html")
tasks.register("syncWeb") {
    inputs.file webSrc
    outputs.file webOut
    doLast {
        webOut.parentFile.mkdirs()
        webOut.setText('<!doctype html><html><head><meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
            '<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>' +
            '</head><body>' + webSrc.getText("UTF-8") + '</body></html>', "UTF-8")
    }
}
preBuild.dependsOn "syncWeb"
